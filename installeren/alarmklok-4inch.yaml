# =============================================================================
#  4"-klok (Waveshare ESP32-S3-Touch-LCD-4, Bosun-bord)
#
#  Installeren via de ESPHome-add-on in Home Assistant: maak in de add-on een
#  nieuw apparaat "alarmklok-4inch" aan, open het met Edit en vervang de inhoud
#  door dit bestand. De rest (onderdelen, plaatjes, geluiden) haalt ESPHome
#  zelf van GitHub, bij elke Install de nieuwste versie (refresh: 0s).
#
#  In /config/esphome/secrets.yaml (knop Secrets in de add-on) horen:
#    wifi_ssid, wifi_password, api_encryption_key, fallback_ap_password
#    github_token: een fine-grained token van GitHub met alleen leesrecht
#                  (Contents: Read-only) op deze repo; nodig zolang de repo
#                  privé is
#
#  Wat waar?
#  - Hieronder (substitutions): alleen wat bij het bouwen vast moet liggen.
#    Na een wijziging: Install.
#  - Al het andere stel je in Home Assistant in, zonder te flashen:
#    Instellingen -> Apparaten -> deze klok -> Configuratie (of het dashboard
#    uit homeassistant/dashboard/). Daar staan de tegels (naam, entiteit,
#    icoon), Thermostaat (airco), Rolluik (gordijn), Mediaspeler, Dimlamp,
#    Lichtsensor, pagina's, klokontwerpen, kleuren, nachtstand en wekkers.
#    Zet die NIET hier: een waarde hier is alleen de beginwaarde bij de
#    allereerste start; daarna onthoudt de klok wat in Home Assistant staat en
#    doet een wijziging hier niets meer.
# =============================================================================

substitutions:
  name: alarmklok-4inch
  friendly_name: Alarmklok 4 inch
  # Scherm op z'n kop in de Bosun-behuizing? Haal het hekje weg (draaien
  # kost wat snelheid; 0 is het snelst):
  # draaiing: "180"
  # Alleen via deze regels in te stellen (haal het hekje weg):
  # temperatuur_sensor: sensor.buitentemperatuur   # buitentemperatuur op de klok
  # weer_entiteit: weather.forecast_home           # weericoon (klok Vierkant)
  # werkdag_sensor: binary_sensor.workday_sensor   # "Niet op feestdagen"
  # tijdzone: Europe/Amsterdam
  # breedtegraad: "52.09"                          # plaats voor klok Zon
  # lengtegraad: "5.12"

packages:
  alarmklok:
    url: https://github.com/Perjan-smul/alarmklok-domotics-controller
    ref: claude/alarm-clock-home-assistant-ljscuo
    username: Perjan-smul
    password: !secret github_token
    files: [esphome/alarmklok-4inch.yaml]
    # Bluetooth-proxy (o.a. SwitchBot Curtain 3) erbij? Gebruik dan deze regel
    # in plaats van de regel hierboven. Kost ± 23 kB intern geheugen; start
    # alleen als er genoeg vrij is (sensor "Bluetooth-proxy" in HA).
    # files: [esphome/alarmklok-4inch.yaml, esphome/onderdelen/bluetooth-proxy-s3.yaml]
    # 0s: bij elke Install eerst de nieuwste versie van GitHub halen
    refresh: 0s
