# Controleert bij elke push en pull request dat de rekenlogica klopt en dat
# alle klokken nog compileren, en maakt echte schermafdrukken van de 4"-klok
# (computer-build, zie esphome/voorbeeld-4inch.yaml). Een geslaagde build zegt niets over
# de echte hardware; dat blijft met de hand testen.
name: Controle

# Pushes alleen op de hoofdbranch; werk op andere branches wordt via de pull
# request gecontroleerd (anders draait alles dubbel). Met de hand starten kan altijd.
on:
  push:
    branches: [claude/alarm-clock-home-assistant-ljscuo]
  pull_request:
  workflow_dispatch:

# Een nieuwe push op dezelfde branch of PR stopt de run die nog bezig is
concurrency:
  group: controle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ESPHOME_VERSION: "2026.10.2"

jobs:
  test:
    name: Rekenlogica (alarmklok.h)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test compileren en draaien
        run: |
          g++ -std=c++17 -Wall -Werror -o test_alarmklok tests/test_alarmklok.cpp
          ./test_alarmklok

  compileren:
    name: Firmware ${{ matrix.klok }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        klok: [alarmklok, alarmklok-4inch, alarmklok-4b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - name: ESPHome installeren
        run: pip install "esphome==${ESPHOME_VERSION}"
      - name: Test-secrets aanmaken
        run: tools/test-secrets.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            esphome/.esphome
          # Met de precieze Python-versie: de build onthoudt het pad naar ninja
          # in die Python-map; na een nieuwe Python op de runner faalt CMake
          # anders met "ninja --version: no such file or directory"
          key: esphome-${{ env.ESPHOME_VERSION }}-py${{ steps.python.outputs.python-version }}-${{ matrix.klok }}-${{ hashFiles('esphome/**/*.yaml', 'esphome/**/*.h') }}
          restore-keys: |
            esphome-${{ env.ESPHOME_VERSION }}-py${{ steps.python.outputs.python-version }}-${{ matrix.klok }}-
      - name: Configuratie controleren
        working-directory: esphome
        run: esphome config ${{ matrix.klok }}.yaml > /dev/null
      - name: Compileren
        working-directory: esphome
        # Lukt het niet met de build uit de cache, dan nog één keer schoon
        run: |
          esphome compile ${{ matrix.klok }}.yaml || {
            echo "::warning::Build uit de cache mislukt, opnieuw zonder cache"
            esphome clean ${{ matrix.klok }}.yaml
            esphome compile ${{ matrix.klok }}.yaml
          }

  afdrukken:
    name: Schermafdrukken 4" (computer-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ESPHome en Pillow installeren
        run: pip install "esphome==${ESPHOME_VERSION}" pillow
      - name: Test-secrets aanmaken
        run: tools/test-secrets.sh
      - name: Bouwen, draaien en afdrukken maken
        run: tools/afdrukken.sh afdrukken
      - uses: actions/upload-artifact@v4
        with:
          name: schermafdrukken-4inch
          path: afdrukken/*.png
          # Na een week weg, zodat ze niet blijven meetellen voor de opslag
          retention-days: 7
