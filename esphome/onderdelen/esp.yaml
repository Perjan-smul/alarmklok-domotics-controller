# =============================================================================
#  Alles wat alleen op een ESP32 werkt: wifi, internettijd, updates en
#  diagnose. Hoort bij elke klok (alarmklok*.yaml); de computer-build voor
#  schermafdrukken (voorbeeld-4inch.yaml) laat dit bestand weg.
# =============================================================================

ota:
  - platform: esphome
    # Gebruikt dezelfde sleutel als de api (kern.yaml)
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Stroombesparing maakt wifi op deze borden onbetrouwbaar (ESPHome-issue
  # #13636, HA-forum); herstart pas na 30 min zonder wifi (zoals EspControl)
  power_save_mode: none
  reboot_timeout: 30min
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:

# Hoofdklok: internettijd (NTP), zodat de wekker ook zonder Home Assistant werkt
time:
  - platform: sntp
    id: klok
    timezone: ${tijdzone}
    on_time:
      - seconds: 0
        then:
          - script.execute: elke_minuut
    on_time_sync:
      - script.execute: tijd_gesynchroniseerd

# Diagnose: helpt bij onverwachte herstarts of geheugenlekken (zie README)
debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: Laatste herstart oorzaak
      entity_category: diagnostic

sensor:
  - platform: debug
    free:
      name: Vrij geheugen
      entity_category: diagnostic
    block:
      name: Grootste vrije blok
      entity_category: diagnostic
    min_free:
      name: Minst vrije geheugen
      entity_category: diagnostic
    psram:
      name: Vrij PSRAM
      entity_category: diagnostic
  - platform: wifi_signal
    id: wifi_signaal
    name: WiFi signaal
    update_interval: 60s
    entity_category: diagnostic
    # Drie minuten achter elkaar zwak signaal: zoek een sterker access point
    # (mesh of meerdere AP's). Niet als de wekker afgaat of snoozet.
    on_value:
      - lambda: |-
          id(zwak_signaal_minuten) = x < -75 ? id(zwak_signaal_minuten) + 1 : 0;
      - if:
          condition:
            lambda: return id(zwak_signaal_minuten) >= 3 && !id(gaat_af) && !id(snoozet);
          then:
            - lambda: id(zwak_signaal_minuten) = 0;
            - logger.log: "Zwak wifi-signaal: zoeken naar een sterker access point"
            - wifi.roam:

globals:
  # Minuten achter elkaar met zwak wifi-signaal (zie wifi_signaal)
  - id: zwak_signaal_minuten
    type: int
    initial_value: "0"

button:
  - platform: template
    name: Sterker access point zoeken
    icon: mdi:wifi-sync
    entity_category: diagnostic
    on_press:
      - wifi.roam:
