# Naam, entiteit, icoon en soort van tegel ${nr}. De waarden uit
# instellingen.yaml zijn alleen de standaard; daarna pas je ze aan in Home
# Assistant (Configuratie van de klok of het dashboard uit
# homeassistant/dashboard/), zonder opnieuw te flashen.
#  - Naam, icoon en soort veranderen meteen op het scherm.
#  - Een andere entiteit laat de klok na 5 s even herstarten, zodat hij de
#    status (aan/uit) van de nieuwe entiteit volgt.
#  - Een lege entiteit verbergt de tegel; tegels boven de gekozen indeling
#    ("4/6/9 tegels", paginas.yaml) ook.
#  - Soort: Automatisch (scènes, scripts en knoppen alleen aanzetten, de rest
#    aan/uit met status), Aan/uit of Scène/script.
# Vars: nr, titel, naam, entity, icoon, index (1-9) en aantal (global met het
# aantal tegels op deze pagina).
text:
  - platform: template
    id: tegel_${nr}_naam
    name: ${titel} naam
    icon: mdi:form-textbox
    entity_category: config
    mode: text
    max_length: 24
    optimistic: true
    restore_value: true
    initial_value: "${naam}"
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: tegel_${nr}_tonen

  - platform: template
    id: tegel_${nr}_entiteit
    name: ${titel} entiteit
    icon: mdi:link-variant
    entity_category: config
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: "${entity}"
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: tegel_${nr}_tonen
            - script.execute: tegels_herladen

select:
  - platform: template
    id: tegel_${nr}_icoon
    name: ${titel} icoon
    icon: mdi:emoticon-outline
    entity_category: config
    optimistic: true
    restore_value: true
    # Namen zoals op pictogrammers.com/library/mdi; de codes staan in
    # alarmklok::icoon() in alarmklok.h en in het font f_icoon.
    options:
      - lightbulb
      - lightbulb-on
      - lightbulb-group
      - ceiling-light
      - floor-lamp
      - desk-lamp
      - lamp
      - blinds
      - window-shutter
      - roller-shade
      - curtains
      - music
      - radio
      - radio-tower
      - speaker
      - television
      - movie-open
      - fan
      - radiator
      - thermostat
      - power-sleep
      - weather-night
      - weather-sunset-up
      - home
      - sofa
      - bed
      - silverware-fork-knife
      - lightning-bolt
    initial_option: ${icoon}
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: tegel_${nr}_tonen

  - platform: template
    id: tegel_${nr}_soort
    name: ${titel} soort
    icon: mdi:gesture-tap
    entity_category: config
    optimistic: true
    restore_value: true
    options: [Automatisch, Aan/uit, Scène/script]
    initial_option: Automatisch
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: tegel_${nr}_tonen
            - script.execute: tegels_herladen

globals:
  # Gedraagt de tegel zich als schakelaar (status, lang drukken) of als scène?
  - id: tegel_${nr}_schakelaar
    type: bool
    initial_value: "true"
  # Laatste status en percentage (0-100, -1 = geen) uit Home Assistant
  - id: tegel_${nr}_status
    type: std::string
  - id: tegel_${nr}_procent
    type: int
    initial_value: "-1"

script:
  - id: tegel_${nr}_tonen
    then:
      - lambda: |-
          lv_label_set_text(id(tegel_${nr}_icoon_tekst),
                            alarmklok::icoon(id(tegel_${nr}_icoon).current_option().str()));
          lv_label_set_text(id(tegel_${nr}_naam_tekst), id(tegel_${nr}_naam).state.c_str());
          id(tegel_${nr}_schakelaar) = alarmklok::tegel_is_schakelaar(
              id(tegel_${nr}_soort).current_option().str(), id(tegel_${nr}_entiteit).state);
          if (id(tegel_${nr}_entiteit).state.empty() || ${index} > id(${aantal}))
            lv_obj_add_flag(id(tegel_${nr}), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_clear_flag(id(tegel_${nr}), LV_OBJ_FLAG_HIDDEN);
      - script.execute: tegel_${nr}_status_tonen

  # Statusregel, schakelaartje en "aan"-kleur; ook de detailpagina als die
  # deze tegel toont
  - id: tegel_${nr}_status_tonen
    then:
      - lambda: |-
          const std::string entiteit = id(tegel_${nr}_entiteit).state;
          const std::string dom = alarmklok::domein(entiteit);
          const std::string &status = id(tegel_${nr}_status);
          const bool schakelaar = id(tegel_${nr}_schakelaar);
          const bool aan = schakelaar && alarmklok::status_aan(status);
          lv_label_set_text(id(tegel_${nr}_status_tekst),
                            alarmklok::tegel_status(dom, status, id(tegel_${nr}_procent), schakelaar).c_str());
          if (schakelaar)
            lv_obj_clear_flag(id(tegel_${nr}_schakelaar_widget), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_add_flag(id(tegel_${nr}_schakelaar_widget), LV_OBJ_FLAG_HIDDEN);
          // Aan: lichtere kaart, warm geel icoon
          lv_obj_set_style_text_color(id(tegel_${nr}_icoon_tekst),
                                      lv_color_hex(aan ? 0xF5C35A : 0xE8EAED), 0);
          if (aan) {
            lv_obj_add_state(id(tegel_${nr}), LV_STATE_CHECKED);
            lv_obj_add_state(id(tegel_${nr}_schakelaar_widget), LV_STATE_CHECKED);
          } else {
            lv_obj_clear_state(id(tegel_${nr}), LV_STATE_CHECKED);
            lv_obj_clear_state(id(tegel_${nr}_schakelaar_widget), LV_STATE_CHECKED);
          }
          if (schakelaar && !entiteit.empty() && id(detail_entiteit) == entiteit) {
            id(detail_status) = status;
            id(detail_procent) = id(tegel_${nr}_procent);
            id(detail_tonen).execute();
          }

  # Lang drukken: detailpagina voor deze tegel
  - id: tegel_${nr}_detail
    then:
      - lambda: |-
          id(detail_entiteit) = id(tegel_${nr}_entiteit).state;
          id(detail_naam) = id(tegel_${nr}_naam).state;
          id(detail_icoon) = id(tegel_${nr}_icoon).current_option().str();
          id(detail_status) = id(tegel_${nr}_status);
          id(detail_procent) = id(tegel_${nr}_procent);
      - script.execute: detail_openen

  # Volgt de status (en het percentage) van de entiteit in Home Assistant.
  # Draait bij het opstarten (zie on_boot in kern.yaml).
  - id: tegel_${nr}_volgen
    then:
      - lambda: |-
          const std::string entiteit = id(tegel_${nr}_entiteit).state;
          if (entiteit.empty())
            return;
          api::global_api_server->subscribe_home_assistant_state(
              entiteit, optional<std::string>(),
              std::function<void(StringRef)>([](StringRef status) {
                id(tegel_${nr}_status) = status.str();
                id(tegel_${nr}_status_tonen).execute();
              }));
          const std::string dom = alarmklok::domein(entiteit);
          const char *attribuut = alarmklok::waarde_attribuut(dom);
          const bool schakelaar = alarmklok::tegel_is_schakelaar(id(tegel_${nr}_soort).current_option().str(), entiteit);
          if (schakelaar && attribuut[0] != '\0') {
            api::global_api_server->subscribe_home_assistant_state(
                entiteit, optional<std::string>(attribuut),
                std::function<void(StringRef)>([dom](StringRef waarde) {
                  id(tegel_${nr}_procent) = alarmklok::waarde_procent(dom, waarde.str());
                  id(tegel_${nr}_status_tonen).execute();
                }));
          }
