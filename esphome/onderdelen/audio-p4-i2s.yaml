# =============================================================================
#  Audiotransport zonder echo-onderdrukking (7"): ESPHome's eigen I2S.
#  Speaker (48 kHz) en microfoon (16 kHz) delen de klokpinnen; ESPHome schakelt
#  tussen afspelen en opnemen. Het wekwoord pauzeert daarom standaard tijdens
#  muziek (spraak.yaml, "Luisteren tijdens muziek").
#  Hoort bij audio-p4.yaml.
# =============================================================================

substitutions:
  muziek_luisteren_standaard: RESTORE_DEFAULT_OFF

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: i2c_bus
    address: ${es7210_adres}
    bits_per_sample: 16bit
    sample_rate: 16000

# Voor de spraakassistent (spraak.yaml). Het wekwoord heeft 16 kHz nodig.
microphone:
  - platform: i2s_audio
    id: microfoon
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO11
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    # De ES7210 geeft twee microfoons op links/rechts; spraak.yaml gebruikt
    # kanaal 0 (zoals in de werkende P4-86-configuratie van chrisdunnname)
    channel: stereo

speaker:
  - platform: i2s_audio
    id: hw_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    buffer_duration: 100ms
