# =============================================================================
#  Instelbare pagina's (allemaal in Home Assistant, zonder te flashen)
#
#   - Pagina 1-6: welke pagina na de klok komt bij links/rechts swipen
#     (Verlichting, Klimaat, Muziek, Scènes, Wekker, Camera of Uit). Camera
#     alleen op borden met een camera (P4, zie camera.yaml).
#   - Indeling van Verlichting: Rijen (5 dimbare rijen), Rijen + knoppen
#     (4 dimbare rijen en daaronder tegel 5-8 als knoppen naast elkaar) of
#     4, 6 of 9 tegels; Scènes: 4, 6 of 9 tegels.
#   - Kleurthema en accentkleur.
#   - Welke klokontwerpen meedoen bij omhoog/omlaag swipen op de klok.
#   - Swipe-animatie: aan = de pagina schuift mee (vloeiend, kost rekenwerk);
#     uit = de nieuwe pagina staat er meteen (snel, standaard op de 4").
#
#  Navigatie: de tileview scrolt zelf niet meer; een veeg naar links/rechts
#  (LVGL-gebaar, niet op schuiven en draaiknoppen) gaat naar de volgende/vorige
#  pagina in de gekozen volgorde.
#
#  Het schermbestand levert: tileview tv_hoofd met de tegels vak_klok,
#  vak_verlichting, vak_klimaat, vak_muziek, vak_scenes en vak_wekker; de
#  rasters raster_verlichting en raster_scenes met tegel_licht_1-9 en
#  tegel_scene_1-9; dimmer_kaart; de stijlen pagina_stijl, kaart, tegel_stijl,
#  titel en klok_accent; substitutions liggend ("true"/"false") en
#  dimmer_basis (hoogte van de dimmerkaart bij k = 1). Het hardwarebestand
#  levert heeft_camera ("true"/"false") en swipe_animatie (RESTORE_DEFAULT_ON/OFF).
# =============================================================================

esphome:
  on_boot:
    - priority: -110
      then:
        - lambda: |-
            // Veeggebaren zelf afhandelen. LVGL stuurt een gebaar naar het
            // bovenste object dat het niet doorgeeft: dat is het scherm zelf
            // (alle objecten erin geven gebaren door). Dus hier luisteren:
            //   omhoog/omlaag = volgende/vorige pagina
            //   links/rechts  = volgend/vorig klokontwerp (alleen op de klok);
            //                   op andere pagina's is links/rechts slepen dimmen
            lv_obj_remove_flag(id(tv_hoofd), LV_OBJ_FLAG_SCROLLABLE);
            // Gedeeld door het LVGL-gebaar en het vangnet hieronder
            static lv_point_t veeg_start;
            static bool veeg_gebaar = false, veeg_mag = false;
            static auto veeg = [](lv_dir_t richting) {
              veeg_gebaar = true;
              if (richting == LV_DIR_TOP)
                id(pagina_stap).execute(1);
              else if (richting == LV_DIR_BOTTOM)
                id(pagina_stap).execute(-1);
              else if (id(pag_index) == 0 && richting == LV_DIR_LEFT)
                id(ontwerp_wisselen).execute(1);
              else if (id(pag_index) == 0 && richting == LV_DIR_RIGHT)
                id(ontwerp_wisselen).execute(-1);
            };
            // Vegen op een schuif of draaiknop is bedienen, geen pagina
            // wisselen; op de wekker-laag van de nachtstand alleen wekken
            static auto mag_vegen = [](lv_obj_t *actief) {
              for (lv_obj_t *o = actief; o != nullptr; o = lv_obj_get_parent(o)) {
                if (lv_obj_check_type(o, &lv_slider_class) || lv_obj_check_type(o, &lv_arc_class) ||
                    lv_obj_check_type(o, &lv_roller_class) || o == id(wek_laag))
                  return false;
              }
              return true;
            };
            lv_obj_add_event_cb(lv_obj_get_screen(id(tv_hoofd)), [](lv_event_t *e) {
              lv_indev_t *indev = lv_indev_active();
              if (indev == nullptr || !mag_vegen(lv_indev_get_active_obj()))
                return;
              veeg(lv_indev_get_gesture_dir(indev));
            }, LV_EVENT_GESTURE, nullptr);
            // Vangnet: de S3 tekent een klokscherm traag en leest dan het
            // touchscreen te weinig om een gebaar te herkennen (alleen
            // neerzetten en loslaten). Bij het loslaten dus zelf kijken: een
            // duidelijke veeg zonder gebaar of scrollen telt alsnog.
            for (lv_indev_t *indev = lv_indev_get_next(nullptr); indev != nullptr; indev = lv_indev_get_next(indev)) {
              if (lv_indev_get_type(indev) != LV_INDEV_TYPE_POINTER)
                continue;
              lv_indev_add_event_cb(indev, [](lv_event_t *e) {
                lv_indev_t *indev = lv_indev_active();
                if (indev == nullptr)
                  return;
                lv_point_t p;
                lv_indev_get_point(indev, &p);
                const lv_event_code_t code = lv_event_get_code(e);
                if (code == LV_EVENT_PRESSED) {
                  veeg_start = p;
                  veeg_gebaar = false;
                  veeg_mag = mag_vegen(lv_indev_get_active_obj());
                  return;
                }
                if (code != LV_EVENT_RELEASED || veeg_gebaar || !veeg_mag || lv_indev_get_scroll_obj(indev) != nullptr)
                  return;
                const int32_t dx = p.x - veeg_start.x, dy = p.y - veeg_start.y;
                const int32_t min = (int32_t) (60 * ${k});
                if (std::abs(dx) >= min && std::abs(dx) > 2 * std::abs(dy))
                  veeg(dx < 0 ? LV_DIR_LEFT : LV_DIR_RIGHT);
                else if (std::abs(dy) >= min && std::abs(dy) > 2 * std::abs(dx))
                  veeg(dy < 0 ? LV_DIR_TOP : LV_DIR_BOTTOM);
              }, LV_EVENT_ALL, nullptr);
            }
            alarmklok::navigeer = [](int richting) { id(pagina_stap).execute(richting); };
        - script.execute: thema_toepassen
        - script.execute: indeling_toepassen
        - script.execute: paginas_opbouwen

globals:
  # Volgorde van de pagina's (alarmklok::Pagina) en waar we nu zijn
  - id: pag_volgorde
    type: std::vector<int>
  - id: pag_index
    type: int
    initial_value: "0"
  # Aantal tegels op Verlichting en Scènes (4, 6 of 9)
  - id: aantal_verlichting
    type: int
    initial_value: "6"
  - id: aantal_scenes
    type: int
    initial_value: "6"
  # Hoeveel tegels (vanaf de eerste) een brede rij zijn: 5 bij "Rijen", 4 bij
  # "Rijen + knoppen" (de rest knoppen), 0 bij tegels. Scènes altijd tegels.
  - id: rijen_verlichting
    type: int
    initial_value: "5"
  - id: rijen_scenes
    type: int
    initial_value: "0"

