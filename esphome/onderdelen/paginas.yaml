    id: pagina_1
    name: Pagina 1
    icon: mdi:numeric-1-box-outline
    entity_category: config
    optimistic: true
    restore_value: true
    options: &pagina_opties [Uit, Verlichting, Klimaat, Muziek, Scènes, Wekker, Camera]
    initial_option: Verlichting
    on_value: &paginas_wijzigen
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: paginas_opbouwen
