script:
  # Volgorde uit Pagina 1-6 en de tegels van de tileview op hun plek zetten:
  # de gekozen pagina's naast elkaar, de rest verborgen.
  - id: paginas_opbouwen
    then:
      - lambda: |-
          const std::string opties[6] = {
              id(pagina_1).current_option().str(), id(pagina_2).current_option().str(),
              id(pagina_3).current_option().str(), id(pagina_4).current_option().str(),
              id(pagina_5).current_option().str(), id(pagina_6).current_option().str()};
          int volgorde[alarmklok::P_AANTAL + 1];
          const bool camera = ${heeft_camera} && (bool) alarmklok::camera_tonen;
          const int n = alarmklok::pagina_volgorde(opties, 6, camera, volgorde);
          id(pag_volgorde).assign(volgorde, volgorde + n);
          lv_obj_t *tegels[6] = {id(vak_klok), id(vak_verlichting), id(vak_klimaat),
                                 id(vak_muziek), id(vak_scenes), id(vak_wekker)};
          bool gebruikt[6] = {};
          lv_obj_update_layout(id(tv_hoofd));
          const int32_t b = lv_obj_get_content_height(id(tv_hoofd));
          int plek = 0;
          for (int i = 0; i < n; i++) {
            const int p = volgorde[i];
            if (p >= 6)
              continue;  // camera: eigen LVGL-pagina, geen tegel
            gebruikt[p] = true;
            lv_obj_clear_flag(tegels[p], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_pos(tegels[p], 0, plek++ * b);
          }
          for (int p = 0; p < 6; p++) {
            if (!gebruikt[p]) {
              lv_obj_add_flag(tegels[p], LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_pos(tegels[p], 0, plek++ * b);
            }
          }
      - script.execute:
          id: pagina_naar
          doel: 0
          animatie: false

  # Naar positie `doel` in de volgorde
  - id: pagina_naar
    parameters:
      doel: int
      animatie: bool
    then:
      - lambda: |-
          auto &v = id(pag_volgorde);
          if (v.empty())
            return;
          const int i = std::max(0, std::min(doel, (int) v.size() - 1));
          id(pag_index) = i;
          const int p = v[i];
          if (p == alarmklok::P_CAMERA) {
            if (alarmklok::camera_tonen)
              alarmklok::camera_tonen(true);
          } else {
            // Camerapagina dicht (doet niets als hij al dicht is)
            if (alarmklok::camera_tonen)
              alarmklok::camera_tonen(false);
            lv_obj_t *tegels[6] = {id(vak_klok), id(vak_verlichting), id(vak_klimaat),
                                   id(vak_muziek), id(vak_scenes), id(vak_wekker)};
            lv_tileview_set_tile(id(tv_hoofd), tegels[p], animatie ? LV_ANIM_ON : LV_ANIM_OFF);
          }
      - script.execute: pagina_indicator_bijwerken
      # Terug op de klok: meteen de juiste tijd (de klok wordt niet bijgewerkt
      # zolang hij niet in beeld is)
      - if:
          condition:
            lambda: return id(pag_index) == 0;
          then:
            - script.execute: scherm_bijwerken

  # Volgende (+1) of vorige (-1) pagina; niet rondgaan
  - id: pagina_stap
    mode: queued
    max_runs: 2
    parameters:
      richting: int
    then:
      - script.execute:
          id: pagina_naar
          doel: !lambda return alarmklok::pagina_stap(id(pag_index), richting, (int) id(pag_volgorde).size());
          animatie: !lambda return id(swipe_animatie).state;

  - id: pagina_indicator_bijwerken
    then:
      - lvgl.label.update:
          id: pagina_indicator
          text: !lambda return alarmklok::stippen(id(pag_index), (int) id(pag_volgorde).size(), "\n");

  # Klokontwerp wisselen met omhoog/omlaag swipen, alleen de ontwerpen die aan staan
  - id: ontwerp_wisselen
    parameters:
      richting: int
    then:
      - lambda: |-
          static const char *const NAMEN[8] = {"Digitaal", "Analoog", "Gestapeld", "Info",
                                               "Zon", "Zwevend", "Maan", "Vierkant"};
          const bool aan[8] = {id(ontwerp_aan_digitaal).state, id(ontwerp_aan_analoog).state,
                               id(ontwerp_aan_gestapeld).state, id(ontwerp_aan_info).state,
                               id(ontwerp_aan_zon).state, id(ontwerp_aan_zwevend).state,
                               id(ontwerp_aan_maan).state, id(ontwerp_aan_vierkant).state};
          const std::string huidig = id(klokontwerp).current_option().str();
          int i = 0;
          while (i < 8 && huidig != NAMEN[i])
            i++;
          const int nieuw = alarmklok::ontwerp_stap(i < 8 ? i : 0, richting, aan, 8);
          auto call = id(klokontwerp).make_call();
          call.set_option(NAMEN[nieuw]);
          call.perform();

  # Indeling van Verlichting en Scènes: raster van 2x2, 3x2 (liggend 2x3) of 3x3
  - id: indeling_toepassen
    then:
      - lambda: |-
          id(aantal_verlichting) = alarmklok::tegel_aantal(id(indeling_verlichting).current_option().str());
          id(rijen_verlichting) = alarmklok::tegel_rijen(id(indeling_verlichting).current_option().str());
          id(aantal_scenes) = alarmklok::tegel_aantal(id(indeling_scenes).current_option().str());
          // De rasterbeschrijving moet blijven bestaan: static
          static int32_t rijen_licht[8], kolommen_licht[5], rijen_scene[8], kolommen_scene[5];
          // "Rijen + knoppen": 4 rijen over de hele breedte, daaronder de
          // knoppen (tegel 5-8 met een entiteit) even breed naast elkaar
          auto rijen_knoppen = [](lv_obj_t *vak, lv_obj_t **tegels, text::Text **entiteiten, int rijen,
                                  int32_t *rijen_dsc, int32_t *kolommen_dsc) {
            int knoppen = 0;
            for (int i = rijen; i < 8; i++)
              if (!entiteiten[i]->state.empty())
                knoppen++;
            const int kolommen = knoppen > 0 ? knoppen : 1;
            int r = 0;
            for (; r < rijen; r++)
              rijen_dsc[r] = LV_GRID_FR(1);
            if (knoppen > 0)
              rijen_dsc[r++] = LV_GRID_FR(1);
            rijen_dsc[r] = LV_GRID_TEMPLATE_LAST;
            for (int k = 0; k < kolommen; k++)
              kolommen_dsc[k] = LV_GRID_FR(1);
            kolommen_dsc[kolommen] = LV_GRID_TEMPLATE_LAST;
            lv_obj_set_grid_dsc_array(vak, kolommen_dsc, rijen_dsc);
            int kolom = 0;
            for (int i = 0; i < 9; i++) {
              if (i < rijen)
                lv_obj_set_grid_cell(tegels[i], LV_GRID_ALIGN_STRETCH, 0, kolommen, LV_GRID_ALIGN_STRETCH, i, 1);
              else if (i < 8 && !entiteiten[i]->state.empty())
                lv_obj_set_grid_cell(tegels[i], LV_GRID_ALIGN_STRETCH, kolom++, 1, LV_GRID_ALIGN_STRETCH, rijen, 1);
              else
                lv_obj_set_grid_cell(tegels[i], LV_GRID_ALIGN_STRETCH, 0, 1, LV_GRID_ALIGN_STRETCH, 0, 1);
            }
          };
          auto raster = [](lv_obj_t *vak, lv_obj_t **tegels, int aantal, int32_t *rijen_dsc,
                           int32_t *kolommen_dsc, lv_obj_t *dimmer, int dimmer_px) {
            int rijen, kolommen;
            alarmklok::tegel_raster(aantal, ${liggend}, rijen, kolommen);
            int r = 0;
            for (; r < rijen; r++)
              rijen_dsc[r] = LV_GRID_FR(1);
            if (dimmer != nullptr)
              rijen_dsc[r++] = dimmer_px;
            rijen_dsc[r] = LV_GRID_TEMPLATE_LAST;
            for (int k = 0; k < kolommen; k++)
              kolommen_dsc[k] = LV_GRID_FR(1);
            kolommen_dsc[kolommen] = LV_GRID_TEMPLATE_LAST;
            lv_obj_set_grid_dsc_array(vak, kolommen_dsc, rijen_dsc);
            for (int i = 0; i < 9; i++)
              lv_obj_set_grid_cell(tegels[i], LV_GRID_ALIGN_STRETCH, i < aantal ? i % kolommen : 0, 1,
                                   LV_GRID_ALIGN_STRETCH, i < aantal ? i / kolommen : 0, 1);
            if (dimmer != nullptr)
              lv_obj_set_grid_cell(dimmer, LV_GRID_ALIGN_STRETCH, 0, kolommen, LV_GRID_ALIGN_STRETCH, rijen, 1);
          };
          lv_obj_t *licht[9] = {id(tegel_licht_1), id(tegel_licht_2), id(tegel_licht_3),
                                id(tegel_licht_4), id(tegel_licht_5), id(tegel_licht_6),
                                id(tegel_licht_7), id(tegel_licht_8), id(tegel_licht_9)};
          lv_obj_t *scene[9] = {id(tegel_scene_1), id(tegel_scene_2), id(tegel_scene_3),
                                id(tegel_scene_4), id(tegel_scene_5), id(tegel_scene_6),
                                id(tegel_scene_7), id(tegel_scene_8), id(tegel_scene_9)};
          // De dimmerkaart onder de verlichting alleen met een dimlamp, en niet
          // als de verlichting rijen zijn (die dimmen zelf)
          const bool dimmer = !id(cfg_dim_lamp).state.empty() && id(rijen_verlichting) == 0;
          if (dimmer)
            lv_obj_clear_flag(id(dimmer_kaart), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_add_flag(id(dimmer_kaart), LV_OBJ_FLAG_HIDDEN);
          if (id(rijen_verlichting) > 0 && id(rijen_verlichting) < id(aantal_verlichting)) {
            text::Text *ent[9] = {id(tegel_licht_1_entiteit), id(tegel_licht_2_entiteit), id(tegel_licht_3_entiteit),
                                  id(tegel_licht_4_entiteit), id(tegel_licht_5_entiteit), id(tegel_licht_6_entiteit),
                                  id(tegel_licht_7_entiteit), id(tegel_licht_8_entiteit), id(tegel_licht_9_entiteit)};
            rijen_knoppen(id(raster_verlichting), licht, ent, id(rijen_verlichting), rijen_licht, kolommen_licht);
          } else {
            raster(id(raster_verlichting), licht, id(aantal_verlichting), rijen_licht, kolommen_licht,
                   dimmer ? (lv_obj_t *) id(dimmer_kaart) : nullptr, (int) (${dimmer_basis} * ${k}));
          }
          raster(id(raster_scenes), scene, id(aantal_scenes), rijen_scene, kolommen_scene, nullptr, 0);
      # Tegels boven het aantal verbergen, de rest tonen
      - script.execute: tegels_tonen

  # Kleurthema en accentkleur op de stijlen
  - id: thema_toepassen
    then:
      - lvgl.style.update:
          id: pagina_stijl
          bg_color: !lambda return lv_color_hex(alarmklok::thema(id(kleurthema).current_option().str()).pagina);
      - lvgl.style.update:
          id: kaart
          bg_color: !lambda return lv_color_hex(alarmklok::thema(id(kleurthema).current_option().str()).kaart);
      - lvgl.style.update:
          id: tegel_stijl
          bg_color: !lambda return lv_color_hex(alarmklok::thema(id(kleurthema).current_option().str()).tegel);
      - lvgl.style.update:
          id: titel
          text_color: !lambda return lv_color_hex(alarmklok::thema(id(kleurthema).current_option().str()).titel);
      - lvgl.style.update:
          id: klok_accent
          text_color: !lambda return lv_color_hex(alarmklok::accent_kleur(id(accentkleur).current_option().str()));
