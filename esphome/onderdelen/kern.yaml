# =============================================================================
#  Kern van de alarmklok: wekkers, instellingen, tegels en de logica voor het
#  scherm. Gedeeld door alle klokken; de hardware (scherm, touch, geluid) en de
#  schermindeling komen uit aparte bestanden.
#
#  Het hardwarebestand levert:
#    display "scherm", touchscreen "touch" (on_touch -> script "aangeraakt"),
#    light "backlight", binary_sensor "radio_speelt", de substitutie
#    "radio_terugval" en de scripts "speel_wekgeluid", "hw_geluid_stoppen",
#    "hw_volume" (niveau 0-1) en "hw_tijd_gesynchroniseerd".
# =============================================================================

packages:
  ha_bediening: !include ha-bediening.yaml
  wekker_1: !include { file: wekker.yaml, vars: { nr: 1, tijd: "07:00:00", aan: RESTORE_DEFAULT_ON, dagen: Werkdagen } }
  wekker_2: !include { file: wekker.yaml, vars: { nr: 2, tijd: "08:30:00", aan: RESTORE_DEFAULT_OFF, dagen: Weekend } }
  wekker_3: !include { file: wekker.yaml, vars: { nr: 3, tijd: "06:30:00", aan: RESTORE_DEFAULT_OFF, dagen: Eenmalig } }
  tegel_licht_1: !include { file: tegel-instellingen.yaml, vars: { nr: licht_1, titel: "Tegel verlichting 1", naam: "${licht_1_naam}", entity: "${licht_1_entity}", icoon: "${licht_1_icoon}", schakelaar: "true" } }
  tegel_licht_2: !include { file: tegel-instellingen.yaml, vars: { nr: licht_2, titel: "Tegel verlichting 2", naam: "${licht_2_naam}", entity: "${licht_2_entity}", icoon: "${licht_2_icoon}", schakelaar: "true" } }
  tegel_licht_3: !include { file: tegel-instellingen.yaml, vars: { nr: licht_3, titel: "Tegel verlichting 3", naam: "${licht_3_naam}", entity: "${licht_3_entity}", icoon: "${licht_3_icoon}", schakelaar: "true" } }
  tegel_licht_4: !include { file: tegel-instellingen.yaml, vars: { nr: licht_4, titel: "Tegel verlichting 4", naam: "${licht_4_naam}", entity: "${licht_4_entity}", icoon: "${licht_4_icoon}", schakelaar: "true" } }
  tegel_licht_5: !include { file: tegel-instellingen.yaml, vars: { nr: licht_5, titel: "Tegel verlichting 5", naam: "${licht_5_naam}", entity: "${licht_5_entity}", icoon: "${licht_5_icoon}", schakelaar: "true" } }
  tegel_licht_6: !include { file: tegel-instellingen.yaml, vars: { nr: licht_6, titel: "Tegel verlichting 6", naam: "${licht_6_naam}", entity: "${licht_6_entity}", icoon: "${licht_6_icoon}", schakelaar: "true" } }
  tegel_scene_1: !include { file: tegel-instellingen.yaml, vars: { nr: scene_1, titel: "Tegel scène 1", naam: "${scene_1_naam}", entity: "${scene_1_entity}", icoon: "${scene_1_icoon}", schakelaar: "false" } }
  tegel_scene_2: !include { file: tegel-instellingen.yaml, vars: { nr: scene_2, titel: "Tegel scène 2", naam: "${scene_2_naam}", entity: "${scene_2_entity}", icoon: "${scene_2_icoon}", schakelaar: "false" } }
  tegel_scene_3: !include { file: tegel-instellingen.yaml, vars: { nr: scene_3, titel: "Tegel scène 3", naam: "${scene_3_naam}", entity: "${scene_3_entity}", icoon: "${scene_3_icoon}", schakelaar: "false" } }
  tegel_scene_4: !include { file: tegel-instellingen.yaml, vars: { nr: scene_4, titel: "Tegel scène 4", naam: "${scene_4_naam}", entity: "${scene_4_entity}", icoon: "${scene_4_icoon}", schakelaar: "false" } }
  tegel_scene_5: !include { file: tegel-instellingen.yaml, vars: { nr: scene_5, titel: "Tegel scène 5", naam: "${scene_5_naam}", entity: "${scene_5_entity}", icoon: "${scene_5_icoon}", schakelaar: "false" } }
  tegel_scene_6: !include { file: tegel-instellingen.yaml, vars: { nr: scene_6, titel: "Tegel scène 6", naam: "${scene_6_naam}", entity: "${scene_6_entity}", icoon: "${scene_6_icoon}", schakelaar: "false" } }

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - alarmklok.h
    - maan_textuur.h
    - wijzerplaat_textuur.h
  on_boot:
    # Vóór de verbinding met Home Assistant: zeg welke entiteiten de tegels
    # volgen. HA vraagt die lijst alleen op bij het verbinden.
    - priority: 600
      then:
        - script.execute: tegels_volgen
    - priority: -100
      then:
        - text_sensor.template.publish:
            id: wekker_status
            state: Wacht
        - lambda: id(ui_klaar) = true;
        - script.execute: tegels_tonen
        - script.execute: klokkleur_toepassen
        - script.execute: sterren_maken
        - script.execute: vierkant_maken
        - script.execute: maan_tekenen
        - script.execute: klok_verschuiven
        - script.execute: ui_synchroniseren
        - script.execute: scherm_bijwerken

logger:

api:
  encryption:
    key: !secret api_encryption_key
  # Nooit herstarten omdat Home Assistant weg is (standaard na 15 min): de
  # wekker werkt zonder HA, en een herstart rond het wekken is het laatste dat
  # je wilt (zie README, "Stabiliteit")
  reboot_timeout: 0s
  # Melding op het scherm vanuit HA: actie "esphome.<naam>_melding", bijvoorbeeld
  # esphome.alarmklok_melding. Icoon: een naam uit de lijst in README.md
  # (leeg = bel).
  actions:
    - action: melding
      variables:
        titel: string
        tekst: string
        icoon: string
      then:
        - script.execute:
            id: melding_tonen
            titel: !lambda return titel;
            tekst: !lambda return tekst;
            icoon: !lambda return icoon;

# -----------------------------------------------------------------------------
#  Interne toestand
# -----------------------------------------------------------------------------
globals:
  - id: gaat_af
    type: bool
    initial_value: "false"
  - id: snoozet
    type: bool
    initial_value: "false"
  # Unix-tijd waarop de snooze afloopt (voor op het scherm)
  - id: snooze_tot
    type: time_t
    initial_value: "0"
  - id: laatste_aanraking_ms
    type: uint32_t
    initial_value: "0"
  - id: huidige_helderheid
    type: float
    initial_value: "-1"
  - id: nachtstand
    type: bool
    initial_value: "false"
  # De plaat van Vierkant staat op zwart voor de nachtklok
  - id: plaat_nacht
    type: bool
    initial_value: "false"
  - id: overlay_zichtbaar
    type: bool
    initial_value: "false"
  # Lichtsensor uit Home Assistant (lux, NaN = geen) en of het nu donker is
  - id: licht_lux
    type: float
    initial_value: "NAN"
  - id: licht_donker
    type: bool
    initial_value: "false"
  # Plek van de maan zoals in de schermindeling (-1 = nog niet gelezen); de
  # maan zwerft daar elk uur een stukje omheen (tegen inbranden)
  - id: maan_basis_x
    type: int
    initial_value: "-1"
  - id: maan_basis_y
    type: int
    initial_value: "-1"
  # Instellingen worden geladen vóór de LVGL-interface bestaat; pas na het
  # opstarten mogen ze widgets bijwerken.
  - id: ui_klaar
    type: bool
    initial_value: "false"
  # Welke wekker gaat af of snoozet (1-3), 0 = geen of een testwekker
  - id: actieve_wekker
    type: int
    initial_value: "0"
  # Welke wekker op de pagina Wekker wordt ingesteld (1-3)
  - id: bewerk_wekker
    type: int
    initial_value: "1"
  - id: oploop_start_ms
    type: uint32_t
    initial_value: "0"
  # Er is een melding die nog niet getoond kon worden ('s nachts of tijdens
  # het afgaan van de wekker)
  - id: melding_wacht
    type: bool
    initial_value: "false"
  # De drie wekkers (onderdelen/wekker.yaml) als lijsten, voor de lambda's
  - id: wekker_aan_lijst
    type: std::array<switch_::Switch *, 3>
    initial_value: "{wekker_1_aan, wekker_2_aan, wekker_3_aan}"
  - id: wekker_tijd_lijst
    type: std::array<datetime::TimeEntity *, 3>
    initial_value: "{wekker_1_tijd, wekker_2_tijd, wekker_3_tijd}"
  - id: wekker_dagen_lijst
    type: std::array<select::Select *, 3>
    initial_value: "{wekker_1_dagen, wekker_2_dagen, wekker_3_dagen}"

# -----------------------------------------------------------------------------
#  Tijd: NTP, zodat de wekker ook zonder Home Assistant werkt
# -----------------------------------------------------------------------------
time:
  # De hoofdklok "klok" (internettijd) staat in esp.yaml; die roept elke minuut
  # "elke_minuut" aan en na het gelijkzetten "tijd_gesynchroniseerd".
  # Tweede bron: de tijd van Home Assistant, voor als internettijd (NTP) niet
  # lukt maar HA wel bereikbaar is. Beide zetten dezelfde systeemklok.
  - platform: homeassistant
    id: ha_tijd
    timezone: ${tijdzone}
    on_time_sync:
      - script.execute: tijd_gesynchroniseerd

# Zon voor het klokontwerp Zon (plaats: breedtegraad/lengtegraad)
sun:
  id: zon
  time_id: klok
  latitude: ${breedtegraad}
  longitude: ${lengtegraad}

interval:
  - interval: 1s
    then:
      - script.execute: scherm_bijwerken
      - script.execute: helderheid_regelen
      - script.execute: melding_bekijken

# -----------------------------------------------------------------------------
#  Instellingen die in Home Assistant verschijnen
# -----------------------------------------------------------------------------
datetime:
  - platform: template
    id: nacht_vanaf
    type: time
    name: Nachtstand vanaf
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "22:30:00"

  - platform: template
    id: nacht_tot
    type: time
    name: Nachtstand tot
    icon: mdi:weather-sunny
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"

select:
  - platform: template
    id: wekgeluid
    name: Wekgeluid
    icon: mdi:music-note
    optimistic: true
    restore_value: true
    # "Radio" laat Home Assistant een radiostream op de klok afspelen
    # (zie homeassistant/packages/alarmklok.yaml). Speelt er na 20 s nog
    # niets, dan valt de klok terug op het klassieke wekgeluid.
    options:
      - Klassiek
      - Zacht
      - Mario
      - Radio
    initial_option: Klassiek
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: ui_synchroniseren

  # Swipe omlaag/omhoog op de klok wisselt hiertussen
  - platform: template
    id: klokontwerp
    name: Klokontwerp
    icon: mdi:clock-digital
    optimistic: true
    restore_value: true
    options:
      - Digitaal
      - Analoog
      - Gestapeld
      - Info
      - Zon
      - Zwevend
      - Maan
      - Vierkant
    initial_option: Vierkant
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: toon_klokontwerp

  # Kleur van de klokcijfers en wijzers; ook: lang drukken op de klok
  - platform: template
    id: klokkleur
    name: Klokkleur
    icon: mdi:palette
    optimistic: true
    restore_value: true
    options: [Wit, Warm, Oranje, Rood, Roze, Paars, Blauw, Groen]
    initial_option: Wit
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: klokkleur_toepassen

  # Kleur van de plaat van het klokontwerp "Vierkant"
  - platform: template
    id: wijzerplaat
    name: Wijzerplaat
    icon: mdi:watch-variant
    optimistic: true
    restore_value: true
    options: [Blauw, Zwart, Zilver, Zalm, Groen, Bordeaux]
    initial_option: Blauw
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: plaat_toepassen

  # Klok in de nachtstand:
  #   Vierkant zwart  de vierkante klok met zwarte plaat en een kleine maan in
  #                   de fase van vandaag boven de datum
  #   Maan            het maanscherm: grote grijze maan, rode tekst
  #   Rood filter     het gekozen klokontwerp onder een rood filter
  - platform: template
    id: nachtklok
    name: Nachtklok
    icon: mdi:moon-waning-crescent
    entity_category: config
    optimistic: true
    restore_value: true
    options: [Vierkant zwart, Maan, Rood filter]
    initial_option: Vierkant zwart
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar) && id(overlay_zichtbaar);
          then:
            - script.execute: nacht_stijl

number:
  - platform: template
    id: snooze_minuten
    name: Snooze duur
    icon: mdi:sleep
    unit_of_measurement: min
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 9

  - platform: template
    id: wakeup_minuten
    name: Wake-up light vooraf
    icon: mdi:weather-sunset-up
    unit_of_measurement: min
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 60
    step: 5
    initial_value: 20
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: ui_synchroniseren

  - platform: template
    id: volume
    name: Wekvolume
    icon: mdi:volume-high
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    min_value: 10
    max_value: 100
    step: 10
    initial_value: 80
    on_value:
      - script.execute:
          id: hw_volume
          niveau: !lambda return x / 100.0f;
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: ui_synchroniseren

  # Het wekgeluid begint zacht (10%) en wordt in zoveel seconden luider tot
  # het wekvolume. 0 = meteen op vol volume.
  - platform: template
    id: oplopen_seconden
    name: Wekgeluid oplopen
    icon: mdi:volume-plus
    unit_of_measurement: s
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 180
    step: 10
    initial_value: 60
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: ui_synchroniseren

  - platform: template
    id: helderheid_dag
    name: Helderheid overdag
    icon: mdi:brightness-7
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 80

  - platform: template
    id: helderheid_nacht
    name: Helderheid 's nachts
    icon: mdi:brightness-3
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 50
    step: 1
    initial_value: 3

  # Nachtstand ook als de lichtsensor (hieronder) minder dan dit meet
  - platform: template
    id: nacht_lux
    name: Nachtstand onder
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: lx
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 5

# Lichtsensor in Home Assistant (bijv. sensor.slaapkamer_lichtsterkte); leeg =
# alleen het tijdvenster. Een andere entiteit laat de klok even herstarten.
text:
  - platform: template
    id: lichtsensor
    name: Lichtsensor
    icon: mdi:brightness-auto
    entity_category: config
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: "${lichtsensor}"
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: tegels_herladen

button:
  - platform: template
    name: Wekker stoppen
    icon: mdi:alarm-off
    on_press:
      - script.execute: stop_wekker
  - platform: template
    name: Snooze
    icon: mdi:alarm-snooze
    on_press:
      - script.execute: snooze_wekker
  - platform: template
    name: Wekker testen
    icon: mdi:alarm-bell
    entity_category: diagnostic
    on_press:
      - script.execute: test_wekker

switch:
  # Slaat precies één keer over: de eerstvolgende wekker (en zijn wake-up
  # light) gaat niet af, daarna zet deze schakelaar zichzelf weer uit.
  - platform: template
    id: overslaan
    name: Volgende wekker overslaan
    icon: mdi:alarm-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: ui_synchroniseren

  # Werkdagen-wekkers gaan niet af als Home Assistant zegt dat het vandaag
  # geen werkdag is (feestdag). Zie "werkdag_sensor" in instellingen.yaml.
  - platform: template
    id: niet_op_feestdagen
    name: Niet op feestdagen
    icon: mdi:calendar-star
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Nachtstand ook bij weinig licht (alleen met een lichtsensor, zie hierboven)
  - platform: template
    id: nacht_op_licht
    name: Nachtstand bij weinig licht
    icon: mdi:theme-light-dark
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

text_sensor:
  - platform: template
    id: wekker_status
    name: Wekker status
    icon: mdi:alarm-light

  # Wanneer de eerstvolgende wekker afgaat (rekening houdend met "overslaan"),
  # voor automations in HA: bijvoorbeeld de verwarming vooraf aanzetten.
  # Feestdagen zitten er niet in. Leeg = geen wekker.
  - platform: template
    id: volgende_wekker
    name: Volgende wekker
    icon: mdi:alarm
    device_class: timestamp

binary_sensor:
  - platform: status
    id: api_verbonden
    name: Status

  # Zonder geldige tijd gaat geen enkele wekker af (bijvoorbeeld na een
  # stroomuitval zonder wifi, op een klok zonder klokchip)
  - platform: template
    id: tijd_bekend
    name: Tijd bekend
    icon: mdi:clock-check
    entity_category: diagnostic
    lambda: return id(klok).now().is_valid();

  # Workday-integratie van HA: aan = werkdag. Bestaat hij niet of is er geen
  # verbinding, dan gaan de wekkers gewoon af.
  - platform: homeassistant
    id: werkdag
    entity_id: ${werkdag_sensor}
    internal: true

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: homeassistant
    id: buitentemperatuur
    entity_id: ${temperatuur_sensor}
    internal: true


# -----------------------------------------------------------------------------
#  Wekker-logica
# -----------------------------------------------------------------------------
script:
  # Elke minuut (op seconde 0, vanuit de tijdbron "klok"): wekkers en klokken
  - id: elke_minuut
    then:
      - script.execute: controleer_wekker
      - if:
          condition:
            lambda: return id(ui_klaar) && id(klokontwerp).active_index().value_or(0) == 4;
          then:
            - script.execute: zon_bijwerken
      # Elk uur de maanfase opnieuw tekenen (verandert langzaam)
      - if:
          condition:
            lambda: return id(ui_klaar) && id(klok).now().minute == 0;
          then:
            - script.execute: maan_tekenen
            - if:
                condition:
                  lambda: return id(klok).now().hour == 0;
                then:
                  - script.execute: klok_verschuiven

  # De tijd is (opnieuw) gelijkgezet: scherm, klokchip en tegen inbranden
  - id: tijd_gesynchroniseerd
    then:
      - script.execute: scherm_bijwerken
      - script.execute: hw_tijd_gesynchroniseerd
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: klok_verschuiven
            - script.execute: maan_tekenen

  # Elke minuut: is het tijd voor het wake-up light of voor een van de wekkers?
  - id: controleer_wekker
    then:
      - lambda: |-
          auto nu = id(klok).now();
          if (!nu.is_valid())
            return;
          const int nu_minuut = nu.hour * 60 + nu.minute;
          alarmklok::WekkerInfo w[3];
          for (int i = 0; i < 3; i++) {
            const auto *tijd = id(wekker_tijd_lijst)[i];
            w[i] = {id(wekker_aan_lijst)[i]->state,
                    id(wekker_dagen_lijst)[i]->current_option().str(),
                    tijd->hour * 60 + tijd->minute};
          }
          const int vandaag_werkdag = id(werkdag).has_state() ? (id(werkdag).state ? 1 : 0) : -1;
          const int vooraf = (int) id(wakeup_minuten).state;
          // Welke wekker is de eerstvolgende? Bij "overslaan" geldt dat ook
          // voor het wake-up light.
          int eerst_minuten;
          const int eerst = alarmklok::eerstvolgende_wekker(w, 3, nu.day_of_week, nu_minuut,
                                                            eerst_minuten);
          bool wakeup_gestart = false;
          for (int i = 0; i < 3; i++) {
            if (!w[i].aan)
              continue;
            const bool feestdag =
                alarmklok::feestdag_overslaan(id(niet_op_feestdagen).state, w[i].dagen,
                                              vandaag_werkdag);

            if (nu_minuut == w[i].minuut && !id(gaat_af) &&
                alarmklok::wekdag_actief(w[i].dagen, nu.day_of_week)) {
              if (feestdag) {
                ESP_LOGI("alarmklok", "Wekker %d: geen werkdag, overgeslagen", i + 1);
              } else if (id(overslaan).state) {
                ESP_LOGI("alarmklok", "Wekker %d: overgeslagen", i + 1);
                id(overslaan).turn_off();
                if (w[i].dagen == "Eenmalig")
                  id(wekker_aan_lijst)[i]->turn_off();
              } else {
                id(actieve_wekker) = i + 1;
                id(start_wekker).execute();
              }
            }

            if (vooraf > 0 && !wakeup_gestart) {
              auto straks = ESPTime::from_epoch_local(nu.timestamp + vooraf * 60);
              const bool overgeslagen =
                  feestdag || (id(overslaan).state && i == eerst && eerst_minuten == vooraf);
              if (straks.hour * 60 + straks.minute == w[i].minuut && !overgeslagen &&
                  alarmklok::wekdag_actief(w[i].dagen, straks.day_of_week)) {
                wakeup_gestart = true;
                id(start_wakeup_light).execute(vooraf);
              }
            }
          }

  # Testen (knop op het scherm of in HA): gaat af zonder een wekker te zijn,
  # dus een eenmalige wekker blijft gewoon aan.
  - id: test_wekker
    then:
      - lambda: id(actieve_wekker) = 0;
      - script.execute: start_wekker

  - id: start_wakeup_light
    parameters:
      minuten: int
    then:
      - logger.log:
          format: "Wake-up light start (%d min)"
          args: [minuten]
      - homeassistant.event:
          event: esphome.alarmklok_wakeup
          data:
            klok: ${name}
            minuten: !lambda return std::to_string(minuten);

  - id: start_wekker
    then:
      - script.stop: snooze_timer
      - lambda: |-
          id(gaat_af) = true;
          id(snoozet) = false;
      - text_sensor.template.publish:
          id: wekker_status
          state: Gaat af
      # Een open melding komt terug nadat de wekker gestopt is
      - lambda: |-
          if (!lv_obj_has_flag(id(melding_vlak), LV_OBJ_FLAG_HIDDEN))
            id(melding_wacht) = true;
      - lvgl.widget.hide: [pagina_indicator, melding_vlak]
      - lvgl.page.show:
          id: pagina_wekker_gaat_af
          animation: NONE
      - script.execute: helderheid_regelen
      - homeassistant.event:
          event: esphome.alarmklok_wekker
          data:
            klok: ${name}
            status: gaat_af
            geluid: !lambda return id(wekgeluid).current_option().str();
      - script.execute: max_afgaan_timer
      - script.execute: volume_oplopen
      - if:
          condition:
            and:
              - lambda: return id(wekgeluid).current_option() == "Radio";
              - api.connected:
          then:
            - script.execute: radio_terugval
          else:
            - script.execute: speel_wekgeluid

  # Speelt de radio na ${radio_terugval} nog niet, dan toch het wekgeluid laten
  # klinken. "radio_speelt" en "speel_wekgeluid" staan in het hardwarebestand.
  - id: radio_terugval
    mode: restart
    then:
      - delay: ${radio_terugval}
      - if:
          condition:
            and:
              - lambda: return id(gaat_af);
              - binary_sensor.is_off: radio_speelt
          then:
            - script.execute: speel_wekgeluid

  # Wekgeluid langzaam luider: van 10% naar het wekvolume in "Wekgeluid
  # oplopen" seconden. Geldt voor de melodie én voor de radio.
  - id: volume_oplopen
    mode: restart
    then:
      - lambda: id(oploop_start_ms) = millis();
      - while:
          condition:
            lambda: |-
              return id(gaat_af) &&
                     millis() - id(oploop_start_ms) < id(oplopen_seconden).state * 1000.0f;
          then:
            - script.execute:
                id: wekvolume_zetten
                deel: !lambda |-
                  return 0.1f + 0.9f * (millis() - id(oploop_start_ms)) /
                                       (id(oplopen_seconden).state * 1000.0f);
            - delay: 1s
      - script.execute:
          id: wekvolume_zetten
          deel: 1.0

  # Zet het wekgeluid op `deel` (0-1) van het ingestelde wekvolume
  - id: wekvolume_zetten
    parameters:
      deel: float
    then:
      - script.execute:
          id: hw_volume
          niveau: !lambda return id(volume).state / 100.0f * std::min(1.0f, deel);

  - id: geluid_stoppen
    then:
      - script.stop: radio_terugval
      - script.execute: hw_geluid_stoppen

  - id: snooze_wekker
    then:
      - if:
          condition:
            lambda: return id(gaat_af);
          then:
            - lambda: |-
                id(gaat_af) = false;
                id(snoozet) = true;
                auto nu = id(klok).now();
                id(snooze_tot) = nu.is_valid()
                    ? nu.timestamp + (time_t) id(snooze_minuten).state * 60 : 0;
            - script.execute: geluid_stoppen
            - script.stop: max_afgaan_timer
            - text_sensor.template.publish:
                id: wekker_status
                state: Snooze
            - homeassistant.event:
                event: esphome.alarmklok_wekker
                data:
                  klok: ${name}
                  status: snooze
            - script.execute: naar_klokscherm
            - script.execute: snooze_timer

  - id: snooze_timer
    mode: restart
    then:
      - delay: !lambda return (uint32_t) id(snooze_minuten).state * 60 * 1000;
      - script.execute: start_wekker

  - id: max_afgaan_timer
    mode: restart
    then:
      - delay: ${max_afgaan_minuten}min
      - script.execute: stop_wekker

  - id: stop_wekker
    then:
      - script.stop: snooze_timer
      - script.stop: max_afgaan_timer
      - script.execute: geluid_stoppen
      - if:
          condition:
            lambda: return id(gaat_af) || id(snoozet);
          then:
            - lambda: |-
                id(gaat_af) = false;
                id(snoozet) = false;
                // Eerst actieve_wekker wissen: dan stopt het uitzetten van
                // een eenmalige wekker hieronder niet opnieuw dit script.
                const int nr = id(actieve_wekker);
                id(actieve_wekker) = 0;
                if (nr > 0 && id(wekker_dagen_lijst)[nr - 1]->current_option() == "Eenmalig")
                  id(wekker_aan_lijst)[nr - 1]->turn_off();
            - homeassistant.event:
                event: esphome.alarmklok_wekker
                data:
                  klok: ${name}
                  status: gestopt
            - script.execute: naar_klokscherm
      - text_sensor.template.publish:
          id: wekker_status
          state: Wacht

  - id: naar_klokscherm
    then:
      - lvgl.page.show:
          id: pagina_hoofd
          animation: NONE
      - lvgl.tileview.select:
          id: tv_hoofd
          row: 0
          column: 0
          animated: true
      - script.execute: pagina_indicator_bijwerken

  # ---------------------------------------------------------------------------
  #  Tegels: naam, entiteit en icoon komen uit Home Assistant
  #  (onderdelen/tegel-instellingen.yaml)
  # ---------------------------------------------------------------------------
  - id: tegels_volgen
    then:
      - script.execute: tegel_licht_1_volgen
      - script.execute: tegel_licht_2_volgen
      - script.execute: tegel_licht_3_volgen
      - script.execute: tegel_licht_4_volgen
      - script.execute: tegel_licht_5_volgen
      - script.execute: tegel_licht_6_volgen
      - script.execute: tegel_scene_1_volgen
      - script.execute: tegel_scene_2_volgen
      - script.execute: tegel_scene_3_volgen
      - script.execute: tegel_scene_4_volgen
      - script.execute: tegel_scene_5_volgen
      - script.execute: tegel_scene_6_volgen
      - script.execute: lichtsensor_volgen

  - id: lichtsensor_volgen
    then:
      - lambda: |-
          const std::string entiteit = id(lichtsensor).state;
          if (entiteit.empty())
            return;
          api::global_api_server->subscribe_home_assistant_state(
              entiteit, optional<std::string>(),
              std::function<void(StringRef)>([](StringRef waarde) {
                char *eind = nullptr;
                const std::string tekst = waarde.str();
                const float lux = std::strtof(tekst.c_str(), &eind);
                id(licht_lux) = eind == tekst.c_str() ? NAN : lux;
              }));

  - id: tegels_tonen
    then:
      - script.execute: tegel_licht_1_tonen
      - script.execute: tegel_licht_2_tonen
      - script.execute: tegel_licht_3_tonen
      - script.execute: tegel_licht_4_tonen
      - script.execute: tegel_licht_5_tonen
      - script.execute: tegel_licht_6_tonen
      - script.execute: tegel_scene_1_tonen
      - script.execute: tegel_scene_2_tonen
      - script.execute: tegel_scene_3_tonen
      - script.execute: tegel_scene_4_tonen
      - script.execute: tegel_scene_5_tonen
      - script.execute: tegel_scene_6_tonen

  # Een nieuwe entiteit achter een tegel wordt pas gevolgd na een herstart:
  # Home Assistant vraagt de gevolgde entiteiten alleen op bij het verbinden.
  # Even wachten (meerdere wijzigingen tegelijk) en niet als er een wekker afgaat.
  - id: tegels_herladen
    mode: restart
    then:
      - delay: 5s
      - wait_until:
          condition:
            lambda: return !id(gaat_af) && !id(snoozet);
      - logger.log: "Tegel-entiteit gewijzigd: herstarten om de nieuwe status te volgen"
      - lambda: |-
          global_preferences->sync();
          App.safe_reboot();

  # ---------------------------------------------------------------------------
  #  Meldingen vanuit Home Assistant (actie "melding" hierboven)
  # ---------------------------------------------------------------------------
  - id: melding_tonen
    parameters:
      titel: string
      tekst: string
      icoon: string
    then:
      - lambda: |-
          lv_label_set_text(id(melding_titel), titel.c_str());
          lv_label_set_text(id(melding_tekst), tekst.c_str());
          lv_label_set_text(id(melding_icoon),
                            alarmklok::icoon(icoon.empty() ? "bell" : icoon, "\U000F009A"));
          id(melding_wacht) = true;
      - script.execute: melding_bekijken

  # Toont een wachtende melding. 's Nachts pas als je het scherm aanraakt, en
  # niet over het scherm van een afgaande wekker heen.
  - id: melding_bekijken
    then:
      - if:
          condition:
            lambda: return id(melding_wacht) && !id(overlay_zichtbaar) && !id(gaat_af);
          then:
            - lambda: |-
                id(melding_wacht) = false;
                id(laatste_aanraking_ms) = millis();
            - lvgl.widget.show: melding_vlak

  - id: melding_sluiten
    then:
      - lvgl.widget.hide: melding_vlak

  # Aangeroepen bij elke aanraking van het scherm
  - id: aangeraakt
    then:
      - lambda: id(laatste_aanraking_ms) = millis();
      - script.execute: helderheid_regelen

  # ---------------------------------------------------------------------------
  #  Klokontwerpen (swipe omlaag/omhoog op de klok)
  # ---------------------------------------------------------------------------
  - id: toon_klokontwerp
    then:
      - lambda: |-
          // In de nachtstand de gekozen nachtklok: Vierkant zwart of het maanscherm
          int keuze = id(klokontwerp).active_index().value_or(0);
          const int nacht = id(overlay_zichtbaar) ? id(nachtklok).active_index().value_or(0) : -1;
          if (nacht == 0)
            keuze = 7;
          else if (nacht == 1)
            keuze = 6;
          // Vierkant zwart: zwarte plaat en de kleine maan boven de datum
          if ((nacht == 0) != id(plaat_nacht)) {
            id(plaat_nacht) = nacht == 0;
            id(plaat_toepassen).execute();
          }
          if (nacht == 0)
            lv_obj_clear_flag(id(v_maan_canvas), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_add_flag(id(v_maan_canvas), LV_OBJ_FLAG_HIDDEN);
          lv_obj_t *ontwerpen[] = {id(ontwerp_digitaal), id(ontwerp_analoog), id(ontwerp_gestapeld),
                                   id(ontwerp_info), id(ontwerp_zon), id(ontwerp_zwevend),
                                   id(ontwerp_maan), id(ontwerp_vierkant)};
          for (int i = 0; i < 8; i++) {
            if (i == keuze)
              lv_obj_clear_flag(ontwerpen[i], LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(ontwerpen[i], LV_OBJ_FLAG_HIDDEN);
          }
          lv_label_set_text(id(lbl_ontwerp_stippen),
                            alarmklok::stippen(id(klokontwerp).active_index().value_or(0), 8, "\n").c_str());
          if (keuze == 4)
            id(zon_bijwerken).execute();
          if (keuze == 6)
            id(maan_tekenen).execute();

  # Nachtstand aan of uit: maanscherm met rode tekst, het rode filter, of
  # (Vierkant zwart) geen filter
  - id: nacht_stijl
    then:
      - if:
          condition:
            lambda: return id(overlay_zichtbaar) && id(nachtklok).active_index().value_or(0) == 1;
          then:
            - lvgl.widget.hide: nacht_filter
            - lvgl.style.update:
                id: klok_tekst
                text_color: 0x9A2A1A
            - lvgl.style.update:
                id: klok_sub
                text_color: 0x5A1A10
            - lvgl.style.update:
                id: klok_accent
                text_color: 0x5A1A10
          else:
            - lvgl.style.update:
                id: klok_sub
                text_color: 0xB0B6C0
            - lvgl.style.update:
                id: klok_accent
                text_color: 0xF5A623
            - script.execute: klokkleur_toepassen
            - if:
                condition:
                  lambda: return id(overlay_zichtbaar) && id(nachtklok).active_index().value_or(0) == 2;
                then:
                  - lvgl.widget.show: nacht_filter
                else:
                  - lvgl.widget.hide: nacht_filter
      - script.execute: toon_klokontwerp

  # De maan in de fase van nu: textuur (maan_textuur.h) x licht van de zon.
  # Rechtstreeks in de canvasbuffer; daarna één keer opnieuw tekenen.
  # Tegen inbranden: het hele klokvlak staat elke dag een paar pixels anders
  - id: klok_verschuiven
    then:
      - lambda: |-
          auto nu = id(klok).now();
          if (!nu.is_valid())
            return;
          int dx, dy;
          alarmklok::verschuiving(nu.day_of_year, (int) (8 * ${k}), dx, dy);
          // Het verschoven vlak steekt een paar pixels uit: niet laten scrollen
          lv_obj_t *tegel = lv_obj_get_parent(id(klok_vlak));
          lv_obj_remove_flag(tegel, LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_set_scrollbar_mode(tegel, LV_SCROLLBAR_MODE_OFF);
          // De wijzerplaat van "Vierkant" is groter dan het scherm en mag
          // buiten het verschoven vlak doorlopen (geen zwarte rand)
          lv_obj_add_flag(id(klok_vlak), LV_OBJ_FLAG_OVERFLOW_VISIBLE);
          lv_obj_set_pos(id(klok_vlak), dx, dy);

  - id: maan_tekenen
    then:
      - lambda: |-
          auto nu = id(klok).now();
          const float fase = alarmklok::maan_fase(nu.is_valid() ? (double) nu.timestamp : 0.0);
          // Tegen inbranden: elk uur een andere plek rond de basispositie
          if (id(maan_basis_x) < 0) {
            id(maan_basis_x) = lv_obj_get_x(id(maan_canvas));
            id(maan_basis_y) = lv_obj_get_y(id(maan_canvas));
          }
          int dx = 0, dy = 0;
          if (nu.is_valid())
            alarmklok::verschuiving(nu.hour, (int) (14 * ${k}), dx, dy);
          lv_obj_set_pos(id(maan_canvas), id(maan_basis_x) + dx, id(maan_basis_y) + dy);
          // Het maanscherm (RGB565, zwart rondom) en de kleine maan van Vierkant
          // zwart (ARGB8888, doorzichtig rondom, meer monsters per pixel)
          auto tekenen = [fase](lv_obj_t *canvas) {
            lv_draw_buf_t *buf = lv_canvas_get_draw_buf(canvas);
            if (buf == nullptr)
              return;
            const bool argb = buf->header.cf == LV_COLOR_FORMAT_ARGB8888;
            if (!argb && buf->header.cf != LV_COLOR_FORMAT_RGB565)
              return;
            const int d = buf->header.w;
            const int T = alarmklok::MAAN_TEXTUUR_MAAT;
            const float schaal = (float) T / d;
            const int n = d < 100 ? 4 : 1;
            for (int y = 0; y < d; y++) {
              uint8_t *rij = buf->data + y * buf->header.stride;
              const float ny = (2.0f * y + 1) / d - 1.0f;
              for (int x = 0; x < d; x++) {
                const float nx = (2.0f * x + 1) / d - 1.0f;
                const float r = std::sqrt(nx * nx + ny * ny);
                // Zachte rand (1 pixel), daarbuiten zwart of doorzichtig
                float rand = (1.0f - r) * d * 0.5f + 0.5f;
                if (rand > 1)
                  rand = 1;
                int g = 0;
                if (rand > 0) {
                  float som = 0;
                  for (int j = 0; j < n; j++)
                    for (int i = 0; i < n; i++) {
                      // Bilineair uit de textuur
                      float u = (x + (i + 0.5f) / n) * schaal - 0.5f, v = (y + (j + 0.5f) / n) * schaal - 0.5f;
                      u = u < 0 ? 0 : (u > T - 1.001f ? T - 1.001f : u);
                      v = v < 0 ? 0 : (v > T - 1.001f ? T - 1.001f : v);
                      const int u0 = (int) u, v0 = (int) v;
                      const float fu = u - u0, fv = v - v0;
                      const uint8_t *t0 = alarmklok::MAAN_TEXTUUR + v0 * T + u0;
                      som += (t0[0] * (1 - fu) + t0[1] * fu) * (1 - fv) + (t0[T] * (1 - fu) + t0[T + 1] * fu) * fv;
                    }
                  const float licht = alarmklok::maan_licht(fase, nx, ny);
                  g = (int) (som / (n * n) * (licht < 0.06f ? 0.06f : licht) * 0.92f * (argb ? 1.0f : rand));
                }
                if (argb) {
                  uint8_t *p = rij + x * 4;
                  p[0] = p[1] = p[2] = g;
                  p[3] = rand > 0 ? (uint8_t) (rand * 255) : 0;
                } else {
                  ((uint16_t *) rij)[x] = lv_color_to_u16(lv_color_make(g, g, g));
                }
              }
            }
            lv_obj_invalidate(canvas);
          };
          tekenen(id(maan_canvas));
          tekenen(id(v_maan_canvas));

  # Vierkante wijzerplaat: minuutrand langs de vierkante rand en streepjes
  # voor de uren zonder cijfer (eenmalig bij het opstarten)
  - id: vierkant_maken
    then:
      - lambda: |-
          lv_obj_t *vlak = id(vierkant_merken);
          lv_obj_update_layout(vlak);
          const float h = lv_obj_get_width(vlak) / 2.0f;
          const float s = h / 240.0f;  // schaal t.o.v. 480x480
          for (int i = 0; i < 60; i++) {
            const bool uur = i % 5 == 0;
            // Cijfers op 12, 2, 4, 6, 8 en 10
            if (uur && (i == 0 || i == 10 || i == 20 || i == 30 || i == 40 || i == 50))
              continue;
            float x, y;
            alarmklok::vierkant_rand(i * 6.0f, h - 14 * s, x, y);
            const float lengte = (uur ? 30 : 8) * s;
            const float r = std::sqrt(x * x + y * y);
            auto *p = new lv_point_precise_t[2];
            p[0] = {(lv_value_precise_t) (h + x), (lv_value_precise_t) (h + y)};
            p[1] = {(lv_value_precise_t) (h + x - x / r * lengte), (lv_value_precise_t) (h + y - y / r * lengte)};
            if (!uur) {
              // Gedrukt minuutstreepje
              lv_obj_t *lijn = lv_line_create(vlak);
              lv_line_set_points(lijn, p, 2);
              lv_obj_set_style_line_width(lijn, 1, 0);
              continue;
            }
            // Opgezette uurindex: twee helften naast elkaar, de kant naar het
            // licht (linksboven) helder, de andere donkerder
            const float nx = -y / r, ny = x / r;
            const float b = 1.1f * s;
            for (int kant = 0; kant < 2; kant++) {
              const float zx = (kant ? -1 : 1) * nx * b, zy = (kant ? -1 : 1) * ny * b;
              auto *q = new lv_point_precise_t[2];
              q[0] = {(lv_value_precise_t) (p[0].x + zx), (lv_value_precise_t) (p[0].y + zy)};
              q[1] = {(lv_value_precise_t) (p[1].x + zx), (lv_value_precise_t) (p[1].y + zy)};
              lv_obj_t *lijn = lv_line_create(vlak);
              lv_line_set_points(lijn, q, 2);
              lv_obj_set_style_line_width(lijn, (int) (3.0f * s + 0.5f), 0);
              // Welke helft: 2 = naar het licht (kleinere x+y), 1 = de andere
              lv_obj_set_user_data(lijn, (void *) (intptr_t) ((zx + zy) < 0 ? 2 : 1));
            }
            delete[] p;
          }
      - script.execute: plaat_toepassen

  # Kleuren van de plaat "Vierkant" (select Wijzerplaat): plaat, cijfers,
  # streepjes, wijzers, tekst en hoe donker de schaduwen zijn
  - id: plaat_toepassen
    then:
      - lambda: |-
          // In de nachtstand met Vierkant zwart altijd de zwarte plaat
          const auto w = alarmklok::wijzerplaat(id(plaat_nacht) ? "Zwart" : id(wijzerplaat).current_option().str());
          const lv_color_t merk = lv_color_hex(w.merk), sub = lv_color_hex(w.sub);
          const bool licht = ((w.plaat >> 16) & 0xFF) + ((w.plaat >> 8) & 0xFF) + (w.plaat & 0xFF) > 450;
          lv_obj_set_style_bg_color(id(ontwerp_vierkant), lv_color_hex(w.plaat), 0);
          // De plaat: textuur (128 = plaatkleur) maal de kleur, direct in de canvasbuffer
          lv_draw_buf_t *buf = lv_canvas_get_draw_buf(id(plaat_canvas));
          if (buf != nullptr && buf->header.cf == LV_COLOR_FORMAT_RGB565) {
            const int d = buf->header.w;
            const int T = alarmklok::WIJZERPLAAT_MAAT;
            const int pr = (w.plaat >> 16) & 0xFF, pg = (w.plaat >> 8) & 0xFF, pb = w.plaat & 0xFF;
            for (int y = 0; y < d; y++) {
              uint16_t *rij = (uint16_t *) (buf->data + y * buf->header.stride);
              const uint8_t *tex = alarmklok::WIJZERPLAAT_TEXTUUR + (y * T / d) * T;
              for (int x = 0; x < d; x++) {
                const int m = tex[x * T / d];
                const int r = pr * m / 128, g = pg * m / 128, b = pb * m / 128;
                rij[x] = lv_color_to_u16(lv_color_make(r > 255 ? 255 : r, g > 255 ? 255 : g, b > 255 ? 255 : b));
              }
            }
            lv_obj_invalidate(id(plaat_canvas));
          }
          // Cijfers in de merkkleur, minuutrand lichter, uurindexen gepolijst
          // (staal op een donkere plaat, geblauwd staal op een lichte)
          const lv_color_t index_licht = lv_color_hex(licht ? 0x5A6C92 : 0xF6F7F9);
          const lv_color_t index_donker = lv_color_hex(licht ? 0x2E3A55 : 0xB8BDC7);
          lv_obj_t *merken = id(vierkant_merken);
          for (uint32_t i = 0; i < lv_obj_get_child_count(merken); i++) {
            lv_obj_t *o = lv_obj_get_child(merken, i);
            if (lv_obj_check_type(o, &lv_label_class)) {
              lv_obj_set_style_text_color(o, merk, 0);
            } else {
              const intptr_t soort = (intptr_t) lv_obj_get_user_data(o);
              lv_obj_set_style_line_color(o, soort == 2 ? index_licht : soort == 1 ? index_donker : sub, 0);
            }
          }
          // Wijzers: staal; op een lichte plaat geblauwd (ingekleurd)
          lv_obj_t *wijzers[] = {id(wijzer_v_uur), id(wijzer_v_minuut)};
          for (auto *o : wijzers) {
            lv_obj_set_style_image_recolor(o, lv_color_hex(0x1C3A78), 0);
            lv_obj_set_style_image_recolor_opa(o, licht ? 170 : 0, 0);
          }
          lv_obj_t *schaduwen[] = {id(wijzer_vs_uur), id(wijzer_vs_minuut)};
          for (auto *o : schaduwen)
            lv_obj_set_style_image_opa(o, licht ? 120 : 200, 0);
          lv_obj_set_style_text_color(id(lbl_v_datum), merk, 0);
          lv_obj_t *klein[] = {id(lbl_v_wekker), id(lbl_v_weer), id(lbl_v_buiten), id(lbl_v_huis),
                               id(lbl_v_binnen)};
          for (auto *o : klein)
            lv_obj_set_style_text_color(o, sub, 0);

  # Sterren achter de maan (eenmalig bij het opstarten), niet achter de maan zelf
  - id: sterren_maken
    then:
      - lambda: |-
          lv_obj_t *vlak = id(maan_sterren);
          lv_obj_update_layout(vlak);
          const int b = lv_obj_get_width(vlak), h = lv_obj_get_height(vlak);
          // Vrij houden: het hele gebied waar de maan zwerft, plus een marge
          if (id(maan_basis_x) < 0) {
            id(maan_basis_x) = lv_obj_get_x(id(maan_canvas));
            id(maan_basis_y) = lv_obj_get_y(id(maan_canvas));
          }
          const int zwerf = (int) (14 * ${k}) + 8;
          const int d = lv_obj_get_width(id(maan_canvas));
          const int x1 = id(maan_basis_x) - zwerf, y1 = id(maan_basis_y) - zwerf;
          const int x2 = id(maan_basis_x) + d + zwerf, y2 = id(maan_basis_y) + d + zwerf;
          for (int i = 0; i < 40; i++) {
            int x, y, g;
            alarmklok::ster(i, b, h, x, y, g);
            if (x + g >= x1 && x <= x2 && y + g >= y1 && y <= y2)
              continue;
            if (x > b * 6 / 10 && y < h / 5)  // niet door de temperaturen rechtsboven
              continue;
            lv_obj_t *s = lv_obj_create(vlak);
            lv_obj_remove_style_all(s);
            lv_obj_set_size(s, g, g);
            lv_obj_set_pos(s, x, y);
            lv_obj_set_style_radius(s, LV_RADIUS_CIRCLE, 0);
            lv_obj_set_style_bg_color(s, lv_color_hex(0x8C98B0), 0);
            lv_obj_set_style_bg_opa(s, (lv_opa_t) (70 + (i * 37) % 90), 0);
            lv_obj_remove_flag(s, LV_OBJ_FLAG_CLICKABLE);
          }

  # Klokkleur op de cijfers (Digitaal, Gestapeld, Info, Zon), de wijzers en Zwevend
  - id: klokkleur_toepassen
    then:
      - lvgl.style.update:
          id: klok_tekst
          text_color: !lambda return lv_color_hex(alarmklok::klok_kleur(id(klokkleur).current_option().str()));
      - lambda: |-
          const uint32_t kleur = alarmklok::klok_kleur(id(klokkleur).current_option().str());
          lv_obj_set_style_text_color(id(lbl_f_uur), lv_color_hex(kleur), 0);
          lv_obj_set_style_text_color(id(lbl_f_min), lv_color_hex(alarmklok::meng(kleur, 0xFFFFFF, 0.45f)), 0);
          lv_obj_set_style_line_color(id(wijzer_uur)->obj, lv_color_hex(kleur), 0);
          lv_obj_set_style_line_color(id(wijzer_minuut)->obj, lv_color_hex(kleur), 0);

  # Ontwerp Zon: luchtkleur uit de zonnehoogte, zon of maan op de boog
  - id: zon_bijwerken
    then:
      - lambda: |-
          auto nu = id(klok).now();
          if (!nu.is_valid())
            return;
          uint32_t boven, onder;
          alarmklok::lucht_kleur(id(zon).elevation(), boven, onder);
          lv_obj_set_style_bg_color(id(zon_lucht), lv_color_hex(boven), 0);
          lv_obj_set_style_bg_grad_color(id(zon_lucht), lv_color_hex(onder), 0);
          auto op = id(zon).sunrise(-0.833);
          auto ondergang = id(zon).sunset(-0.833);
          const int op_min = op.has_value() ? op->hour * 60 + op->minute : 7 * 60;
          const int onder_min = ondergang.has_value() ? ondergang->hour * 60 + ondergang->minute : 19 * 60;
          bool dag;
          const float f = alarmklok::zon_fractie(nu.hour * 60 + nu.minute, op_min, onder_min, dag);
          const int cx = lv_obj_get_x(id(zon_boog)) + lv_obj_get_width(id(zon_boog)) / 2;
          const int cy = lv_obj_get_y(id(zon_boog)) + lv_obj_get_height(id(zon_boog)) / 2;
          const int r = lv_obj_get_width(id(zon_boog)) / 2;
          int x, y;
          alarmklok::boog_punt(f, cx, cy, r, x, y);
          const int d = lv_obj_get_width(id(zon_bol));
          lv_obj_set_pos(id(zon_bol), x - d / 2, y - d / 2);
          lv_obj_set_style_bg_color(id(zon_bol), lv_color_hex(dag ? 0xFFD36B : 0xDDE3EE), 0);
          lv_obj_set_style_shadow_color(id(zon_bol), lv_color_hex(dag ? 0xFFB347 : 0x8FA3C8), 0);

  # Stippen onderaan: op welke pagina ben je?
  - id: pagina_indicator_bijwerken
    then:
      - lvgl.label.update:
          id: pagina_indicator
          text: !lambda |-
            auto *tile = lv_tileview_get_tile_active(id(tv_hoofd));
            int index = tile == nullptr ? 0 : lv_obj_get_x(tile) / lv_obj_get_width(id(tv_hoofd));
            return alarmklok::stippen(index, 6, "");

  # ---------------------------------------------------------------------------
  #  Scherm
  # ---------------------------------------------------------------------------
  - id: scherm_bijwerken
    then:
      - lambda: |-
          auto nu = id(klok).now();
          std::string tijd = nu.is_valid() ? nu.strftime("%H:%M") : std::string("--:--");
          std::string datum = nu.is_valid()
              ? alarmklok::datum_tekst(nu.day_of_week, nu.day_of_month, nu.month)
              : std::string("Tijd ophalen...");

          char temp[16] = "";
          if (!std::isnan(id(buitentemperatuur).state))
            snprintf(temp, sizeof(temp), "%.1f°", id(buitentemperatuur).state);

          // Eerstvolgende wekker van de drie (na "overslaan" de wekker daarna)
          char wekker[64];
          const int nu_minuut = nu.is_valid() ? nu.hour * 60 + nu.minute : 0;
          alarmklok::WekkerInfo w[3];
          for (int i = 0; i < 3; i++) {
            const auto *t = id(wekker_tijd_lijst)[i];
            w[i] = {id(wekker_aan_lijst)[i]->state,
                    id(wekker_dagen_lijst)[i]->current_option().str(), t->hour * 60 + t->minute};
          }
          int eerst = -1, eerst_minuten = -1;
          if (nu.is_valid()) {
            eerst = id(overslaan).state
                ? alarmklok::wekker_na_overslaan(w, 3, nu.day_of_week, nu_minuut, eerst_minuten)
                : alarmklok::eerstvolgende_wekker(w, 3, nu.day_of_week, nu_minuut, eerst_minuten);
          } else {
            // Zonder geldige tijd: staat er wel een wekker aan? (voor de waarschuwing)
            for (int i = 0; i < 3 && eerst < 0; i++)
              if (w[i].aan)
                eerst = i;
          }

          // Voor HA: tijdstip van de volgende wekker (alleen bij een wijziging)
          std::string volgende;
          if (nu.is_valid() && eerst >= 0) {
            const time_t wanneer = nu.timestamp - nu.second + (time_t) eerst_minuten * 60;
            volgende = ESPTime::from_epoch_utc(wanneer).strftime("%Y-%m-%dT%H:%M:%S+00:00");
          }
          if (!id(volgende_wekker).has_state() || id(volgende_wekker).state != volgende)
            id(volgende_wekker).publish_state(volgende);
          if (!nu.is_valid() && eerst >= 0) {
            // Belangrijker dan de wektijd: zonder tijd gaat de wekker niet af
            snprintf(wekker, sizeof(wekker), "Tijd onbekend: wekker gaat niet af");
          } else if (id(snoozet) && id(snooze_tot) > 0) {
            auto t = ESPTime::from_epoch_local(id(snooze_tot));
            snprintf(wekker, sizeof(wekker), "Snooze tot %02d:%02d", t.hour, t.minute);
          } else if (eerst < 0) {
            snprintf(wekker, sizeof(wekker), "Wekker uit");
          } else {
            const auto *t = id(wekker_tijd_lijst)[eerst];
            snprintf(wekker, sizeof(wekker), "%s",
                     alarmklok::volgende_wekker_tekst(eerst_minuten, nu.day_of_week, nu_minuut,
                                                      t->hour, t->minute).c_str());
          }

          // Digitaal
          lv_label_set_text(id(lbl_tijd), tijd.c_str());
          lv_label_set_text(id(lbl_datum), datum.c_str());
          lv_label_set_text(id(lbl_temperatuur), temp);
          lv_label_set_text(id(lbl_wekker_info), wekker);
          lv_label_set_text(id(lbl_verbinding),
              id(api_verbonden).state ? "" : "Geen verbinding met Home Assistant");
          // Analoog (de wijzers worden hieronder gezet)
          lv_label_set_text(id(lbl_a_tijd), tijd.c_str());
          lv_label_set_text(id(lbl_a_datum), datum.c_str());
          lv_label_set_text(id(lbl_a_temp), temp);
          lv_label_set_text(id(lbl_a_wekker), wekker);
          // Gestapeld
          lv_label_set_text(id(lbl_s_uur), tijd.substr(0, 2).c_str());
          lv_label_set_text(id(lbl_s_min), tijd.substr(3, 2).c_str());
          lv_label_set_text(id(lbl_s_datum), datum.c_str());
          lv_label_set_text(id(lbl_s_wekker), wekker);
          // Info
          lv_label_set_text(id(lbl_i_tijd), tijd.c_str());
          lv_label_set_text(id(lbl_i_datum), datum.c_str());
          lv_label_set_text(id(lbl_i_temp), temp[0] ? temp : "--");
          lv_label_set_text(id(lbl_i_wekker), wekker);
          char wakeup[32];
          if (id(wakeup_minuten).state > 0)
            snprintf(wakeup, sizeof(wakeup), "%.0f min vooraf", id(wakeup_minuten).state);
          else
            snprintf(wakeup, sizeof(wakeup), "Uit");
          lv_label_set_text(id(lbl_i_wakeup), wakeup);
          // Zon
          lv_label_set_text(id(lbl_z_tijd), tijd.c_str());
          lv_label_set_text(id(lbl_z_datum), datum.c_str());
          lv_label_set_text(id(lbl_z_wekker), wekker);
          // Zwevend
          lv_label_set_text(id(lbl_f_uur), tijd.substr(0, 2).c_str());
          lv_label_set_text(id(lbl_f_min), tijd.substr(3, 2).c_str());
          lv_label_set_text(id(lbl_f_info), wekker);
          // Maan
          lv_label_set_text(id(lbl_m_tijd), tijd.c_str());
          {
            // Binnen (thermostaat) en buiten, rechtsboven
            char binnen[24] = "", buiten[24] = "";
            if (!std::isnan(id(klimaat_huidig).state))
              snprintf(binnen, sizeof(binnen), "Binnen %.1f\u00B0", id(klimaat_huidig).state);
            if (temp[0])
              snprintf(buiten, sizeof(buiten), "Buiten %s", temp);
            std::string temps = binnen;
            if (binnen[0] && buiten[0])
              temps += "\n";
            temps += buiten;
            lv_label_set_text(id(lbl_m_temp), temps.c_str());
          }
          lv_label_set_text(id(lbl_m_wekker), wekker);
          // Vierkant: korte datum ("DONDERDAG 22") en de wekker
          {
            std::string kort = datum.substr(0, datum.rfind(' '));
            for (auto &c : kort)
              c = toupper((unsigned char) c);
            lv_label_set_text(id(lbl_v_datum), kort.c_str());
            lv_label_set_text(id(lbl_v_wekker), wekker);
            // Buiten en binnen, zonder tekst (weericoon en huisje ervoor)
            char t[12];
            if (std::isnan(id(buitentemperatuur).state))
              snprintf(t, sizeof(t), "--");
            else
              snprintf(t, sizeof(t), "%.0f\u00B0", id(buitentemperatuur).state);
            lv_label_set_text(id(lbl_v_buiten), t);
            if (std::isnan(id(klimaat_huidig).state))
              snprintf(t, sizeof(t), "--");
            else
              snprintf(t, sizeof(t), "%.0f\u00B0", id(klimaat_huidig).state);
            lv_label_set_text(id(lbl_v_binnen), t);
          }
          // Wekker gaat af
          lv_label_set_text(id(lbl_tijd_alarm), tijd.c_str());
      - if:
          condition:
            lambda: return id(klok).now().is_valid();
          then:
            - lvgl.indicator.update:
                id: wijzer_uur
                value: !lambda |-
                  auto nu = id(klok).now();
                  return (nu.hour % 12) * 60 + nu.minute;
            - lvgl.indicator.update:
                id: wijzer_minuut
                value: !lambda return id(klok).now().minute;
            - lvgl.indicator.update:
                id: wijzer_seconde
                value: !lambda return id(klok).now().second;
            # Vierkant: wijzers (beelden) draaien, in tienden van graden; per minuut
            - lambda: |-
                auto nu = id(klok).now();
                const int uur = (nu.hour % 12) * 300 + nu.minute * 5;
                const int minuut = nu.minute * 60;
                lv_image_set_rotation(id(wijzer_v_uur), uur);
                lv_image_set_rotation(id(wijzer_vs_uur), uur);
                lv_image_set_rotation(id(wijzer_v_minuut), minuut);
                lv_image_set_rotation(id(wijzer_vs_minuut), minuut);

  # Alle widgets gelijkzetten met de huidige instellingen
  - id: ui_synchroniseren
    mode: queued
    max_runs: 3
    then:
      - lvgl.widget.update:
          id: knop_overslaan
          state:
            checked: !lambda return id(overslaan).state;
      # Pagina Wekker toont de wekker die je aan het instellen bent
      - lvgl.widget.update:
          id: knop_wekker_1
          state:
            checked: !lambda return id(bewerk_wekker) == 1;
      - lvgl.widget.update:
          id: knop_wekker_2
          state:
            checked: !lambda return id(bewerk_wekker) == 2;
      - lvgl.widget.update:
          id: knop_wekker_3
          state:
            checked: !lambda return id(bewerk_wekker) == 3;
      - lvgl.roller.update:
          id: rl_uur
          selected_index: !lambda return id(wekker_tijd_lijst)[id(bewerk_wekker) - 1]->hour;
      - lvgl.roller.update:
          id: rl_minuut
          selected_index: !lambda return id(wekker_tijd_lijst)[id(bewerk_wekker) - 1]->minute / 5;
      - lvgl.widget.update:
          id: sw_wekker
          state:
            checked: !lambda return id(wekker_aan_lijst)[id(bewerk_wekker) - 1]->state;
      - lvgl.dropdown.update:
          id: dd_wekdagen
          selected_index: !lambda |-
            return id(wekker_dagen_lijst)[id(bewerk_wekker) - 1]->active_index().value_or(0);
      - lvgl.widget.update:
          id: sw_oplopen
          state:
            checked: !lambda return id(oplopen_seconden).state > 0;
      - lvgl.dropdown.update:
          id: dd_wekgeluid
          selected_index: !lambda return id(wekgeluid).active_index().value_or(0);
      - lvgl.slider.update:
          id: sl_volume
          value: !lambda return id(volume).state;
      - lvgl.label.update:
          id: lbl_volume
          text:
            format: "Wekvolume: %.0f%%"
            args: [id(volume).state]
      - lvgl.slider.update:
          id: sl_wakeup
          value: !lambda return id(wakeup_minuten).state;
      - lvgl.label.update:
          id: lbl_wakeup
          text:
            format: "Wake-up light: %.0f min vooraf"
            args: [id(wakeup_minuten).state]
      - script.execute: toon_klokontwerp
      - script.execute: scherm_bijwerken

  # Helderheid: overdag/'s nachts, en na aanraken even fel.
  # In de nachtstand vangt een onzichtbare laag de eerste tik op, zodat je in
  # het donker niet per ongeluk een lamp aanzet als je het scherm wekt.
  - id: helderheid_regelen
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          auto nu = id(klok).now();
          bool nacht = false;
          if (nu.is_valid()) {
            nacht = alarmklok::in_venster(nu.hour * 60 + nu.minute,
                id(nacht_vanaf).hour * 60 + id(nacht_vanaf).minute,
                id(nacht_tot).hour * 60 + id(nacht_tot).minute);
          }
          id(licht_donker) = alarmklok::donker(id(licht_lux), id(nacht_lux).state, id(licht_donker));
          if (id(nacht_op_licht).state && id(licht_donker))
            nacht = true;
          id(nachtstand) = nacht;
      - if:
          condition:
            lambda: |-
              bool actief = id(gaat_af) || millis() - id(laatste_aanraking_ms) < 20000;
              return id(nachtstand) && !actief;
          then:
            - if:
                condition:
                  lambda: return !id(overlay_zichtbaar);
                then:
                  - lambda: id(overlay_zichtbaar) = true;
                  - script.execute: naar_klokscherm
                  - lvgl.widget.hide: [pagina_indicator, lbl_ontwerp_stippen]
                  - lvgl.widget.show: wek_laag
                  # Maanscherm of rood filter over alles (zoals StandBy)
                  - script.execute: nacht_stijl
          else:
            - if:
                condition:
                  lambda: return id(overlay_zichtbaar);
                then:
                  - lambda: id(overlay_zichtbaar) = false;
                  - lvgl.widget.hide: wek_laag
                  - lvgl.widget.show: lbl_ontwerp_stippen
                  - script.execute: nacht_stijl
                  - if:
                      condition:
                        lambda: return !id(gaat_af);
                      then:
                        - lvgl.widget.show: pagina_indicator
      - lambda: |-
          float doel;
          if (id(gaat_af))
            doel = 1.0f;
          else if (id(overlay_zichtbaar))
            doel = id(helderheid_nacht).state / 100.0f;
          else
            doel = id(helderheid_dag).state / 100.0f;
          if (std::fabs(doel - id(huidige_helderheid)) > 0.005f) {
            id(huidige_helderheid) = doel;
            auto call = id(backlight).turn_on();
            call.set_brightness(doel);
            call.perform();
          }
