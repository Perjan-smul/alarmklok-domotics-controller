# =============================================================================
#  Bluetooth-proxy voor Home Assistant
#
#  De klok geeft Bluetooth-apparaten in de buurt door aan Home Assistant, en
#  HA kan via de klok verbinding met ze maken (active). Zo bedient de
#  SwitchBot-integratie in HA bijvoorbeeld een SwitchBot Curtain 3 naast het
#  bed, zonder hub: HA kiest vanzelf de proxy die het gordijn het best hoort.
#
#  Op de P4-borden (7" en 4B) loopt Bluetooth via de ESP32-C6, net als wifi;
#  houd daarvoor de firmware van de C6 bij (update "Wifi-chip (C6)" in HA).
#  Op de 4" (S3) gebruikt hij de eigen Bluetooth van de S3.
#  Korte scanvensters (30 ms per 320 ms) laten genoeg tijd over voor wifi.
# =============================================================================

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 30ms

bluetooth_proxy:
  active: true
  connection_slots: 3
