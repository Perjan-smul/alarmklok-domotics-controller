# =============================================================================
#  Statussen uit Home Assistant voor de bedieningspagina's
#  (thermostaat, rolluik, mediaspeler en de dimlamp)
# =============================================================================

sensor:
  # Helderheid (0-255) van de dimlamp; NaN als de lamp uit staat
  - platform: homeassistant
    id: dim_lamp_helderheid
    entity_id: ${dim_lamp}
    attribute: brightness
    internal: true
    on_value:
      - lvgl.slider.update:
          id: sl_dimmer
          value: !lambda "return std::isnan(x) ? 0 : x;"
      - lvgl.label.update:
          id: lbl_dimmer
          text: !lambda |-
            if (std::isnan(x) || x < 3) return std::string("Uit");
            return std::to_string((int) (x * 100.0f / 255.0f + 0.5f)) + "%";

  - platform: homeassistant
    id: klimaat_huidig
    entity_id: ${thermostaat}
    attribute: current_temperature
    internal: true
    on_value:
      - script.execute: klimaat_status_tonen

  - platform: homeassistant
    id: klimaat_doel
    entity_id: ${thermostaat}
    attribute: temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_klimaat_doel
          text:
            format: "%.1f°"
            args: [x]

  - platform: homeassistant
    id: rolluik_positie
    entity_id: ${rolluik}
    attribute: current_position
    internal: true
    on_value:
      - lvgl.slider.update:
          id: sl_rolluik
          value: !lambda "return std::isnan(x) ? 0 : x;"
      - lvgl.label.update:
          id: lbl_rolluik
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            if (x < 1) return std::string("Dicht");
            if (x > 99) return std::string("Open");
            return "Open " + std::to_string((int) (x + 0.5f)) + "%";

  # Batterij van het rolluik/gordijn: icoon en percentage op de rolluikkaart,
  # rood onder de 20%. Geen waarde (sensor bestaat niet): niets tonen.
  - platform: homeassistant
    id: rolluik_batterij_procent
    entity_id: ${rolluik_batterij}
    internal: true
    on_value:
      - lambda: |-
          lv_obj_t *rij = id(rolluik_batterij_rij);
          if (std::isnan(x)) {
            lv_obj_add_flag(rij, LV_OBJ_FLAG_HIDDEN);
            return;
          }
          const lv_color_t kleur = lv_color_hex(x < 20 ? 0xFF6B5A : 0xFFFFFF);
          lv_label_set_text(id(lbl_rolluik_batterij_icoon), alarmklok::batterij_icoon(x));
          lv_label_set_text_fmt(id(lbl_rolluik_batterij), "%d%%", (int) (x + 0.5f));
          lv_obj_set_style_text_color(id(lbl_rolluik_batterij_icoon), kleur, 0);
          lv_obj_set_style_text_color(id(lbl_rolluik_batterij), kleur, 0);
          lv_obj_clear_flag(rij, LV_OBJ_FLAG_HIDDEN);

  # volume_level is 0..1
  - platform: homeassistant
    id: media_volume
    entity_id: ${mediaspeler}
    attribute: volume_level
    internal: true
    on_value:
      - lvgl.slider.update:
          id: sl_media_volume
          value: !lambda "return std::isnan(x) ? 0 : x * 100.0f;"

text_sensor:
  # Toestand van de weerentiteit (sunny, cloudy, rainy, ...), voor het
  # weericoon op de klok "Vierkant"
  - platform: homeassistant
    id: weer_toestand
    entity_id: ${weer_entiteit}
    internal: true
    on_value:
      - lambda: lv_label_set_text(id(lbl_v_weer), alarmklok::weer_icoon(x));

  # Wat de thermostaat nu doet: heating, cooling, idle, off, ...
  - platform: homeassistant
    id: klimaat_actie
    entity_id: ${thermostaat}
    attribute: hvac_action
    internal: true
    on_value:
      - script.execute: klimaat_status_tonen

  - platform: homeassistant
    id: media_status
    entity_id: ${mediaspeler}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_media_playpause
          text: !lambda |-
            return std::string(x == "playing" ? "\U000F03E4" : "\U000F040A");

  - platform: homeassistant
    id: media_titel
    entity_id: ${mediaspeler}
    attribute: media_title
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_media_titel
          text: !lambda "return x.empty() ? std::string(\"Niets aan het afspelen\") : x;"

  - platform: homeassistant
    id: media_artiest
    entity_id: ${mediaspeler}
    attribute: media_artist
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_media_artiest
          text: !lambda return x;

script:
  # "Nu 20.3° · Verwarmen" onder de titel van de thermostaatkaart
  - id: klimaat_status_tonen
    then:
      - lambda: |-
          std::string tekst;
          if (!std::isnan(id(klimaat_huidig).state)) {
            char buf[16];
            snprintf(buf, sizeof(buf), "Nu %.1f\u00B0", id(klimaat_huidig).state);
            tekst = buf;
          }
          const std::string actie = id(klimaat_actie).state;
          const char *nl = actie == "heating" ? "Verwarmen" : actie == "cooling" ? "Koelen"
                         : actie == "drying" ? "Drogen" : actie == "fan" ? "Ventileren"
                         : actie == "idle" ? "Rust" : actie == "off" ? "Uit" : "";
          if (nl[0] != '\0')
            tekst += tekst.empty() ? nl : std::string(" \u00B7 ") + nl;
          lv_label_set_text(id(lbl_klimaat_huidig), tekst.c_str());
