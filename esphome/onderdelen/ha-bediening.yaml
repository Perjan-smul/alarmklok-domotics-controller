# =============================================================================
#  Statussen uit Home Assistant voor de bedieningspagina's
#  (thermostaat, rolluik, mediaspeler en de dimlamp)
#
#  Welke entiteiten dat zijn stel je in Home Assistant in (Configuratie van de
#  klok, of het dashboard uit homeassistant/dashboard/), zonder te flashen. De
#  substitutions (thermostaat, rolluik, ...) zijn alleen de standaard bij de
#  eerste start. Een andere entiteit laat de klok na 5 s even herstarten: HA
#  geeft de lijst met gevolgde entiteiten alleen bij het verbinden door.
# =============================================================================

esphome:
  on_boot:
    # Vóór de verbinding met HA (zoals de tegels, zie kern.yaml)
    - priority: 600
      then:
        - script.execute: bediening_volgen
    - priority: -100
      then:
        - lambda: |-
            ESP_LOGI("bediening", "Entiteiten: thermostaat %s, rolluik %s, mediaspeler %s, dimlamp %s",
                     id(cfg_thermostaat).state.c_str(), id(cfg_rolluik).state.c_str(),
                     id(cfg_mediaspeler).state.c_str(), id(cfg_dim_lamp).state.c_str());
            lv_label_set_text(id(lbl_dimmer_naam), id(cfg_dim_lamp_naam).state.c_str());

text:
  - platform: template
    id: cfg_thermostaat
    name: Thermostaat
    icon: mdi:thermostat
    entity_category: config
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: "${thermostaat}"
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: tegels_herladen

  - platform: template
    id: cfg_rolluik
    name: Rolluik
    icon: mdi:window-shutter
    entity_category: config
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: "${rolluik}"
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: tegels_herladen

  - platform: template
    id: cfg_rolluik_batterij
    name: Rolluik batterij
    icon: mdi:battery
    entity_category: config
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: "${rolluik_batterij}"
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: tegels_herladen

  - platform: template
    id: cfg_mediaspeler
    name: Mediaspeler
    icon: mdi:speaker
    entity_category: config
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: "${mediaspeler}"
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: tegels_herladen

  - platform: template
    id: cfg_dim_lamp
    name: Dimlamp
    icon: mdi:lightbulb-on
    entity_category: config
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: "${dim_lamp}"
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: tegels_herladen

  - platform: template
    id: cfg_dim_lamp_naam
    name: Dimlamp naam
    icon: mdi:form-textbox
    entity_category: config
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: "${dim_lamp_naam}"
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - lambda: lv_label_set_text(id(lbl_dimmer_naam), x.c_str());

sensor:
  # Helderheid (0-255) van de dimlamp; NaN als de lamp uit staat
  - platform: template
    id: dim_lamp_helderheid
    update_interval: never
    internal: true
    on_value:
      - lvgl.slider.update:
          id: sl_dimmer
          value: !lambda "return std::isnan(x) ? 0 : x;"
      - lvgl.label.update:
          id: lbl_dimmer
          text: !lambda |-
            if (std::isnan(x) || x < 3) return std::string("Uit");
            return std::to_string((int) (x * 100.0f / 255.0f + 0.5f)) + "%";

  - platform: template
    id: klimaat_huidig
    update_interval: never
    internal: true
    on_value:
      - script.execute: klimaat_status_tonen

  - platform: template
    id: klimaat_doel
    update_interval: never
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_klimaat_doel
          text:
            format: "%.1f°"
            args: [x]

  - platform: template
    id: rolluik_positie
    update_interval: never
    internal: true
    on_value:
      - lvgl.slider.update:
          id: sl_rolluik
          value: !lambda "return std::isnan(x) ? 0 : x;"
      - lvgl.label.update:
          id: lbl_rolluik
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            if (x < 1) return std::string("Dicht");
            if (x > 99) return std::string("Open");
            return "Open " + std::to_string((int) (x + 0.5f)) + "%";

  # Batterij van het rolluik/gordijn: icoon en percentage op de rolluikkaart,
  # rood onder de 20%. Geen waarde (sensor bestaat niet): niets tonen.
  - platform: template
    id: rolluik_batterij_procent
    update_interval: never
    internal: true
    on_value:
      - lambda: |-
          lv_obj_t *rij = id(rolluik_batterij_rij);
          if (std::isnan(x)) {
            lv_obj_add_flag(rij, LV_OBJ_FLAG_HIDDEN);
            return;
          }
          const lv_color_t kleur = lv_color_hex(x < 20 ? 0xFF6B5A : 0xFFFFFF);
          lv_label_set_text(id(lbl_rolluik_batterij_icoon), alarmklok::batterij_icoon(x));
          lv_label_set_text_fmt(id(lbl_rolluik_batterij), "%d%%", (int) (x + 0.5f));
          lv_obj_set_style_text_color(id(lbl_rolluik_batterij_icoon), kleur, 0);
          lv_obj_set_style_text_color(id(lbl_rolluik_batterij), kleur, 0);
          lv_obj_clear_flag(rij, LV_OBJ_FLAG_HIDDEN);

  # volume_level is 0..1
  - platform: template
    id: media_volume
    update_interval: never
    internal: true
    on_value:
      - lvgl.slider.update:
          id: sl_media_volume
          value: !lambda "return std::isnan(x) ? 0 : x * 100.0f;"

text_sensor:
  # Toestand van de weerentiteit (sunny, cloudy, rainy, ...), voor het
  # weericoon op de klok "Vierkant"
  - platform: homeassistant
    id: weer_toestand
    entity_id: ${weer_entiteit}
    internal: true
    on_value:
      - lambda: lv_label_set_text(id(lbl_v_weer), alarmklok::weer_icoon(x));

  # Stand van de airco/thermostaat (off, heat_cool, cool, heat, dry, fan_only)
  - platform: template
    id: klimaat_modus
    update_interval: never
    internal: true
    on_value:
      - script.execute: klimaat_modus_tonen
      - script.execute: klimaat_status_tonen

  # Wat de thermostaat nu doet: heating, cooling, idle, off, ...
  - platform: template
    id: klimaat_actie
    update_interval: never
    internal: true
    on_value:
      - script.execute: klimaat_status_tonen

  - platform: template
    id: media_status
    update_interval: never
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_media_playpause
          text: !lambda |-
            return std::string(x == "playing" ? "\U000F03E4" : "\U000F040A");

  - platform: template
    id: media_titel
    update_interval: never
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_media_titel
          text: !lambda "return x.empty() ? std::string(\"Niets aan het afspelen\") : x;"

  - platform: template
    id: media_artiest
    update_interval: never
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_media_artiest
          text: !lambda return x;

script:
  # "Nu 20.3° · Verwarmen" onder de titel van de thermostaatkaart
  - id: klimaat_status_tonen
    then:
      - lambda: |-
          // "Koelen · nu 22,1°": de stand van de airco en de temperatuur nu;
          // zonder stand (gewone thermostaat) wat hij doet (verwarmen, rust)
          std::string stand = id(klimaat_modus).state;
          if (alarmklok::airco_index(stand) < 0) {
            const std::string actie = id(klimaat_actie).state;
            stand = actie == "heating" ? "heat" : actie == "cooling" ? "cool" : actie == "drying" ? "dry"
                  : actie == "fan" ? "fan_only" : actie == "off" ? "off" : "";
          }
          lv_label_set_text(id(lbl_klimaat_huidig),
                            alarmklok::airco_status(stand, id(klimaat_huidig).state).c_str());

  - id: bediening_volgen
    then:
      - lambda: |-
          // Getal uit HA, of NaN ("None", "unavailable", leeg)
          auto getal = [](StringRef w) -> float {
            const std::string t = w.str();
            char *eind = nullptr;
            const float x = std::strtof(t.c_str(), &eind);
            return (t.empty() || eind == t.c_str()) ? NAN : x;
          };
          auto volg_getal = [&](const std::string &ent, const char *attr, sensor::Sensor *doel) {
            if (ent.empty())
              return;
            api::global_api_server->subscribe_home_assistant_state(
                ent, attr ? optional<std::string>(attr) : optional<std::string>(),
                std::function<void(StringRef)>([doel, getal](StringRef w) { doel->publish_state(getal(w)); }));
          };
          auto volg_tekst = [](const std::string &ent, const char *attr, text_sensor::TextSensor *doel) {
            if (ent.empty())
              return;
            api::global_api_server->subscribe_home_assistant_state(
                ent, attr ? optional<std::string>(attr) : optional<std::string>(),
                std::function<void(StringRef)>([doel](StringRef w) { doel->publish_state(w.str()); }));
          };
          const std::string thermostaat = id(cfg_thermostaat).state, rolluik = id(cfg_rolluik).state,
                            batterij = id(cfg_rolluik_batterij).state, speler = id(cfg_mediaspeler).state,
                            lamp = id(cfg_dim_lamp).state;
          volg_getal(lamp, "brightness", id(dim_lamp_helderheid));
          volg_getal(thermostaat, "current_temperature", id(klimaat_huidig));
          volg_getal(thermostaat, "temperature", id(klimaat_doel));
          volg_tekst(thermostaat, "hvac_action", id(klimaat_actie));
          volg_tekst(thermostaat, nullptr, id(klimaat_modus));
          volg_getal(rolluik, "current_position", id(rolluik_positie));
          volg_getal(batterij, nullptr, id(rolluik_batterij_procent));
          volg_getal(speler, "volume_level", id(media_volume));
          volg_tekst(speler, nullptr, id(media_status));
          volg_tekst(speler, "media_title", id(media_titel));
          volg_tekst(speler, "media_artist", id(media_artiest));
