# =============================================================================
#  Klokontwerp "Vierkant": een realistische analoge klok over het hele
#  vierkante scherm. De plaat (geborstelde sunray, lichtval van linksboven,
#  glasglans en de zachte schaduwen van de opgezette uurindexen) wordt bij het
#  opstarten in de gekozen kleur getekend (script plaat_toepassen, textuur uit
#  wijzerplaat_textuur.h). Daarop: gedrukte minutenrand en cijfers, opgezette
#  uurindexen in twee tinten, facetwijzers met zachte schaduw (beelden uit
#  afbeeldingen/, gemaakt met tools/wijzerplaat.py) en een bol asje. Onder het
#  midden het weer en de temperaturen buiten en binnen.
#  Maten schalen met k (480x480 = 1); x0 schuift de plaat opzij (7": midden).
# =============================================================================
obj:
  id: ontwerp_vierkant
  # Iets groter dan het scherm: de dagelijkse verschuiving (tegen inbranden)
  # laat dan geen rand zien
  x: '${x0 - (12 * (k | float)) | int}'
  y: '${(-12 * (k | float)) | int}'
  width: '${(504 * (k | float)) | int}'
  height: '${(504 * (k | float)) | int}'
  hidden: true
  border_width: 0
  radius: 0
  pad_all: 0
  bg_opa: COVER
  bg_color: 0x1D3068
  scrollable: false
  widgets:
    # De plaat zelf, getekend door plaat_toepassen
    - canvas:
        id: plaat_canvas
        width: '${(504 * (k | float)) | int}'
        height: '${(504 * (k | float)) | int}'
    # De wijzerplaat, 480x480 in het midden
    - obj:
        align: CENTER
        width: '${(480 * (k | float)) | int}'
        height: '${(480 * (k | float)) | int}'
        styles: leeg
        scrollable: false
        widgets:
          # Gedrukte cijfers, minutenrand en opgezette uurindexen (vierkant_maken)
          - obj:
              id: vierkant_merken
              width: 100%
              height: 100%
              styles: leeg
              widgets:
                - label:
                    align: CENTER
                    x: '${(0 * (k | float)) | int}'
                    y: '${(-178 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text: "12"
                - label:
                    align: CENTER
                    x: '${(178 * (k | float)) | int}'
                    y: '${(-103 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text: "2"
                - label:
                    align: CENTER
                    x: '${(178 * (k | float)) | int}'
                    y: '${(103 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text: "4"
                - label:
                    align: CENTER
                    x: 0
                    y: '${(178 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text: "6"
                - label:
                    align: CENTER
                    x: '${(-178 * (k | float)) | int}'
                    y: '${(103 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text: "8"
                - label:
                    align: CENTER
                    x: '${(-178 * (k | float)) | int}'
                    y: '${(-103 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text: "10"
          # Datum en wekker, klein, waar op een horloge het merk staat
          - label:
              id: lbl_v_datum
              align: CENTER
              y: '${(-74 * (k | float)) | int}'
              text_font: f_maan_klein
              text_letter_space: 2
              text: ""
          - label:
              id: lbl_v_wekker
              align: CENTER
              y: '${(-48 * (k | float)) | int}'
              text_font: f_maan_klein
              text: ""
          # Onder het midden: weer en buitentemperatuur, huisje en binnentemperatuur
          - obj:
              id: vierkant_weer
              align: CENTER
              y: '${(108 * (k | float)) | int}'
              width: SIZE_CONTENT
              height: SIZE_CONTENT
              styles: leeg
              layout:
                type: FLEX
                flex_flow: ROW
                flex_align_cross: CENTER
                flex_align_track: CENTER
                pad_column: '${(8 * (k | float)) | int}'
              widgets:
                - label:
                    id: lbl_v_weer
                    text_font: f_weer
                    text: "\U000F0590"
                - label:
                    id: lbl_v_buiten
                    text_font: f_wijzer_klein
                    text: "--"
                - obj:
                    width: '${(16 * (k | float)) | int}'
                    height: 1
                    styles: leeg
                - label:
                    id: lbl_v_huis
                    text_font: f_weer
                    text: "\U000F02DC"
                - label:
                    id: lbl_v_binnen
                    text_font: f_wijzer_klein
                    text: "--"
          # Wijzers: eerst de zachte schaduwen (licht van linksboven), dan het staal
          - image:
              id: wijzer_vs_uur
              src: img_wijzer_uur_schaduw
              align: CENTER
              x: '${(5 * (k | float)) | int}'
              y: '${(-47 * (k | float)) | int}'
              pivot_x: '${(20 * (k | float)) | int}'
              pivot_y: '${(146 * (k | float)) | int}'
              antialias: true
          - image:
              id: wijzer_vs_minuut
              src: img_wijzer_minuut_schaduw
              align: CENTER
              x: '${(6 * (k | float)) | int}'
              y: '${(-84 * (k | float)) | int}'
              pivot_x: '${(18 * (k | float)) | int}'
              pivot_y: '${(226 * (k | float)) | int}'
              antialias: true
          - image:
              id: wijzer_v_uur
              src: img_wijzer_uur
              align: CENTER
              x: '${(0 * (k | float)) | int}'
              y: '${(-55 * (k | float)) | int}'
              pivot_x: '${(8 * (k | float)) | int}'
              pivot_y: '${(134 * (k | float)) | int}'
              antialias: true
          - image:
              id: wijzer_v_minuut
              src: img_wijzer_minuut
              align: CENTER
              x: '${(0 * (k | float)) | int}'
              y: '${(-93 * (k | float)) | int}'
              pivot_x: '${(6 * (k | float)) | int}'
              pivot_y: '${(214 * (k | float)) | int}'
              antialias: true
          # Bol asje (met schaduw in het beeld)
          - image:
              id: vierkant_as
              src: img_as
              align: CENTER
              x: '${(2 * (k | float)) | int}'
              y: '${(2 * (k | float)) | int}'
