# =============================================================================
#  Klokontwerp "Vierkant": een analoge klok over het hele vierkante scherm, met
#  dunne cijfers 12, 2, 4, 8 en 10, streepjes voor de andere uren, een
#  minutenrand langs de vierkante rand en slanke wijzers, alles met een
#  slagschaduw (licht van linksboven). Onder het midden het weer met de
#  buitentemperatuur en een huisje met de binnentemperatuur. De kleur van de
#  plaat kies je in HA ("Wijzerplaat", script plaat_toepassen in kern.yaml).
#  Maten schalen met k (480x480 = 1); x0 schuift de plaat opzij (7": midden).
#  Streepjes en hun schaduw tekent "vierkant_maken" bij het opstarten.
# =============================================================================
obj:
  id: ontwerp_vierkant
  # Iets groter dan het scherm: de dagelijkse verschuiving (tegen inbranden)
  # laat dan geen zwarte rand zien. Eén egale kleur: een verloop geeft banden.
  x: '${x0 - (12 * (k | float)) | int}'
  y: '${(-12 * (k | float)) | int}'
  width: '${(504 * (k | float)) | int}'
  height: '${(504 * (k | float)) | int}'
  hidden: true
  border_width: 0
  radius: 0
  pad_all: 0
  bg_opa: COVER
  bg_color: 0x1D3068
  scrollable: false
  widgets:
    # De eigenlijke wijzerplaat, 480x480 in het midden
    - obj:
        align: CENTER
        width: '${(480 * (k | float)) | int}'
        height: '${(480 * (k | float)) | int}'
        styles: leeg
        scrollable: false
        widgets:
          # Schaduwen (cijfers hier, streepjes via vierkant_maken): licht van linksboven
          - obj:
              id: vierkant_schaduwen
              width: 100%
              height: 100%
              styles: leeg
              widgets:
                - label:
                    align: CENTER
                    x: '${(2 * (k | float)) | int}'
                    y: '${(-175 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text_color: 0x000000
                    text: "12"
                - label:
                    align: CENTER
                    x: '${(180 * (k | float)) | int}'
                    y: '${(-100 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text_color: 0x000000
                    text: "2"
                - label:
                    align: CENTER
                    x: '${(180 * (k | float)) | int}'
                    y: '${(106 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text_color: 0x000000
                    text: "4"
                - label:
                    align: CENTER
                    x: '${(-176 * (k | float)) | int}'
                    y: '${(106 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text_color: 0x000000
                    text: "8"
                - label:
                    align: CENTER
                    x: '${(-176 * (k | float)) | int}'
                    y: '${(-100 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text_color: 0x000000
                    text: "10"
          # Cijfers, en de minuutrand en uurstreepjes (vierkant_maken)
          - obj:
              id: vierkant_merken
              width: 100%
              height: 100%
              styles: leeg
              widgets:
                - label:
                    align: CENTER
                    x: '${(0 * (k | float)) | int}'
                    y: '${(-178 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text: "12"
                - label:
                    align: CENTER
                    x: '${(178 * (k | float)) | int}'
                    y: '${(-103 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text: "2"
                - label:
                    align: CENTER
                    x: '${(178 * (k | float)) | int}'
                    y: '${(103 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text: "4"
                - label:
                    align: CENTER
                    x: '${(-178 * (k | float)) | int}'
                    y: '${(103 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text: "8"
                - label:
                    align: CENTER
                    x: '${(-178 * (k | float)) | int}'
                    y: '${(-103 * (k | float)) | int}'
                    text_font: f_wijzerplaat
                    text: "10"
          # Datum en wekker, klein, waar op een horloge het merk staat
          - label:
              id: lbl_v_datum
              align: CENTER
              y: '${(-74 * (k | float)) | int}'
              text_font: f_maan_klein
              text_letter_space: 2
              text: ""
          - label:
              id: lbl_v_wekker
              align: CENTER
              y: '${(-48 * (k | float)) | int}'
              text_font: f_maan_klein
              text: ""
          # Onder het midden: weer en buitentemperatuur, huisje en binnentemperatuur
          - obj:
              id: vierkant_weer
              align: CENTER
              y: '${(108 * (k | float)) | int}'
              width: SIZE_CONTENT
              height: SIZE_CONTENT
              styles: leeg
              layout:
                type: FLEX
                flex_flow: ROW
                flex_align_cross: CENTER
                flex_align_track: CENTER
                pad_column: '${(8 * (k | float)) | int}'
              widgets:
                - label:
                    id: lbl_v_weer
                    text_font: f_weer
                    text: "\U000F0590"
                - label:
                    id: lbl_v_buiten
                    text_font: f_wijzer_klein
                    text: "--"
                - obj:
                    width: '${(16 * (k | float)) | int}'
                    height: 1
                    styles: leeg
                - label:
                    id: lbl_v_huis
                    text_font: f_weer
                    text: "\U000F02DC"
                - label:
                    id: lbl_v_binnen
                    text_font: f_wijzer_klein
                    text: "--"
          # Slagschaduw van de wijzers: zelfde wijzers, zwart, iets verschoven en breder
          - meter:
              id: vierkant_wijzers_schaduw
              align: CENTER
              x: '${(4 * (k | float)) | int}'
              y: '${(6 * (k | float)) | int}'
              width: '${(480 * (k | float)) | int}'
              height: '${(480 * (k | float)) | int}'
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scales:
                - range_from: 0
                  range_to: 60
                  angle_range: 360
                  rotation: 270
                  ticks:
                    count: 61
                    width: 0
                    length: 0
                    color: 0x000000
                  indicators:
                    - line:
                        id: wijzer_vs_minuut
                        width: '${(7 * (k | float)) | int}'
                        color: 0x000000
                        length: '${(205 * (k | float)) | int}'
                - range_from: 0
                  range_to: 720
                  angle_range: 360
                  rotation: 270
                  indicators:
                    - line:
                        id: wijzer_vs_uur
                        width: '${(10 * (k | float)) | int}'
                        color: 0x000000
                        length: '${(132 * (k | float)) | int}'
          # Uur- en minutenwijzer over de hele plaat
          - meter:
              id: vierkant_wijzers
              align: CENTER
              width: '${(480 * (k | float)) | int}'
              height: '${(480 * (k | float)) | int}'
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scales:
                - range_from: 0
                  range_to: 60
                  angle_range: 360
                  rotation: 270
                  ticks:
                    count: 61
                    width: 0
                    length: 0
                    color: 0x000000
                  indicators:
                    - line:
                        id: wijzer_v_minuut
                        width: '${(4 * (k | float)) | int}'
                        color: 0xEDE9DD
                        length: '${(205 * (k | float)) | int}'
                - range_from: 0
                  range_to: 720
                  angle_range: 360
                  rotation: 270
                  indicators:
                    - line:
                        id: wijzer_v_uur
                        width: '${(7 * (k | float)) | int}'
                        color: 0xEDE9DD
                        length: '${(132 * (k | float)) | int}'
          # Asje in het midden, met schaduw
          - obj:
              id: vierkant_as
              align: CENTER
              width: '${(14 * (k | float)) | int}'
              height: '${(14 * (k | float)) | int}'
              radius: '${(7 * (k | float)) | int}'
              border_width: 0
              bg_opa: COVER
              shadow_color: 0x000000
              shadow_width: '${(6 * (k | float)) | int}'
              shadow_offset_x: '${(2 * (k | float)) | int}'
              shadow_offset_y: '${(3 * (k | float)) | int}'
              shadow_opa: 50%
