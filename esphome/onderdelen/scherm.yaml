                                    arc_opa: TRANSP
                                  knob:
                                    bg_opa: TRANSP
                              - obj:
                                  id: zon_bol
                                  width: 64
                                  height: 64
                                  radius: 32
                                  border_width: 0
                                  bg_opa: COVER
                                  bg_color: 0xFFD36B
                                  shadow_color: 0xFFB347
                                  shadow_width: 60
                                  shadow_spread: 6
                                  shadow_opa: 60%
                              - label:
                                  id: lbl_z_tijd
                                  x: 48
                                  y: 30
                                  text_font: f_klok_mid
                                  styles: klok_tekst
                                  text: "--:--"
                              - label:
                                  id: lbl_z_datum
                                  x: 54
                                  y: 190
                                  text_font: f_midden
                                  styles: klok_sub
                                  text: ""
                              - label:
                                  id: lbl_z_wekker
                                  align: TOP_RIGHT
                                  x: -60
                                  y: 48
                                  text_font: f_midden
                                  styles: klok_accent
                                  text: ""

                        # ---- 6. Zwevend: dikke ronde cijfers in de klokkleur
                        - obj:
                            id: ontwerp_zwevend
                            width: 1024
                            height: 600
                            styles: leeg
                            hidden: true
                            widgets:
