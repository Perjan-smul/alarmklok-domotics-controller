# =============================================================================
#  Touch-interface (LVGL) voor 1024x600, liggend
#
#  Navigatie (zoals de iPhone-slaapmodus / StandBy):
#
#     swipe links/rechts  ->  Klok | Verlichting | Klimaat | Muziek | Scènes | Wekker
#     swipe omlaag/omhoog op de klok  ->  Digitaal / Analoog / Gestapeld / Info
#
#  Na 30 s zonder aanraking gaat het scherm terug naar de klok.
# =============================================================================

substitutions:
  # Schaal voor de gedeelde detailpagina (detail-pagina.yaml, basis 480x480)
  k: "1.25"

font:
  # Grote klokcijfers
  - file: "gfonts://Roboto Condensed@700"
    id: f_klok
    size: 230
    glyphs: "0123456789:-"
  - file: "gfonts://Roboto Condensed@300"
    id: f_klok_mid
    size: 140
    glyphs: "0123456789:.-°"
  - file: "gfonts://Roboto@500"
    id: f_groot
    size: 56
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto"
    id: f_midden
    size: 32
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto"
    id: f_klein
    size: 24
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  # Material Design Icons. Alleen deze iconen zitten in het lettertype;
  # wil je een ander icoon op een tegel, voeg de code dan hier toe.
  - file: &mdi
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: f_icoon
    size: 64
    glyphs:
      - "\U000F0335"  # lightbulb
      - "\U000F06E8"  # lightbulb-on
      - "\U000F1253"  # lightbulb-group
      - "\U000F0769"  # ceiling-light
      - "\U000F08DD"  # floor-lamp
      - "\U000F095F"  # desk-lamp
      - "\U000F06B5"  # lamp
      - "\U000F00AC"  # blinds
      - "\U000F111C"  # window-shutter
      - "\U000F1A6B"  # roller-shade
      - "\U000F1846"  # curtains
      - "\U000F075A"  # music
      - "\U000F0439"  # radio
      - "\U000F043B"  # radio-tower
      - "\U000F04C3"  # speaker
      - "\U000F0502"  # television
      - "\U000F0FCE"  # movie-open
      - "\U000F0210"  # fan
      - "\U000F0438"  # radiator
      - "\U000F0393"  # thermostat
      - "\U000F050F"  # thermometer
      - "\U000F0904"  # power-sleep
      - "\U000F0594"  # weather-night
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F059C"  # weather-sunset-up
      - "\U000F02DC"  # home
      - "\U000F04B9"  # sofa
      - "\U000F02E3"  # bed
      - "\U000F0A70"  # silverware-fork-knife
      - "\U000F140B"  # lightning-bolt
      - "\U000F0020"  # alarm
      - "\U000F0023"  # alarm-off
      - "\U000F068E"  # alarm-snooze
      - "\U000F0493"  # cog
      - "\U000F040A"  # play
      - "\U000F03E4"  # pause
      - "\U000F04AE"  # skip-previous
      - "\U000F04AD"  # skip-next
      - "\U000F057E"  # volume-high
      - "\U000F0415"  # plus
      - "\U000F0374"  # minus
      - "\U000F005D"  # arrow-up
      - "\U000F0045"  # arrow-down
      - "\U000F04DB"  # stop
      - "\U000F009A"  # bell (meldingen)
      - "\U000F02FC"  # information
      - "\U000F0026"  # alert
      - "\U000F081C"  # door-open
      - "\U000F072A"  # washing-machine
      - "\U000F0083"  # battery-alert (melding)
      - "\U000F036C"  # microphone (spraakassistent)
      - "\U000F036D"  # microphone-off
      - "\U000F01D8"  # dots-horizontal
      - "\U000F004D"  # arrow-left (detailpagina)
  # Paginastippen
  - file: *mdi
    id: f_stip
    size: 18
    glyphs:
      - "\U000F0765"  # circle
      - "\U000F0766"  # circle-outline
      - "\U000F036D"  # microphone-off (gedempt)

  # Rond en dik voor het klokontwerp Zwevend
  - file: "gfonts://Nunito@900"
    id: f_zwevend
    size: 330
    glyphs: "0123456789-"
  # Dun en rustig voor het maanscherm
  - file: "gfonts://Outfit@200"
    id: f_maan_tijd
    size: 160
    glyphs: "0123456789:-"
  - file: "gfonts://Outfit@300"
    id: f_maan_klein
    size: 30
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  # Dunne cijfers voor de vierkante wijzerplaat
  - file: "gfonts://Outfit@300"
    id: f_wijzerplaat
    size: '${(46 * (k | float)) | int}'
    glyphs: "0123468"
  # Kleine cijfers (temperaturen) en weericonen op de vierkante wijzerplaat
  - file: "gfonts://Outfit@300"
    id: f_wijzer_klein
    size: '${(26 * (k | float)) | int}'
    glyphs: "0123456789-.°"
  - file: *mdi
    id: f_weer
    size: '${(30 * (k | float)) | int}'
    glyphs:
      - "\U000F0599"  # weather-sunny
      - "\U000F0594"  # weather-night
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0590"  # weather-cloudy
      - "\U000F0597"  # weather-rainy
      - "\U000F0596"  # weather-pouring
      - "\U000F0598"  # weather-snowy
      - "\U000F067F"  # weather-snowy-rainy
      - "\U000F0592"  # weather-hail
      - "\U000F0591"  # weather-fog
      - "\U000F0593"  # weather-lightning
      - "\U000F067E"  # weather-lightning-rainy
      - "\U000F059D"  # weather-windy
      - "\U000F059E"  # weather-windy-variant
      - "\U000F0026"  # alert
      - "\U000F02DC"  # home (binnen)
  # Groot icoon op de detailpagina (alleen de tegeliconen)
  - file: *mdi
    id: f_icoon_groot
    size: 140
    glyphs: &tegel_iconen
      - "\U000F0335"  # lightbulb
      - "\U000F06E8"  # lightbulb-on
      - "\U000F1253"  # lightbulb-group
      - "\U000F0769"  # ceiling-light
      - "\U000F08DD"  # floor-lamp
      - "\U000F095F"  # desk-lamp
      - "\U000F06B5"  # lamp
      - "\U000F00AC"  # blinds
      - "\U000F111C"  # window-shutter
      - "\U000F1A6B"  # roller-shade
      - "\U000F1846"  # curtains
      - "\U000F075A"  # music
      - "\U000F0439"  # radio
      - "\U000F043B"  # radio-tower
      - "\U000F04C3"  # speaker
      - "\U000F0502"  # television
      - "\U000F0FCE"  # movie-open
      - "\U000F0210"  # fan
      - "\U000F0438"  # radiator
      - "\U000F0393"  # thermostat
      - "\U000F0904"  # power-sleep
      - "\U000F0594"  # weather-night
      - "\U000F059C"  # weather-sunset-up
      - "\U000F02DC"  # home
      - "\U000F04B9"  # sofa
      - "\U000F02E3"  # bed
      - "\U000F0A70"  # silverware-fork-knife
      - "\U000F140B"  # lightning-bolt
      - "\U000F0140"  # chevron-down (keuzelijsten)
  # Batterij-iconen op de rolluikkaart (alarmklok::batterij_icoon)
  - file: *mdi
    id: f_batterij
    size: 32
    glyphs: ["\U000F0083", "\U000F007C", "\U000F007F", "\U000F0079"]

  # Kleiner icoon (o.a. het pijltje van de keuzelijsten)
  - file: *mdi
    id: f_icoon_klein
    size: 36
    glyphs: *tegel_iconen
# Wijzers en asje van het klokontwerp "Vierkant" (tools/wijzerplaat.py)
image:
  - platform: file
    file: ../afbeeldingen/wijzer_uur.png
    id: img_wijzer_uur
    type: RGB565
    transparency: alpha_channel
    resize: '${(16 * (k | float)) | int}x${(158 * (k | float)) | int}'
  - platform: file
    file: ../afbeeldingen/wijzer_uur_schaduw.png
    id: img_wijzer_uur_schaduw
    type: RGB565
    transparency: alpha_channel
    resize: '${(40 * (k | float)) | int}x${(182 * (k | float)) | int}'
  - platform: file
    file: ../afbeeldingen/wijzer_minuut.png
    id: img_wijzer_minuut
    type: RGB565
    transparency: alpha_channel
    resize: '${(12 * (k | float)) | int}x${(242 * (k | float)) | int}'
  - platform: file
    file: ../afbeeldingen/wijzer_minuut_schaduw.png
    id: img_wijzer_minuut_schaduw
    type: RGB565
    transparency: alpha_channel
    resize: '${(36 * (k | float)) | int}x${(266 * (k | float)) | int}'
  - platform: file
    file: ../afbeeldingen/as.png
    id: img_as
    type: RGB565
    transparency: alpha_channel
    resize: '${(32 * (k | float)) | int}x${(32 * (k | float)) | int}'

lvgl:
  displays: scherm
  touchscreens: touch
  default_font: f_klein
  bottom_layer:
    bg_color: 0x000000
  buffer_size: 100%
  on_idle:
    timeout: 30s
    then:
      - if:
          condition:
            lambda: return !id(gaat_af) && !id(overlay_zichtbaar);
          then:
            - script.execute: naar_klokscherm

  theme:
    label:
      text_color: 0xE8EAED
    button:
      bg_color: 0x2B3340
      text_color: 0xE8EAED
      radius: 18
      border_width: 0
      shadow_width: 0
      # Tegels die "aan" zijn en de gekozen wekker (1/2/3) worden oranje
      checked:
        bg_color: 0xF5A623
        text_color: 0x16181D
    slider:
      bg_color: 0x46505F
      indicator:
        bg_color: 0xF5A623
      knob:
        bg_color: 0xFFFFFF
    switch:
      bg_color: 0x46505F
      indicator:
        checked:
          bg_color: 0xF5A623
    dropdown:
      bg_color: 0x2B3340
      text_color: 0xE8EAED
      border_width: 0
      radius: 12
    roller:
      bg_color: 0x232A35
      text_color: 0x6C727C
      border_width: 0
      selected:
        bg_color: 0x2B3340
        text_color: 0xFFFFFF

  style_definitions:
    - id: pagina_stijl
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      radius: 0
    - id: tegel_stijl
      bg_color: 0x2B3340
      border_width: 0
      text_color: 0xE8EAED
      radius: 22
      pad_all: 18
    - id: kaart
      bg_color: 0x232A35
      bg_opa: COVER
      border_width: 0
      radius: 22
      pad_all: 20
    - id: leeg
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      radius: 0
    - id: titel
      text_font: f_midden
      text_color: 0xB0B6C0
    # Kleuren van de klokken; 's nachts worden deze rood gemaakt
    - id: klok_tekst
      text_color: 0xFFFFFF
    - id: klok_sub
      text_color: 0xB0B6C0
    - id: klok_accent
      text_color: 0xF5A623

  # ---- Altijd zichtbaar: paginastippen + onzichtbare "wek-laag" --------------
  top_layer:
    widgets:
      - label:
          id: pagina_indicator
          align: BOTTOM_MID
          y: -10
          text_font: f_stip
          text_color: 0x6C727C
          text_letter_space: 10
          text: ""
      # Melding uit Home Assistant: tik ergens om te sluiten
      - obj:
          id: melding_vlak
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 70%
          border_width: 0
          radius: 0
          hidden: true
          clickable: true
          on_click:
            - script.execute: melding_sluiten
          widgets:
            - obj:
                align: CENTER
                width: 780
                height: 380
                bg_color: 0x2B3340
                border_color: 0xF5A623
                border_width: 3
                radius: 22
                pad_all: 30
                clickable: false
                scrollable: false
                widgets:
                  - label: { id: melding_icoon, text: "", text_font: f_icoon, text_color: 0xF5A623 }
                  - label: { id: melding_titel, x: 90, y: 6, width: 620, long_mode: DOT, text_font: f_groot, text: "" }
                  - label: { id: melding_tekst, y: 100, width: 100%, long_mode: WRAP, text_font: f_midden, text: "" }
                  - label: { align: BOTTOM_MID, text: "Tik om te sluiten", text_color: 0x6C727C }
      # Spraakassistent: wat hij hoort en antwoordt (spraak.yaml)
      - obj:
          id: spraak_vlak
          align: BOTTOM_MID
          y: -40
          width: 900
          height: SIZE_CONTENT
          bg_color: 0x2B3340
          border_color: 0xF5A623
          border_width: 2
          radius: 22
          pad_all: 14
          hidden: true
          scrollable: false
          widgets:
            - label: { id: spraak_icoon, align: LEFT_MID, text: "", text_font: f_icoon, text_color: 0xF5A623 }
            - label: { id: spraak_tekst, align: LEFT_MID, x: 84, width: 780, long_mode: WRAP, text_font: f_midden, text: "" }
      # Microfoon gedempt
      - label:
          id: spraak_gedempt
          align: BOTTOM_RIGHT
          x: -14
          y: -8
          text_font: f_stip
          text_color: 0x6C727C
          text: "\U000F036D"
          hidden: true
      # Nachtstand: rood filter over alles (vermenigvuldigen), zoals StandBy
      - obj:
          id: nacht_filter
          x: 0
          y: 0
          width: 1024
          height: 600
          border_width: 0
          radius: 0
          bg_color: 0xB0281A
          bg_opa: COVER
          blend_mode: MULTIPLY
          clickable: false
          hidden: true
      # Vangt in de nachtstand de eerste tik op (alleen scherm wekken)
      - obj:
          id: wek_laag
          x: 0
          y: 0
          width: 1024
          height: 600
          styles: leeg
          hidden: true
          clickable: true

  pages:
    - id: pagina_hoofd
      styles: pagina_stijl
      widgets:
        - tileview:
            id: tv_hoofd
            x: 0
            y: 0
            width: 1024
            height: 600
            styles: pagina_stijl
            scrollbar_mode: "OFF"
            on_value:
              - script.execute: pagina_indicator_bijwerken
            tiles:
              # ===============================================================
              #  Klok (swipe omlaag/omhoog voor een ander ontwerp)
              # ===============================================================
              - id: vak_klok
                row: 0
                column: 0
                dir: HOR
                widgets:
                  - obj:
                      id: klok_vlak
                      x: 0
                      y: 0
                      width: 1024
                      height: 600
                      styles: leeg
                      on_swipe_down:
                        - select.next:
                            id: klokontwerp
                            cycle: true
                      on_swipe_up:
                        - select.previous:
                            id: klokontwerp
                            cycle: true
                      # Lang drukken: volgende klokkleur (zoals StandBy)
                      on_long_press:
                        - select.next:
                            id: klokkleur
                            cycle: true
                      widgets:
                        # ---- 1. Digitaal ------------------------------------
                        - obj:
                            id: ontwerp_digitaal
                            width: 1024
                            height: 600
                            styles: leeg
                            widgets:
                              - label:
                                  id: lbl_datum
                                  align: TOP_LEFT
                                  x: 36
                                  y: 28
                                  text_font: f_midden
                                  styles: klok_sub
                                  text: ""
                              - label:
                                  id: lbl_verbinding
                                  align: TOP_MID
                                  y: 34
                                  text_font: f_klein
                                  text_color: 0xE05050
                                  text: ""
                              - label:
                                  id: lbl_temperatuur
                                  align: TOP_RIGHT
                                  x: -60
                                  y: 28
                                  text_font: f_midden
                                  styles: klok_sub
                                  text: ""
                              - label:
                                  id: lbl_tijd
                                  align: CENTER
                                  y: -10
                                  text_font: f_klok
                                  styles: klok_tekst
                                  text: "--:--"
                              - label:
                                  id: lbl_wekker_info
                                  align: BOTTOM_MID
                                  y: -60
                                  text_font: f_midden
                                  styles: klok_accent
                                  text: ""

                        # ---- 2. Analoog -------------------------------------
                        - obj:
                            id: ontwerp_analoog
                            width: 1024
                            height: 600
                            styles: leeg
                            hidden: true
                            widgets:
                              - meter:
                                  id: analoge_klok
                                  align: LEFT_MID
                                  x: 50
                                  width: 520
                                  height: 520
                                  bg_color: 0x0E1014
                                  border_width: 0
                                  text_color: 0xE8EAED
                                  text_font: f_midden
                                  scales:
                                    # Minuutstreepjes + minuten- en secondewijzer
                                    - range_from: 0
                                      range_to: 60
                                      angle_range: 360
                                      rotation: 270
                                      ticks:
                                        count: 61
                                        width: 2
                                        length: 12
                                        color: 0x4A4F58
                                      indicators:
                                        - line:
                                            id: wijzer_minuut
                                            width: 8
                                            color: 0xFFFFFF
                                            length: 220
                                        - line:
                                            id: wijzer_seconde
                                            width: 3
                                            color: 0xF5A623
                                            length: 240
                                    # Uurcijfers
                                    - range_from: 1
                                      range_to: 12
                                      angle_range: 330
                                      rotation: 300
                                      ticks:
                                        count: 12
                                        width: 1
                                        length: 1
                                        color: 0x000000
                                        major:
                                          stride: 1
                                          width: 5
                                          length: 22
                                          color: 0xE8EAED
                                          label_gap: 24
                                    # Uurwijzer (0..720 minuten = 12 uur)
                                    - range_from: 0
                                      range_to: 720
                                      angle_range: 360
                                      rotation: 270
                                      indicators:
                                        - line:
                                            id: wijzer_uur
                                            width: 12
                                            color: 0xFFFFFF
                                            length: 150
                              - obj:
                                  x: 620
                                  y: 110
                                  width: 380
                                  height: 400
                                  styles: leeg
                                  layout:
                                    type: FLEX
                                    flex_flow: COLUMN
                                    flex_align_main: CENTER
                                    pad_row: 14
                                  widgets:
                                    - label:
                                        id: lbl_a_tijd
                                        text_font: f_groot
                                        styles: klok_tekst
                                        text: ""
                                    - label:
                                        id: lbl_a_datum
                                        text_font: f_midden
                                        styles: klok_sub
                                        text: ""
                                    - label:
                                        id: lbl_a_temp
                                        text_font: f_groot
                                        styles: klok_sub
                                        text: ""
                                    - label:
                                        id: lbl_a_wekker
                                        text_font: f_klein
                                        styles: klok_accent
                                        text: ""

                        # ---- 3. Gestapeld -----------------------------------
                        - obj:
                            id: ontwerp_gestapeld
                            width: 1024
                            height: 600
                            styles: leeg
                            hidden: true
                            widgets:
                              - label:
                                  id: lbl_s_uur
                                  x: 70
                                  y: 0
                                  text_font: f_klok
                                  styles: klok_accent
                                  text: "--"
                              - label:
                                  id: lbl_s_min
                                  x: 70
                                  y: 290
                                  text_font: f_klok
                                  styles: klok_tekst
                                  text: "--"
                              - label:
                                  id: lbl_s_datum
                                  x: 520
                                  y: 210
                                  width: 460
                                  text_font: f_groot
                                  styles: klok_sub
                                  long_mode: WRAP
                                  text: ""
                              - label:
                                  id: lbl_s_wekker
                                  x: 520
                                  y: 370
                                  text_font: f_midden
                                  styles: klok_accent
                                  text: ""

                        # ---- 4. Info ----------------------------------------
                        - obj:
                            id: ontwerp_info
                            width: 1024
                            height: 600
                            styles: leeg
                            hidden: true
                            widgets:
                              - label:
                                  id: lbl_i_tijd
                                  x: 50
                                  y: 30
                                  text_font: f_klok_mid
                                  styles: klok_tekst
                                  text: "--:--"
                              - label:
                                  id: lbl_i_datum
                                  x: 56
                                  y: 200
                                  text_font: f_midden
                                  styles: klok_sub
                                  text: ""
                              - obj:
                                  x: 40
                                  y: 300
                                  width: 940
                                  height: 230
                                  styles: leeg
                                  layout:
                                    type: GRID
                                    grid_rows: [FR(1)]
                                    grid_columns: [FR(1), FR(1), FR(1)]
                                    pad_column: 20
                                  widgets:
                                    - obj:
                                        grid_cell_row_pos: 0
                                        grid_cell_column_pos: 0
                                        grid_cell_x_align: STRETCH
                                        grid_cell_y_align: STRETCH
                                        styles: kaart
                                        widgets:
                                          - label: { text: "\U000F0595", text_font: f_icoon, styles: klok_sub }
                                          - label: { text: "Buiten", y: 80, styles: klok_sub }
                                          - label: { id: lbl_i_temp, text: "--", y: 115, text_font: f_groot, styles: klok_tekst }
                                    - obj:
                                        grid_cell_row_pos: 0
                                        grid_cell_column_pos: 1
                                        grid_cell_x_align: STRETCH
                                        grid_cell_y_align: STRETCH
                                        styles: kaart
                                        widgets:
                                          - label: { text: "\U000F0020", text_font: f_icoon, styles: klok_accent }
                                          - label: { text: "Wekker", y: 80, styles: klok_sub }
                                          - label: { id: lbl_i_wekker, text: "", y: 118, width: 260, long_mode: WRAP, text_font: f_klein, styles: klok_tekst }
                                    - obj:
                                        grid_cell_row_pos: 0
                                        grid_cell_column_pos: 2
                                        grid_cell_x_align: STRETCH
                                        grid_cell_y_align: STRETCH
                                        styles: kaart
                                        widgets:
                                          - label: { text: "\U000F059C", text_font: f_icoon, styles: klok_sub }
                                          - label: { text: "Wake-up light", y: 80, styles: klok_sub }
                                          - label: { id: lbl_i_wakeup, text: "", y: 118, text_font: f_midden, styles: klok_tekst }

                        # ---- 5. Zon: zon of maan over een boog, lucht kleurt mee
                        - obj:
                            id: ontwerp_zon
                            width: 1024
                            height: 600
                            styles: leeg
                            hidden: true
                            widgets:
                              - obj:
                                  id: zon_lucht
                                  width: 100%
                                  height: 100%
                                  border_width: 0
                                  radius: 0
                                  bg_opa: COVER
                                  bg_color: 0x0B1230
                                  bg_grad_color: 0x2A2550
                                  bg_grad_dir: VER
                              - obj:
                                  y: 520
                                  width: 100%
                                  height: 2
                                  border_width: 0
                                  radius: 0
                                  bg_color: 0xFFFFFF
                                  bg_opa: 25%
                              - arc:
                                  id: zon_boog
                                  x: 242
                                  y: 250
                                  width: 540
                                  height: 540
                                  rotation: 180
                                  start_angle: 0
                                  end_angle: 180
                                  value: 0
                                  adjustable: false
                                  clickable: false
                                  arc_color: 0xFFFFFF
