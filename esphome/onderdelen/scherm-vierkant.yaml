                                  y: '${(-6 * (k | float)) | int}'
                                  text_font: f_klok
                                  styles: klok_accent
                                  text: "--"
                              - label:
                                  id: lbl_s_min
                                  x: '${(24 * (k | float)) | int}'
                                  y: '${(164 * (k | float)) | int}'
                                  text_font: f_klok
                                  styles: klok_tekst
                                  text: "--"
                              - label:
                                  id: lbl_s_datum
