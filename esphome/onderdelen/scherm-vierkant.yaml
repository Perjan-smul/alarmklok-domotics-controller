                                  styles: klok_sub
                                  text: ""
                              - obj:
                                  x: '${(12 * (k | float)) | int}'
                                  y: '${(170 * (k | float)) | int}'
                                  width: '${(456 * (k | float)) | int}'
                                  height: '${(262 * (k | float)) | int}'
                                  styles: leeg
                                  layout:
                                    type: GRID
                                    grid_rows: [FR(1)]
                                    grid_columns: [FR(1), FR(1), FR(1)]
                                    pad_column: '${(8 * (k | float)) | int}'
                                  widgets:
                                    - obj:
                                        grid_cell_row_pos: 0
                                        grid_cell_column_pos: 0
                                        grid_cell_x_align: STRETCH
                                        grid_cell_y_align: STRETCH
                                        styles: kaart
                                        widgets:
                                          - label: { text: "\U000F0595", text_font: f_icoon, styles: klok_sub }
                                          - label: { text: "Buiten", y: '${(58 * (k | float)) | int}', styles: klok_sub }
                                          - label: { id: lbl_i_temp, text: "--", y: '${(86 * (k | float)) | int}', text_font: f_groot, styles: klok_tekst }
                                    - obj:
                                        grid_cell_row_pos: 0
                                        grid_cell_column_pos: 1
                                        grid_cell_x_align: STRETCH
                                        grid_cell_y_align: STRETCH
                                        styles: kaart
                                        widgets:
                                          - label: { text: "\U000F0020", text_font: f_icoon, styles: klok_accent }
                                          - label: { text: "Wekker", y: '${(58 * (k | float)) | int}', styles: klok_sub }
                                          - label: { id: lbl_i_wekker, text: "", y: '${(86 * (k | float)) | int}', width: 100%, long_mode: WRAP, styles: klok_tekst }
                                    - obj:
                                        grid_cell_row_pos: 0
                                        grid_cell_column_pos: 2
                                        grid_cell_x_align: STRETCH
                                        grid_cell_y_align: STRETCH
                                        styles: kaart
                                        widgets:
                                          - label: { text: "\U000F059C", text_font: f_icoon, styles: klok_sub }
                                          - label: { text: "Wake-up light", y: '${(58 * (k | float)) | int}', styles: klok_sub }
                                          - label: { id: lbl_i_wakeup, text: "", y: '${(86 * (k | float)) | int}', width: 100%, long_mode: WRAP, styles: klok_tekst }

                        # ---- 5. Zon: zon of maan over een boog, lucht kleurt mee
                        - obj:
                            id: ontwerp_zon
                            width: 100%
                            height: 100%
                            styles: leeg
                            hidden: true
                            widgets:
                              - obj:
                                  id: zon_lucht
                                  width: 100%
                                  height: 100%
                                  border_width: 0
                                  radius: 0
                                  bg_opa: COVER
                                  bg_color: 0x0B1230
                                  bg_grad_color: 0x2A2550
                                  bg_grad_dir: VER
                              - obj:
                                  y: '${(400 * (k | float)) | int}'
                                  width: 100%
                                  height: 2
                                  border_width: 0
                                  radius: 0
                                  bg_color: 0xFFFFFF
                                  bg_opa: 25%
                              - arc:
                                  id: zon_boog
                                  x: '${(60 * (k | float)) | int}'
                                  y: '${(220 * (k | float)) | int}'
                                  width: '${(360 * (k | float)) | int}'
                                  height: '${(360 * (k | float)) | int}'
                                  rotation: 180
                                  start_angle: 0
                                  end_angle: 180
                                  value: 0
                                  adjustable: false
                                  clickable: false
                                  arc_color: 0xFFFFFF
                                  arc_opa: 30%
                                  arc_width: 3
                                  indicator:
                                    arc_opa: TRANSP
                                  knob:
                                    bg_opa: TRANSP
                              - obj:
                                  id: zon_bol
                                  width: '${(44 * (k | float)) | int}'
                                  height: '${(44 * (k | float)) | int}'
                                  radius: '${(22 * (k | float)) | int}'
                                  border_width: 0
                                  bg_opa: COVER
                                  bg_color: 0xFFD36B
                                  shadow_color: 0xFFB347
                                  shadow_width: '${(40 * (k | float)) | int}'
                                  shadow_spread: '${(4 * (k | float)) | int}'
                                  shadow_opa: 60%
                              - label:
                                  id: lbl_z_tijd
                                  x: '${(24 * (k | float)) | int}'
                                  y: '${(14 * (k | float)) | int}'
                                  text_font: f_klok_mid
                                  styles: klok_tekst
                                  text: "--:--"
                              - label:
                                  id: lbl_z_datum
                                  x: '${(28 * (k | float)) | int}'
                                  y: '${(108 * (k | float)) | int}'
                                  text_font: f_midden
                                  styles: klok_sub
                                  text: ""
                              - label:
                                  id: lbl_z_wekker
                                  # Donker pilletje: leesbaar op een lichte lucht
                                  bg_color: 0x000000
                                  bg_opa: 35%
                                  radius: '${(14 * (k | float)) | int}'
                                  pad_left: '${(12 * (k | float)) | int}'
                                  pad_right: '${(12 * (k | float)) | int}'
                                  pad_top: '${(4 * (k | float)) | int}'
                                  pad_bottom: '${(4 * (k | float)) | int}'
                                  align: BOTTOM_MID
                                  x: 0
                                  y: '${(-24 * (k | float)) | int}'
                                  text_font: f_midden
                                  styles: klok_accent
                                  text: ""

                        # ---- 6. Zwevend: dikke ronde cijfers in de klokkleur
                        - obj:
                            id: ontwerp_zwevend
                            width: 100%
                            height: 100%
                            styles: leeg
                            hidden: true
                            widgets:
                              - label:
                                  id: lbl_f_uur
                                  align: CENTER
                                  x: '${(-24 * (k | float)) | int}'
                                  y: '${(-88 * (k | float)) | int}'
                                  text_font: f_zwevend
                                  text: "--"
                              - label:
                                  id: lbl_f_min
                                  align: CENTER
                                  x: '${(24 * (k | float)) | int}'
                                  y: '${(72 * (k | float)) | int}'
                                  text_font: f_zwevend
                                  text_opa: 90%
                                  text: "--"
                              - label:
                                  id: lbl_f_info
                                  align: BOTTOM_MID
                                  y: '${(-14 * (k | float)) | int}'
                                  text_font: f_midden
                                  styles: klok_sub
                                  text: ""

                        # ---- 7. Maan: de maan in de fase van vandaag (ook de nachtstand)
                        - obj:
                            id: ontwerp_maan
                            width: 100%
                            height: 100%
                            styles: leeg
                            # Zwarte nachthemel: de maan (RGB565-canvas) heeft
                            # zwart rondom en moet niet als vierkant op de
                            # achtergrondafbeelding staan
                            bg_color: 0x000000
                            bg_opa: COVER
                            hidden: true
                            widgets:
                              - obj:
                                  id: maan_sterren
                                  width: 100%
                                  height: 100%
                                  styles: leeg
                              - canvas:
                                  id: maan_canvas
                                  x: '${(125 * (k | float)) | int}'
                                  y: '${(34 * (k | float)) | int}'
                                  width: '${(230 * (k | float)) | int}'
                                  height: '${(230 * (k | float)) | int}'
                              - label:
                                  id: lbl_m_temp
                                  align: TOP_RIGHT
                                  x: '${(-12 * (k | float)) | int}'
                                  y: '${(10 * (k | float)) | int}'
                                  text_align: RIGHT
                                  text_line_space: 6
                                  text_font: f_maan_klein
                                  styles: klok_sub
                                  text: ""
                              - label:
                                  id: lbl_m_tijd
                                  align: TOP_MID
                                  y: '${(262 * (k | float)) | int}'
                                  text_font: f_maan_tijd
                                  styles: klok_tekst
                                  text: "--:--"
                              - label:
                                  id: lbl_m_wekker
                                  align: TOP_MID
                                  y: '${(392 * (k | float)) | int}'
                                  text_font: f_maan_klein
                                  styles: klok_accent
                                  text: ""

                        # ---- 8. Vierkant: analoge klok over het hele scherm
                        - !include { file: klok-vierkant.yaml, vars: { x0: 0 } }

                        # Stippen onderaan: welk klokontwerp? (links/rechts vegen)
                        - label:
                            id: lbl_ontwerp_stippen
                            align: BOTTOM_MID
                            y: '${(-8 * (k | float)) | int}'
                            text_font: f_stip
                            text_color: 0x4A4F58
                            text_letter_space: '${(8 * (k | float)) | int}'
                            text: ""

              # ===============================================================
              #  Verlichting: 6 tegels (2 x 3) en een dimschuif
              # ===============================================================
              - id: vak_verlichting
                row: 0
                column: 1
                dir: HOR
                widgets:
                  - label: { text: "Verlichting", x: '${(18 * (k | float)) | int}', y: '${(14 * (k | float)) | int}', styles: titel }
                  - obj:
                      id: raster_verlichting
                      x: 0
                      y: '${(46 * (k | float)) | int}'
                      width: '${(464 * (k | float)) | int}'
                      height: '${(428 * (k | float)) | int}'
                      styles: leeg
                      pad_all: '${(12 * (k | float)) | int}'
                      layout:
                        type: GRID
                        grid_rows: [FR(1), FR(1), FR(1), '${((64 * (k | float)) | int) ~ "px"}']
                        grid_columns: [FR(1), FR(1), FR(1)]
                        pad_row: '${(8 * (k | float)) | int}'
                        pad_column: '${(10 * (k | float)) | int}'
                      widgets:
                        - !include { file: tegel.yaml, vars: { nr: licht_1, rij: 0, kolom: 0, actie: homeassistant.toggle, schakelaar: "true", icoon_font: f_icoon_klein, sw_b: '${(44 * (k | float)) | int}', sw_h: '${(24 * (k | float)) | int}', naam_y: '${(-22 * (k | float)) | int}' } }
                        - !include { file: tegel.yaml, vars: { nr: licht_2, rij: 0, kolom: 1, actie: homeassistant.toggle, schakelaar: "true", icoon_font: f_icoon_klein, sw_b: '${(44 * (k | float)) | int}', sw_h: '${(24 * (k | float)) | int}', naam_y: '${(-22 * (k | float)) | int}' } }
                        - !include { file: tegel.yaml, vars: { nr: licht_3, rij: 0, kolom: 2, actie: homeassistant.toggle, schakelaar: "true", icoon_font: f_icoon_klein, sw_b: '${(44 * (k | float)) | int}', sw_h: '${(24 * (k | float)) | int}', naam_y: '${(-22 * (k | float)) | int}' } }
                        - !include { file: tegel.yaml, vars: { nr: licht_4, rij: 1, kolom: 0, actie: homeassistant.toggle, schakelaar: "true", icoon_font: f_icoon_klein, sw_b: '${(44 * (k | float)) | int}', sw_h: '${(24 * (k | float)) | int}', naam_y: '${(-22 * (k | float)) | int}' } }
                        - !include { file: tegel.yaml, vars: { nr: licht_5, rij: 1, kolom: 1, actie: homeassistant.toggle, schakelaar: "true", icoon_font: f_icoon_klein, sw_b: '${(44 * (k | float)) | int}', sw_h: '${(24 * (k | float)) | int}', naam_y: '${(-22 * (k | float)) | int}' } }
                        - !include { file: tegel.yaml, vars: { nr: licht_6, rij: 1, kolom: 2, actie: homeassistant.toggle, schakelaar: "true", icoon_font: f_icoon_klein, sw_b: '${(44 * (k | float)) | int}', sw_h: '${(24 * (k | float)) | int}', naam_y: '${(-22 * (k | float)) | int}' } }
                        - !include { file: tegel.yaml, vars: { nr: licht_7, rij: 2, kolom: 0, actie: homeassistant.toggle, schakelaar: "true", icoon_font: f_icoon_klein, sw_b: '${(44 * (k | float)) | int}', sw_h: '${(24 * (k | float)) | int}', naam_y: '${(-22 * (k | float)) | int}' } }
                        - !include { file: tegel.yaml, vars: { nr: licht_8, rij: 2, kolom: 1, actie: homeassistant.toggle, schakelaar: "true", icoon_font: f_icoon_klein, sw_b: '${(44 * (k | float)) | int}', sw_h: '${(24 * (k | float)) | int}', naam_y: '${(-22 * (k | float)) | int}' } }
                        - !include { file: tegel.yaml, vars: { nr: licht_9, rij: 2, kolom: 2, actie: homeassistant.toggle, schakelaar: "true", icoon_font: f_icoon_klein, sw_b: '${(44 * (k | float)) | int}', sw_h: '${(24 * (k | float)) | int}', naam_y: '${(-22 * (k | float)) | int}' } }
                        # Dimmerkaart: de hele kaart is de schuif; warm gevuld tot de helderheid
                        - obj:
                            id: dimmer_kaart
                            grid_cell_row_pos: 3
                            grid_cell_column_pos: 0
                            grid_cell_column_span: 3
                            grid_cell_x_align: STRETCH
                            grid_cell_y_align: STRETCH
                            styles: leeg
                            widgets:
                              - slider:
                                  id: sl_dimmer
                                  width: 100%
                                  height: 100%
                                  min_value: 0
                                  max_value: 255
                                  bg_color: 0x2B3340
                                  bg_opa: COVER
                                  radius: '${(13 * (k | float)) | int}'
                                  pad_all: 0
                                  indicator:
                                    bg_color: 0xE8B23C
                                    bg_grad_color: 0xF0C860
                                    bg_grad_dir: HOR
                                    radius: '${(13 * (k | float)) | int}'
                                  knob:
                                    bg_opa: TRANSP
                                    shadow_width: 0
                                    pad_all: 0
                                  on_value:
                                    - lvgl.label.update:
                                        id: lbl_dimmer
                                        text: !lambda |-
                                          if (x < 3) return std::string("Uit");
                                          return std::to_string((int) (x * 100.0f / 255.0f + 0.5f)) + "%";
                                  on_release:
                                    - if:
                                        condition:
                                          lambda: return x < 3;
                                        then:
                                          - homeassistant.action:
                                              action: light.turn_off
                                              data:
                                                entity_id: !lambda return id(cfg_dim_lamp).state;
                                        else:
                                          - homeassistant.action:
                                              action: light.turn_on
                                              data:
                                                entity_id: !lambda return id(cfg_dim_lamp).state;
                                                brightness: !lambda return std::to_string((int) x);
                              - label:
                                  align: LEFT_MID
                                  x: '${(12 * (k | float)) | int}'
                                  clickable: false
                                  text_font: f_icoon_klein
                                  text: "\U000F06E8"
                              - label:
                                  align: LEFT_MID
                                  x: '${(58 * (k | float)) | int}'
                                  clickable: false
                                  text_font: f_midden
                                  id: lbl_dimmer_naam
                                  text: ""
                              - label:
                                  id: lbl_dimmer
                                  align: RIGHT_MID
                                  x: '${(-14 * (k | float)) | int}'
                                  clickable: false
                                  text_font: f_midden
                                  text: "Uit"

              # ===============================================================
              #  Klimaat & rolluik: thermostaatkaart en rolluikkaart
              # ===============================================================
              - id: vak_klimaat
                row: 0
                column: 2
                dir: HOR
                widgets:
                  - label: { text: "Klimaat", x: '${(18 * (k | float)) | int}', y: '${(14 * (k | float)) | int}', styles: titel }
                  # ---- Airco (bv. Daikin Perfera): stand, temperatuur en standknoppen ----
                  - obj:
                      x: '${(12 * (k | float)) | int}'
                      y: '${(50 * (k | float)) | int}'
                      width: '${(440 * (k | float)) | int}'
                      height: '${(262 * (k | float)) | int}'
                      styles: kaart
                      pad_all: 0
                      scrollable: false
                      widgets:
                        - obj:
                            id: klimaat_chip
                            x: '${(12 * (k | float)) | int}'
                            y: '${(12 * (k | float)) | int}'
                            width: '${(46 * (k | float)) | int}'
                            height: '${(46 * (k | float)) | int}'
                            bg_color: 0x3E4350
                            border_width: 0
                            radius: '${(15 * (k | float)) | int}'
                            pad_all: 0
                            scrollable: false
                            widgets:
                              - label: { id: lbl_klimaat_icoon, text: "\U000F0393", text_font: f_icoon_tegel, align: CENTER, text_color: 0xA8AEBA }
                        - label: { text: "Airco", x: '${(72 * (k | float)) | int}', y: '${(14 * (k | float)) | int}', text_font: f_naam }
                        - label:
                            id: lbl_klimaat_huidig
                            x: '${(72 * (k | float)) | int}'
                            y: '${(38 * (k | float)) | int}'
                            width: '${(350 * (k | float)) | int}'
                            long_mode: DOT
                            text_font: f_klein
                            text_color: 0xE8B23C
                            text: ""
                        - label:
                            id: lbl_klimaat_doel
                            align: CENTER
                            y: '${(-6 * (k | float)) | int}'
                            text_font: f_klok_mid
                            text: "--"
                        - button:
                            align: LEFT_MID
                            x: '${(16 * (k | float)) | int}'
                            y: '${(-6 * (k | float)) | int}'
                            width: '${(64 * (k | float)) | int}'
                            height: '${(64 * (k | float)) | int}'
                            radius: '${(20 * (k | float)) | int}'
                            on_click:
                              - homeassistant.action:
                                  action: climate.set_temperature
                                  data:
                                    entity_id: !lambda return id(cfg_thermostaat).state;
                                    temperature: !lambda |-
                                      if (std::isnan(id(klimaat_doel).state))
                                        ESP_LOGW("klimaat", "Thermostaat %s geeft geen doeltemperatuur "
                                                 "(attribuut 'temperature'): klopt de entiteit?", id(cfg_thermostaat).state.c_str());
                                      char buf[8];
                                      snprintf(buf, sizeof(buf), "%.1f", id(klimaat_doel).state - 0.5f);
                                      return std::string(buf);
                            widgets:
                              - label: { text: "\U000F0374", text_font: f_icoon, align: CENTER }
                        - button:
                            align: RIGHT_MID
                            x: '${(-16 * (k | float)) | int}'
                            y: '${(-6 * (k | float)) | int}'
                            width: '${(64 * (k | float)) | int}'
                            height: '${(64 * (k | float)) | int}'
                            radius: '${(20 * (k | float)) | int}'
                            on_click:
                              - homeassistant.action:
                                  action: climate.set_temperature
                                  data:
                                    entity_id: !lambda return id(cfg_thermostaat).state;
                                    temperature: !lambda |-
                                      if (std::isnan(id(klimaat_doel).state))
                                        ESP_LOGW("klimaat", "Thermostaat %s geeft geen doeltemperatuur "
                                                 "(attribuut 'temperature'): klopt de entiteit?", id(cfg_thermostaat).state.c_str());
                                      char buf[8];
                                      snprintf(buf, sizeof(buf), "%.1f", id(klimaat_doel).state + 0.5f);
                                      return std::string(buf);
                            widgets:
                              - label: { text: "\U000F0415", text_font: f_icoon, align: CENTER }
                        # Standen: Uit, Automatisch, Koelen, Verwarmen, Drogen, Ventileren
                        - obj:
                            align: BOTTOM_MID
                            y: '${(-12 * (k | float)) | int}'
                            width: '${(416 * (k | float)) | int}'
                            height: '${(52 * (k | float)) | int}'
                            styles: leeg
                            scrollable: false
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_main: SPACE_BETWEEN
                            widgets:
                              - button:
                                  id: knop_airco_0
                                  width: '${(66 * (k | float)) | int}'
                                  height: '${(52 * (k | float)) | int}'
                                  radius: '${(16 * (k | float)) | int}'
                                  on_click:
                                    - homeassistant.action:
                                        action: climate.set_hvac_mode
                                        data:
                                          entity_id: !lambda return id(cfg_thermostaat).state;
                                          hvac_mode: "off"
                                  widgets:
                                    - label: { text: "\U000F0425", text_font: f_icoon_tegel, align: CENTER }
                              - button:
                                  id: knop_airco_1
                                  width: '${(66 * (k | float)) | int}'
                                  height: '${(52 * (k | float)) | int}'
                                  radius: '${(16 * (k | float)) | int}'
                                  on_click:
                                    - homeassistant.action:
                                        action: climate.set_hvac_mode
