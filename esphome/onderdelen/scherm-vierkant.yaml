esphome:
  on_boot:
    - priority: -110
      then:
        # Detailpagina (gedeeld met de 7"): ook de achtergrond van stijl D
        - lambda: |-
            lv_obj_set_style_bg_image_src(id(pagina_detail)->obj, id(img_achtergrond)->get_lv_image_dsc(), 0);
            lv_obj_set_style_bg_color(id(pagina_detail)->obj, lv_color_hex(0x0E1118), 0);
            lv_obj_set_style_bg_opa(id(pagina_detail)->obj, LV_OPA_COVER, 0);

script:
  # Stand van de airco (ha-bediening.yaml, klimaat_modus): de knop van die stand
  # okergeel, en het icoon linksboven op de kaart
  - id: klimaat_modus_tonen
    then:
      - lambda: |-
          const std::string stand = id(klimaat_modus).state;
          const int actief = alarmklok::airco_index(stand);
          lv_obj_t *knoppen[6] = {id(knop_airco_0), id(knop_airco_1), id(knop_airco_2),
                                  id(knop_airco_3), id(knop_airco_4), id(knop_airco_5)};
          for (int i = 0; i < 6; i++) {
            if (i == actief)
              lv_obj_add_state(knoppen[i], LV_STATE_CHECKED);
            else
              lv_obj_clear_state(knoppen[i], LV_STATE_CHECKED);
          }
          const bool aan = actief > 0;
          lv_label_set_text(id(lbl_klimaat_icoon), alarmklok::airco_icoon(stand));
          lv_obj_set_style_bg_color(id(klimaat_chip), lv_color_hex(aan ? 0xE8B23C : 0x3E4350), 0);
          lv_obj_set_style_text_color(id(lbl_klimaat_icoon), lv_color_hex(aan ? 0x1E1E22 : 0xA8AEBA), 0);

