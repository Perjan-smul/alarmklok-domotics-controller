                                  width: '${(420 * (k | float)) | int}'
                                  text_font: f_midden
                                  styles: klok_sub
                                  long_mode: WRAP
                                  text: ""
                              - label:
                                  id: lbl_s_wekker
                                  x: '${(28 * (k | float)) | int}'
                                  y: '${(398 * (k | float)) | int}'
                                  text_font: f_midden
                                  styles: klok_accent
                                  text: ""

                        # ---- 4. Info ----------------------------------------
                        - obj:
