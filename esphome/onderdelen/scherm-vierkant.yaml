# =============================================================================
#  Touch-interface (LVGL) voor vierkante schermen
#
#  Zelfde pagina's en bediening als scherm.yaml (7"), opnieuw ingedeeld voor
#  een vierkant scherm. Alle maten schalen met "k" uit het hardwarebestand:
#  k = 1.0 voor 480x480 (Waveshare ESP32-S3-Touch-LCD-4), 1.5 voor 720x720.
#
#     swipe links/rechts  ->  Klok | Verlichting | Klimaat | Muziek | Scènes | Wekker
#     swipe omlaag/omhoog op de klok  ->  Digitaal / Analoog / Gestapeld / Info
#     op de pagina Wekker: omhoog vegen voor volume, wake-up light en testen
# =============================================================================


substitutions:
  # Voor de instelbare indeling (paginas.yaml): vierkant scherm, dimmerkaart 64 px bij k = 1
  liggend: "false"
  # Klokontwerpstippen onderaan, naast elkaar (links/rechts vegen)
  ontwerp_scheiding: ""
  dimmer_basis: "64"

font:
  # Klokcijfers: Urbanist (modern, rond en smal)
  - file: "gfonts://Urbanist@700"
    id: f_klok
    size: '${(150 * (k | float)) | int}'
    glyphs: "0123456789:-"
  - file: "gfonts://Urbanist@300"
    id: f_klok_mid
    size: '${(84 * (k | float)) | int}'
    glyphs: "0123456789:.-°"
  - file: "gfonts://Inter@600"
    id: f_groot
    size: '${(40 * (k | float)) | int}'
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Inter@500"
    id: f_midden
    size: '${(24 * (k | float)) | int}'
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Inter@500"
    id: f_klein
    size: '${(18 * (k | float)) | int}'
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  # Stijl D: namen op tegels en kaarten, en paginatitels
  - file: "gfonts://Inter@600"
    id: f_naam
    size: '${(18 * (k | float)) | int}'
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Inter@600"
    id: f_titel
    size: '${(22 * (k | float)) | int}'
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  # Material Design Icons; zelfde lijst als in scherm.yaml
  - file: &mdi
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: f_icoon
    size: '${(48 * (k | float)) | int}'
    glyphs:
      - "\U000F0335"  # lightbulb
      - "\U000F06E8"  # lightbulb-on
      - "\U000F1253"  # lightbulb-group
      - "\U000F0769"  # ceiling-light
      - "\U000F08DD"  # floor-lamp
      - "\U000F095F"  # desk-lamp
      - "\U000F06B5"  # lamp
      - "\U000F00AC"  # blinds
      - "\U000F111C"  # window-shutter
      - "\U000F1A6B"  # roller-shade
      - "\U000F1846"  # curtains
      - "\U000F075A"  # music
      - "\U000F0439"  # radio
      - "\U000F043B"  # radio-tower
      - "\U000F04C3"  # speaker
      - "\U000F0502"  # television
      - "\U000F0FCE"  # movie-open
      - "\U000F0210"  # fan
      - "\U000F0438"  # radiator
      - "\U000F0393"  # thermostat
      - "\U000F050F"  # thermometer
      - "\U000F0904"  # power-sleep
      - "\U000F0594"  # weather-night
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F059C"  # weather-sunset-up
      - "\U000F02DC"  # home
      - "\U000F04B9"  # sofa
      - "\U000F02E3"  # bed
      - "\U000F0A70"  # silverware-fork-knife
      - "\U000F140B"  # lightning-bolt
      - "\U000F0020"  # alarm
      - "\U000F0023"  # alarm-off
      - "\U000F068E"  # alarm-snooze
      - "\U000F0493"  # cog
      - "\U000F040A"  # play
      - "\U000F03E4"  # pause
      - "\U000F04AE"  # skip-previous
      - "\U000F04AD"  # skip-next
      - "\U000F057E"  # volume-high
      - "\U000F0415"  # plus
      - "\U000F0374"  # minus
      - "\U000F005D"  # arrow-up
      - "\U000F0045"  # arrow-down
      - "\U000F04DB"  # stop
      - "\U000F009A"  # bell (meldingen)
      - "\U000F02FC"  # information
      - "\U000F0026"  # alert
      - "\U000F081C"  # door-open
      - "\U000F072A"  # washing-machine
      - "\U000F0083"  # battery-alert (melding)
      - "\U000F036C"  # microphone (spraakassistent)
      - "\U000F036D"  # microphone-off
      - "\U000F01D8"  # dots-horizontal
      - "\U000F004D"  # arrow-left (detailpagina)
  - file: *mdi
    id: f_stip
    size: '${(14 * (k | float)) | int}'
    glyphs:
      - "\U000F0765"  # circle
      - "\U000F0766"  # circle-outline
      - "\U000F036D"  # microphone-off (gedempt)

  # Rond en dik voor het klokontwerp Zwevend
  - file: "gfonts://Nunito@900"
    id: f_zwevend
    size: '${(190 * (k | float)) | int}'
    glyphs: "0123456789-"
  # Dun en rustig voor het maanscherm
  - file: "gfonts://Outfit@200"
    id: f_maan_tijd
    size: '${(96 * (k | float)) | int}'
    glyphs: "0123456789:-"
  - file: "gfonts://Outfit@300"
    id: f_maan_klein
    size: '${(20 * (k | float)) | int}'
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  # Dunne cijfers voor de vierkante wijzerplaat
  - file: "gfonts://Outfit@300"
    id: f_wijzerplaat
    size: '${(46 * (k | float)) | int}'
    glyphs: "0123468"
  # Kleine cijfers (temperaturen) en weericonen op de vierkante wijzerplaat
  - file: "gfonts://Outfit@300"
    id: f_wijzer_klein
    size: '${(26 * (k | float)) | int}'
    glyphs: "0123456789-.°"
  - file: *mdi
    id: f_weer
    size: '${(30 * (k | float)) | int}'
    glyphs:
      - "\U000F0599"  # weather-sunny
      - "\U000F0594"  # weather-night
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0590"  # weather-cloudy
      - "\U000F0597"  # weather-rainy
      - "\U000F0596"  # weather-pouring
      - "\U000F0598"  # weather-snowy
      - "\U000F067F"  # weather-snowy-rainy
      - "\U000F0592"  # weather-hail
      - "\U000F0591"  # weather-fog
      - "\U000F0593"  # weather-lightning
      - "\U000F067E"  # weather-lightning-rainy
      - "\U000F059D"  # weather-windy
      - "\U000F059E"  # weather-windy-variant
      - "\U000F0026"  # alert
      - "\U000F02DC"  # home (binnen)
  # Groot icoon op de detailpagina (alleen de tegeliconen)
  - file: *mdi
    id: f_icoon_groot
    size: '${(100 * (k | float)) | int}'
    glyphs: &tegel_iconen
      - "\U000F0335"  # lightbulb
      - "\U000F06E8"  # lightbulb-on
      - "\U000F1253"  # lightbulb-group
      - "\U000F0769"  # ceiling-light
      - "\U000F08DD"  # floor-lamp
      - "\U000F095F"  # desk-lamp
      - "\U000F06B5"  # lamp
      - "\U000F00AC"  # blinds
      - "\U000F111C"  # window-shutter
      - "\U000F1A6B"  # roller-shade
      - "\U000F1846"  # curtains
      - "\U000F075A"  # music
      - "\U000F0439"  # radio
      - "\U000F043B"  # radio-tower
      - "\U000F04C3"  # speaker
      - "\U000F0502"  # television
      - "\U000F0FCE"  # movie-open
      - "\U000F0210"  # fan
      - "\U000F0438"  # radiator
      - "\U000F0393"  # thermostat
      - "\U000F0904"  # power-sleep
      - "\U000F0594"  # weather-night
      - "\U000F059C"  # weather-sunset-up
      - "\U000F02DC"  # home
      - "\U000F04B9"  # sofa
      - "\U000F02E3"  # bed
      - "\U000F0A70"  # silverware-fork-knife
      - "\U000F140B"  # lightning-bolt
      - "\U000F0140"  # chevron-down (keuzelijsten)
      - "\U000F0425"  # power (airco uit)
      - "\U000F1B17"  # thermostat-auto
      - "\U000F0717"  # snowflake
      - "\U000F0238"  # fire
      - "\U000F058E"  # water-percent
      - "\U000F1847"  # curtains-closed
      - "\U000F0493"  # cog (wekker: meer)
      - "\U000F004D"  # arrow-left (terug)
  # Batterij-iconen op de rolluikkaart (alarmklok::batterij_icoon)
  - file: *mdi
    id: f_batterij
    size: '${(28 * (k | float)) | int}'
    glyphs: ["\U000F0083", "\U000F007C", "\U000F007F", "\U000F0079"]
  # Icoon in het icoonvlak van een tegel of rij (stijl D)
  - file: *mdi
    id: f_icoon_tegel
    size: '${(26 * (k | float)) | int}'
    glyphs: *tegel_iconen
  # Kleiner icoon voor de tegels op een vierkant scherm
  - file: *mdi
    id: f_icoon_klein
    size: '${(34 * (k | float)) | int}'
    glyphs: *tegel_iconen

# Wijzers en asje van het klokontwerp "Vierkant" (tools/wijzerplaat.py)
image:
  # Achtergrond van alle pagina's (stijl D, tools/achtergrond.py)
  - platform: file
    file: ../afbeeldingen/achtergrond.png
    id: img_achtergrond
    type: RGB565
    resize: '${(480 * (k | float)) | int}x${(480 * (k | float)) | int}'
  - platform: file
    file: ../afbeeldingen/wijzer_uur.png
    id: img_wijzer_uur
    type: RGB565
    transparency: alpha_channel
    resize: '${(16 * (k | float)) | int}x${(158 * (k | float)) | int}'
  - platform: file
    file: ../afbeeldingen/wijzer_uur_schaduw.png
    id: img_wijzer_uur_schaduw
    type: RGB565
    transparency: alpha_channel
    resize: '${(40 * (k | float)) | int}x${(182 * (k | float)) | int}'
  - platform: file
    file: ../afbeeldingen/wijzer_minuut.png
    id: img_wijzer_minuut
    type: RGB565
    transparency: alpha_channel
    resize: '${(12 * (k | float)) | int}x${(242 * (k | float)) | int}'
  - platform: file
    file: ../afbeeldingen/wijzer_minuut_schaduw.png
    id: img_wijzer_minuut_schaduw
    type: RGB565
    transparency: alpha_channel
    resize: '${(36 * (k | float)) | int}x${(266 * (k | float)) | int}'
  - platform: file
    file: ../afbeeldingen/as.png
    id: img_as
    type: RGB565
    transparency: alpha_channel
    resize: '${(32 * (k | float)) | int}x${(32 * (k | float)) | int}'

lvgl:
  displays: scherm
  touchscreens: touch
  default_font: f_klein
  rotation: ${draaiing}
  bottom_layer:
    bg_color: 0x000000
  buffer_size: ${lvgl_buffer}
  on_idle:
    timeout: 30s
    then:
      - if:
          condition:
            lambda: return !id(gaat_af) && !id(overlay_zichtbaar);
          then:
            - script.execute: naar_klokscherm

  # Stijl D: glaskaarten met een dunne lichte rand, afgeronde knoppen,
  # okergeel voor wat aan staat
  theme:
    label:
      text_color: 0xF0F2F6
    button:
      bg_color: 0x3E4350
      text_color: 0xF0F2F6
      radius: '${(16 * (k | float)) | int}'
      border_width: 0
      shadow_width: 0
      checked:
        bg_color: 0xE8B23C
        text_color: 0x1E1E22
    slider:
      bg_color: 0x3E4350
      indicator:
        bg_color: 0xE8B23C
      knob:
        bg_color: 0xFFFFFF
    switch:
      bg_color: 0x3E4350
      indicator:
        checked:
          bg_color: 0xE8B23C
    dropdown:
      bg_color: 0x262B36
      text_color: 0xF0F2F6
      border_width: 1
      border_color: 0x404654
      radius: '${(16 * (k | float)) | int}'
    roller:
      bg_color: 0x262B36
      text_color: 0x6C727C
      border_width: 1
      border_color: 0x404654
      radius: '${(20 * (k | float)) | int}'
      selected:
        bg_color: 0x3E4350
        text_color: 0xFFFFFF

  style_definitions:
    # Pagina's doorzichtig: de achtergrond (img_achtergrond) zit op het scherm
    - id: pagina_stijl
      bg_color: 0x0E1118
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      radius: 0
    - id: tegel_stijl
      bg_color: 0x262B36
      bg_opa: COVER
      border_width: 1
      border_color: 0x404654
      text_color: 0xF0F2F6
      radius: '${(24 * (k | float)) | int}'
      pad_all: '${(12 * (k | float)) | int}'
    - id: kaart
      bg_color: 0x262B36
      bg_opa: COVER
      border_width: 1
      border_color: 0x404654
      radius: '${(26 * (k | float)) | int}'
      pad_all: '${(14 * (k | float)) | int}'
    - id: leeg
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      radius: 0
    - id: titel
      text_font: f_titel
      text_color: 0xF0F2F6
    # Kleuren van de klokken; 's nachts worden deze rood gemaakt
    - id: klok_tekst
      text_color: 0xFFFFFF
    - id: klok_sub
      text_color: 0xB0B6C0
    - id: klok_accent
      text_color: 0xE8B23C

  # ---- Altijd zichtbaar: paginastippen + onzichtbare "wek-laag" --------------
  top_layer:
    widgets:
      # Paginastippen rechts, onder elkaar (omhoog/omlaag vegen)
      - label:
          id: pagina_indicator
          align: RIGHT_MID
          x: '${(-6 * (k | float)) | int}'
          text_font: f_stip
          text_color: 0x6C727C
          text_line_space: '${(6 * (k | float)) | int}'
          text: ""
      # Melding uit Home Assistant: tik ergens om te sluiten
      - obj:
          id: melding_vlak
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 70%
          border_width: 0
          radius: 0
          hidden: true
          clickable: true
          on_click:
            - script.execute: melding_sluiten
          widgets:
            - obj:
                align: CENTER
                width: '${(448 * (k | float)) | int}'
                height: '${(330 * (k | float)) | int}'
                bg_color: 0x2B3340
                border_color: 0xE8B23C
                border_width: '${(2 * (k | float)) | int}'
                radius: '${(18 * (k | float)) | int}'
                pad_all: '${(18 * (k | float)) | int}'
                clickable: false
                scrollable: false
                widgets:
                  - label: { id: melding_icoon, text: "", text_font: f_icoon, text_color: 0xE8B23C }
                  - label: { id: melding_titel, x: '${(64 * (k | float)) | int}', y: '${(2 * (k | float)) | int}', width: '${(340 * (k | float)) | int}', long_mode: DOT, text_font: f_groot, text: "" }
                  - label: { id: melding_tekst, y: '${(70 * (k | float)) | int}', width: 100%, long_mode: WRAP, text_font: f_midden, text: "" }
                  - label: { align: BOTTOM_MID, text: "Tik om te sluiten", text_color: 0x6C727C }
      # Spraakassistent: wat hij hoort en antwoordt (spraak.yaml)
      - obj:
          id: spraak_vlak
          align: BOTTOM_MID
          y: '${(-28 * (k | float)) | int}'
          width: '${(456 * (k | float)) | int}'
          height: SIZE_CONTENT
          bg_color: 0x2B3340
          border_color: 0xE8B23C
          border_width: '${(2 * (k | float)) | int}'
          radius: '${(18 * (k | float)) | int}'
          pad_all: '${(10 * (k | float)) | int}'
          hidden: true
          scrollable: false
          widgets:
            - label: { id: spraak_icoon, align: LEFT_MID, text: "", text_font: f_icoon, text_color: 0xE8B23C }
            - label: { id: spraak_tekst, align: LEFT_MID, x: '${(60 * (k | float)) | int}', width: '${(370 * (k | float)) | int}', long_mode: WRAP, text_font: f_midden, text: "" }
      # Microfoon gedempt
      - label:
          id: spraak_gedempt
          align: BOTTOM_RIGHT
          x: '${(-10 * (k | float)) | int}'
          y: '${(-6 * (k | float)) | int}'
          text_font: f_stip
          text_color: 0x6C727C
          text: "\U000F036D"
          hidden: true
      # Nachtstand: rood filter over alles (vermenigvuldigen), zoals StandBy
      - obj:
          id: nacht_filter
          x: 0
          y: 0
          width: 100%
          height: 100%
          border_width: 0
          radius: 0
          bg_color: 0xB0281A
          bg_opa: COVER
          blend_mode: MULTIPLY
          clickable: false
          hidden: true
      # Vangt in de nachtstand de eerste tik op (alleen scherm wekken)
      - obj:
          id: wek_laag
          x: 0
          y: 0
          width: 100%
          height: 100%
          styles: leeg
          hidden: true
          clickable: true

  pages:
    - id: pagina_hoofd
      styles: pagina_stijl
      bg_color: 0x0E1118
      bg_opa: COVER
      bg_image_src: img_achtergrond
      widgets:
        - tileview:
            id: tv_hoofd
            x: 0
            y: 0
            width: 100%
            height: 100%
            styles: pagina_stijl
            scrollbar_mode: "OFF"
            on_value:
              - script.execute: pagina_indicator_bijwerken
            tiles:
              # ===============================================================
              #  Klok (swipe omlaag/omhoog voor een ander ontwerp)
              # ===============================================================
              - id: vak_klok
                row: 0
                column: 0
                dir: HOR
                widgets:
                  - obj:
                      id: klok_vlak
                      x: 0
                      y: 0
                      width: 100%
                      height: 100%
                      styles: leeg
                      # Lang drukken: volgende klokkleur (zoals StandBy)
                      on_long_press:
                        - select.next:
                            id: klokkleur
                            cycle: true
                      widgets:
                        # ---- 1. Digitaal ------------------------------------
                        - obj:
                            id: ontwerp_digitaal
                            width: 100%
                            height: 100%
                            styles: leeg
                            widgets:
                              - label:
                                  id: lbl_datum
                                  align: TOP_LEFT
                                  x: '${(20 * (k | float)) | int}'
                                  y: '${(18 * (k | float)) | int}'
                                  text_font: f_midden
                                  styles: klok_sub
                                  text: ""
                              - label:
                                  id: lbl_temperatuur
                                  align: TOP_RIGHT
                                  x: '${(-30 * (k | float)) | int}'
                                  y: '${(18 * (k | float)) | int}'
                                  text_font: f_midden
                                  styles: klok_sub
                                  text: ""
                              - label:
                                  id: lbl_verbinding
                                  align: TOP_MID
                                  y: '${(56 * (k | float)) | int}'
                                  text_font: f_klein
                                  text_color: 0xE05050
                                  text: ""
                              - label:
                                  id: lbl_tijd
                                  align: CENTER
                                  y: '${(-6 * (k | float)) | int}'
                                  text_font: f_klok
                                  styles: klok_tekst
                                  text: "--:--"
                              - label:
                                  id: lbl_wekker_info
                                  align: BOTTOM_MID
                                  y: '${(-44 * (k | float)) | int}'
                                  text_font: f_midden
                                  styles: klok_accent
                                  text: ""

                        # ---- 2. Analoog -------------------------------------
                        - obj:
                            id: ontwerp_analoog
                            width: 100%
                            height: 100%
                            styles: leeg
                            hidden: true
                            widgets:
                              - meter:
                                  id: analoge_klok
                                  align: TOP_MID
                                  y: '${(14 * (k | float)) | int}'
                                  width: '${(290 * (k | float)) | int}'
                                  height: '${(290 * (k | float)) | int}'
                                  bg_color: 0x0E1014
                                  border_width: 0
                                  text_color: 0xE8EAED
                                  text_font: f_klein
                                  scales:
                                    # Minuutstreepjes + minuten- en secondewijzer
                                    - range_from: 0
                                      range_to: 60
                                      angle_range: 360
                                      rotation: 270
                                      ticks:
                                        count: 61
                                        width: 2
                                        length: '${(8 * (k | float)) | int}'
                                        color: 0x4A4F58
                                      indicators:
                                        - line:
                                            id: wijzer_minuut
                                            width: '${(5 * (k | float)) | int}'
                                            color: 0xFFFFFF
                                            length: '${(119 * (k | float)) | int}'
                                        - line:
                                            id: wijzer_seconde
                                            width: 2
                                            color: 0xE8B23C
                                            length: '${(131 * (k | float)) | int}'
                                    # Uurcijfers
                                    - range_from: 1
                                      range_to: 12
                                      angle_range: 330
                                      rotation: 300
                                      ticks:
                                        count: 12
                                        width: 1
                                        length: 1
                                        color: 0x000000
                                        major:
                                          stride: 1
                                          width: '${(3 * (k | float)) | int}'
                                          length: '${(14 * (k | float)) | int}'
                                          color: 0xE8EAED
                                          label_gap: '${(14 * (k | float)) | int}'
                                    # Uurwijzer (0..720 minuten = 12 uur)
                                    - range_from: 0
                                      range_to: 720
                                      angle_range: 360
                                      rotation: 270
                                      indicators:
                                        - line:
                                            id: wijzer_uur
                                            width: '${(8 * (k | float)) | int}'
                                            color: 0xFFFFFF
                                            length: '${(73 * (k | float)) | int}'
                              - obj:
                                  x: 0
                                  y: '${(318 * (k | float)) | int}'
                                  width: '${(480 * (k | float)) | int}'
                                  height: '${(140 * (k | float)) | int}'
                                  styles: leeg
                                  layout:
                                    type: FLEX
                                    flex_flow: COLUMN
                                    flex_align_main: CENTER
                                    flex_align_cross: CENTER
                                    flex_align_track: CENTER
                                    pad_row: '${(4 * (k | float)) | int}'
                                  widgets:
                                    - obj:
                                        width: SIZE_CONTENT
                                        height: SIZE_CONTENT
                                        styles: leeg
                                        layout:
                                          type: FLEX
