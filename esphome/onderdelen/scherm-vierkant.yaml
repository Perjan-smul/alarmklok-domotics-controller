                                          pad_column: '${(24 * (k | float)) | int}'
                                        widgets:
                                          - label:
                                              id: lbl_a_tijd
                                              text_font: f_groot
                                              styles: klok_tekst
                                              text: ""
                                          - label:
                                              id: lbl_a_temp
                                              text_font: f_groot
                                              styles: klok_sub
                                              text: ""
                                    - label:
                                        id: lbl_a_datum
                                        text_font: f_midden
                                        styles: klok_sub
                                        text: ""
                                    - label:
                                        id: lbl_a_wekker
                                        text_font: f_klein
                                        styles: klok_accent
                                        text: ""

                        # ---- 3. Gestapeld -----------------------------------
                        - obj:
                            id: ontwerp_gestapeld
