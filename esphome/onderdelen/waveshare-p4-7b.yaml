# =============================================================================
#  Hardware: Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
#  7" IPS 1024x600 (MIPI-DSI), GT911 touch, ESP32-C6 als wifi-coprocessor
#  (SDIO / esp-hosted). Audio (ES8311 + ES7210) staat in audio-p4.yaml.
#
#  Pinnen volgens de Waveshare-voorbeelden voor dit bord:
#    I2C (touch + audio)   SDA GPIO7, SCL GPIO8
#    Backlight             GPIO32 (PWM, geïnverteerd)
#    LCD reset             GPIO33 (zit in het ESPHome-model)
#    ESP32-C6 (SDIO)       standaard esp-hosted pinnen voor de ESP32-P4
# =============================================================================

esp32:
  variant: esp32p4
  # Het bord heeft 32 MB flash, maar OTA met 32 MB is in ESPHome nog
  # experimenteel. 16 MB is ruim voldoende.
  flash_size: 16MB
  # Productiechips zijn rev3. Heb je een vroeg exemplaar (bootlog toont
  # "chip revision: v1.x")? Zet dit dan op true.
  engineering_sample: false
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      # Instellingenbuffer (NVS) in PSRAM: ~10 kB meer intern geheugen (2026.10)
      nvs_cache_in_psram: true
    sdkconfig_options:
      # Uit EspControl, getest op echte P4-panelen (zie README, "Stabiliteit"):
      # meer stack voor de hoofdtaak (HTTPS, o.a. de C6-update) ...
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      # ... ruimere watchdog voor het opstarten van het scherm ...
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      # ... en de wifi-coprocessor (C6) zonder vooraf gereserveerd intern
      # geheugen, met zijn taken en buffers in PSRAM
      CONFIG_ESP_HOSTED_USE_MEMPOOL: "n"
      CONFIG_ESP_HOSTED_DFLT_TASK_FROM_SPIRAM: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"

psram:
  mode: hex
  speed: 200MHz
  # Het bord heeft altijd PSRAM; nodig voor nvs_cache_in_psram
  ignore_not_found: false

esp32_hosted:
  variant: ESP32C6
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54
  slot: 1

# Sneller en betrouwbaarder verbinden via de C6 (ESPHome-issue #13636)
wifi:
  fast_connect: true

i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

# ---- Scherm ----------------------------------------------------------------
# Voeding van de MIPI-DSI PHY (2,5 V via interne LDO-kanaal 3)
esp_ldo:
  - voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    id: scherm
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: i2c_bus
    display: scherm
    on_touch:
      - script.execute: aangeraakt

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO32
    inverted: true
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Schermhelderheid
    icon: mdi:brightness-6
    output: backlight_pwm
    # Na het opstarten altijd aan; niets bewaren (ESPHome 2026.10: restore_state)
    initial_state:
      state: ON
    restore_state: NONE
    default_transition_length: 500ms

# Audio (speaker en microfoons): zie audio-p4.yaml

# ---- Wat de kern van de hardware verwacht (zie kern.yaml) --------------------
script:
  # Geen klokchip op dit bord: niets te doen als de tijd via internet binnenkomt
  - id: hw_tijd_gesynchroniseerd
    then:
      - logger.log:
          level: DEBUG
          format: "Tijd gesynchroniseerd"
