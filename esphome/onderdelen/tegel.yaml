# Eén bedieningstegel. Een tik voert ${actie} uit op de entiteit uit Home
# Assistant (homeassistant.toggle voor lampen e.d., homeassistant.turn_on voor
# scènes). Naam, icoon en entiteit: zie tegel-instellingen.yaml.
button:
  id: tegel_${nr}
  grid_cell_row_pos: ${rij}
  grid_cell_column_pos: ${kolom}
  grid_cell_x_align: STRETCH
  grid_cell_y_align: STRETCH
  styles: tegel_stijl
  layout:
    type: FLEX
    flex_flow: COLUMN
    flex_align_main: CENTER
    flex_align_cross: CENTER
    flex_align_track: CENTER
  widgets:
    - label:
        id: tegel_${nr}_icoon_tekst
        text: ""
        text_font: f_icoon
    - label:
        id: tegel_${nr}_naam_tekst
        text: ""
        text_font: f_midden
  on_click:
    - homeassistant.action:
        action: ${actie}
        data:
          entity_id: !lambda return id(tegel_${nr}_entiteit).state;
