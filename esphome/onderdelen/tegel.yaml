# Eén bedieningstegel (stijl D): een vulling tot de helderheid, een rond vierkant
# icoonvlak, de naam, een statusregel en rechts het percentage. Als rij (breed)
# of als tegel in een raster; plek en kleuren zet tegel_ui.h (tegelui::opmaak).
# Een tik doet homeassistant.toggle (schakelaar) of homeassistant.turn_on
# (scène/script); links/rechts slepen over een rij dimt; lang drukken opent de
# detailpagina (detail-pagina.yaml). Naam, icoon, entiteit en soort: zie
# tegel-instellingen.yaml. Vars: nr, rij, kolom (beginplek in het raster).
button:
  id: tegel_${nr}
  grid_cell_row_pos: ${rij}
  grid_cell_column_pos: ${kolom}
  grid_cell_x_align: STRETCH
  grid_cell_y_align: STRETCH
  styles: tegel_stijl
  pad_all: 0
  # Aan: iets warmere kaart
  checked:
    bg_color: 0x34322E
  widgets:
    - obj:
        id: tegel_${nr}_vul
        x: 0
        y: 0
        width: 0
        height: 100%
        bg_color: 0x6F5E35
        bg_opa: COVER
        border_width: 0
        radius: '${(24 * (k | float)) | int}'
        clickable: false
        scrollable: false
        hidden: true
    - obj:
        id: tegel_${nr}_chip
        width: '${(46 * (k | float)) | int}'
        height: '${(46 * (k | float)) | int}'
        bg_color: 0x3E4350
        bg_opa: COVER
        border_width: 0
        radius: '${(15 * (k | float)) | int}'
        pad_all: 0
        clickable: false
        scrollable: false
        widgets:
          - label:
              id: tegel_${nr}_icoon_tekst
              align: CENTER
              text: ""
              text_font: f_icoon_tegel
    - label:
        id: tegel_${nr}_naam_tekst
        long_mode: DOT
        text: ""
        text_font: f_naam
        text_color: 0xF0F2F6
    - label:
        id: tegel_${nr}_status_tekst
        long_mode: DOT
        text: ""
        text_font: f_klein
        text_color: 0xA8AEBA
    - label:
        id: tegel_${nr}_pct
        text: ""
        text_font: f_naam
        text_color: 0xF0F2F6
        hidden: true
  on_click:
    - if:
        condition:
          lambda: return !id(lang_gedrukt) && tegelui::klik_mag(id(tegel_${nr}_slepen));
        then:
          - homeassistant.action:
              action: !lambda 'return std::string(id(tegel_${nr}_schakelaar) ? "homeassistant.toggle" : "homeassistant.turn_on");'
              data:
                entity_id: !lambda return id(tegel_${nr}_entiteit).state;
    - lambda: id(lang_gedrukt) = false;
  on_long_press:
    - if:
        condition:
          lambda: return id(tegel_${nr}_schakelaar) && tegelui::klik_mag(id(tegel_${nr}_slepen));
        then:
          - lambda: id(lang_gedrukt) = true;
          - script.execute: tegel_${nr}_detail
