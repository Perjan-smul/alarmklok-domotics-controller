# =============================================================================
#  Alarmklok + domotica-controller voor Home Assistant (ESPHome)
#
#  Hardware: Waveshare ESP32-P4-WIFI6-Touch-LCD-7B (7" touch, 1024x600, liggend)
#  Zie README.md voor installatie.
#
#  De wekker draait volledig op de klok zelf (tijd via NTP), dus hij gaat ook
#  af als Home Assistant even plat ligt.
#
#  Bestanden:
#    alarmklok.yaml                   <- dit bestand: instellingen + wekker-logica
#    onderdelen/waveshare-p4-7b.yaml  <- hardware (scherm, touch, audio, wifi)
#    onderdelen/scherm.yaml           <- de touch-interface (LVGL)
#    onderdelen/ha-bediening.yaml     <- statussen uit HA voor de bedieningspagina's
#    onderdelen/tegel*.yaml           <- één bedieningstegel
# =============================================================================

substitutions:
  name: alarmklok
  friendly_name: Alarmklok
  tijdzone: Europe/Amsterdam
  # Sensor uit Home Assistant die op de klokschermen staat.
  temperatuur_sensor: sensor.buitentemperatuur
  # Na zoveel minuten stopt een wekker die niet uitgezet wordt vanzelf.
  max_afgaan_minuten: "30"

  # ===========================================================================
  #  Home Assistant-pagina's (swipe links/rechts vanaf de klok)
  #  Iconen: zie de lijst in README.md.
  # ===========================================================================

  # ---- Pagina "Verlichting": 6 tegels + dimschuif ---------------------------
  # Een tik doet "homeassistant.toggle" (lamp, schakelaar, ventilator, ...).
  dim_lamp: light.slaapkamer
  licht_1_naam: Bedlamp
  licht_1_entity: light.slaapkamer
  licht_1_icoon: "\U000F095F"   # desk-lamp
  licht_2_naam: Plafond
  licht_2_entity: light.slaapkamer_plafond
  licht_2_icoon: "\U000F0769"   # ceiling-light
  licht_3_naam: Leeslamp
  licht_3_entity: light.leeslamp
  licht_3_icoon: "\U000F08DD"   # floor-lamp
  licht_4_naam: Gang
  licht_4_entity: light.gang
  licht_4_icoon: "\U000F0335"   # lightbulb
  licht_5_naam: Ventilator
  licht_5_entity: fan.slaapkamer
  licht_5_icoon: "\U000F0210"   # fan
  licht_6_naam: Alle lampen
  licht_6_entity: light.alle_lampen
  licht_6_icoon: "\U000F1253"   # lightbulb-group

  # ---- Pagina "Klimaat & rolluik" -------------------------------------------
  thermostaat: climate.slaapkamer
  rolluik: cover.slaapkamer

  # ---- Pagina "Muziek" --------------------------------------------------------
  mediaspeler: media_player.alarmklok_speaker
  radio_1_naam: NPO Radio 2
  radio_1_url: https://icecast.omroep.nl/radio2-bb-mp3
  radio_2_naam: NPO 3FM
  radio_2_url: https://icecast.omroep.nl/3fm-bb-mp3
  radio_3_naam: Radio 538
  radio_3_url: https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO538.mp3

  # ---- Pagina "Scènes": 6 knoppen ---------------------------------------------
  # Een tik doet "homeassistant.turn_on" (scene, script, automation, ...).
  scene_1_naam: Welterusten
  scene_1_entity: script.welterusten
  scene_1_icoon: "\U000F0904"   # power-sleep
  scene_2_naam: Opstaan
  scene_2_entity: scene.opstaan
  scene_2_icoon: "\U000F059C"   # weather-sunset-up
  scene_3_naam: Lezen
  scene_3_entity: scene.lezen
  scene_3_icoon: "\U000F06B5"   # lamp
  scene_4_naam: Film
  scene_4_entity: scene.film
  scene_4_icoon: "\U000F0FCE"   # movie-open
  scene_5_naam: Etenstijd
  scene_5_entity: scene.eten
  scene_5_icoon: "\U000F0A70"   # silverware-fork-knife
  scene_6_naam: Alles uit
  scene_6_entity: script.alles_uit
  scene_6_icoon: "\U000F140B"   # lightning-bolt

packages:
  hardware: !include onderdelen/waveshare-p4-7b.yaml
  scherm: !include onderdelen/scherm.yaml
  ha_bediening: !include onderdelen/ha-bediening.yaml
  licht_1: !include { file: onderdelen/tegel-status.yaml, vars: { nr: licht_1, entity: "${licht_1_entity}" } }
  licht_2: !include { file: onderdelen/tegel-status.yaml, vars: { nr: licht_2, entity: "${licht_2_entity}" } }
  licht_3: !include { file: onderdelen/tegel-status.yaml, vars: { nr: licht_3, entity: "${licht_3_entity}" } }
  licht_4: !include { file: onderdelen/tegel-status.yaml, vars: { nr: licht_4, entity: "${licht_4_entity}" } }
  licht_5: !include { file: onderdelen/tegel-status.yaml, vars: { nr: licht_5, entity: "${licht_5_entity}" } }
  licht_6: !include { file: onderdelen/tegel-status.yaml, vars: { nr: licht_6, entity: "${licht_6_entity}" } }

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - alarmklok.h
  on_boot:
    priority: -100
    then:
      - text_sensor.template.publish:
          id: wekker_status
          state: Wacht
      - lambda: id(ui_klaar) = true;
      - script.execute: ui_synchroniseren
      - script.execute: scherm_bijwerken

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Gebruikt dezelfde sleutel als de api hierboven
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:

# -----------------------------------------------------------------------------
#  Interne toestand
# -----------------------------------------------------------------------------
globals:
  - id: gaat_af
    type: bool
    initial_value: "false"
  - id: snoozet
    type: bool
    initial_value: "false"
  # Unix-tijd waarop de snooze afloopt (voor op het scherm)
  - id: snooze_tot
    type: time_t
    initial_value: "0"
  - id: laatste_aanraking_ms
    type: uint32_t
    initial_value: "0"
  - id: huidige_helderheid
    type: float
    initial_value: "-1"
  - id: nachtstand
    type: bool
    initial_value: "false"
  - id: overlay_zichtbaar
    type: bool
    initial_value: "false"
  # Instellingen worden geladen vóór de LVGL-interface bestaat; pas na het
  # opstarten mogen ze widgets bijwerken.
  - id: ui_klaar
    type: bool
    initial_value: "false"

# -----------------------------------------------------------------------------
#  Tijd: NTP, zodat de wekker ook zonder Home Assistant werkt
# -----------------------------------------------------------------------------
time:
  - platform: sntp
    id: klok
    timezone: ${tijdzone}
    on_time:
      - seconds: 0
        then:
          - script.execute: controleer_wekker
    on_time_sync:
      - script.execute: scherm_bijwerken

interval:
  - interval: 1s
    then:
      - script.execute: scherm_bijwerken
      - script.execute: helderheid_regelen

# -----------------------------------------------------------------------------
#  Instellingen die in Home Assistant verschijnen
# -----------------------------------------------------------------------------
datetime:
  - platform: template
    id: wektijd
    type: time
    name: Wektijd
    icon: mdi:alarm
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: ui_synchroniseren

  - platform: template
    id: nacht_vanaf
    type: time
    name: Nachtstand vanaf
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "22:30:00"

  - platform: template
    id: nacht_tot
    type: time
    name: Nachtstand tot
    icon: mdi:weather-sunny
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"

switch:
  - platform: template
    id: wekker_aan
    name: Wekker aan
    icon: mdi:alarm-check
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: ui_synchroniseren
    on_turn_off:
      - script.execute: stop_wekker

select:
  - platform: template
    id: wekdagen
    name: Wekdagen
    icon: mdi:calendar-week
    optimistic: true
    restore_value: true
    options:
      - Elke dag
      - Werkdagen
      - Weekend
    initial_option: Werkdagen
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: ui_synchroniseren

  - platform: template
    id: wekgeluid
    name: Wekgeluid
    icon: mdi:music-note
    optimistic: true
    restore_value: true
    # "Radio" laat Home Assistant een radiostream op de klok afspelen
    # (zie homeassistant/packages/alarmklok.yaml). Speelt er na 20 s nog
    # niets, dan valt de klok terug op het klassieke wekgeluid.
    options:
      - Klassiek
      - Zacht
      - Mario
      - Radio
    initial_option: Klassiek
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: ui_synchroniseren

  # Swipe omlaag/omhoog op de klok wisselt hiertussen
  - platform: template
    id: klokontwerp
    name: Klokontwerp
    icon: mdi:clock-digital
    optimistic: true
    restore_value: true
    options:
      - Digitaal
      - Analoog
      - Gestapeld
      - Info
    initial_option: Digitaal
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: toon_klokontwerp

number:
  - platform: template
    id: snooze_minuten
    name: Snooze duur
    icon: mdi:sleep
    unit_of_measurement: min
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 9

  - platform: template
    id: wakeup_minuten
    name: Wake-up light vooraf
    icon: mdi:weather-sunset-up
    unit_of_measurement: min
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 60
    step: 5
    initial_value: 20
    on_value:
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: ui_synchroniseren

  - platform: template
    id: volume
    name: Wekvolume
    icon: mdi:volume-high
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    min_value: 10
    max_value: 100
    step: 10
    initial_value: 80
    on_value:
      - lambda: id(zoemer_rtttl).set_gain(x / 100.0f);
      - if:
          condition:
            lambda: return id(ui_klaar);
          then:
            - script.execute: ui_synchroniseren

  - platform: template
    id: helderheid_dag
    name: Helderheid overdag
    icon: mdi:brightness-7
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 80

  - platform: template
    id: helderheid_nacht
    name: Helderheid 's nachts
    icon: mdi:brightness-3
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 50
    step: 1
    initial_value: 3

button:
  - platform: template
    name: Wekker stoppen
    icon: mdi:alarm-off
    on_press:
      - script.execute: stop_wekker
  - platform: template
    name: Snooze
    icon: mdi:alarm-snooze
    on_press:
      - script.execute: snooze_wekker
  - platform: template
    name: Wekker testen
    icon: mdi:alarm-bell
    entity_category: diagnostic
    on_press:
      - script.execute: start_wekker

text_sensor:
  - platform: template
    id: wekker_status
    name: Wekker status
    icon: mdi:alarm-light

binary_sensor:
  - platform: status
    id: api_verbonden
    name: Status

sensor:
  - platform: homeassistant
    id: buitentemperatuur
    entity_id: ${temperatuur_sensor}
    internal: true

  - platform: wifi_signal
    name: WiFi signaal
    update_interval: 60s
    entity_category: diagnostic

# -----------------------------------------------------------------------------
#  Wekker-logica
# -----------------------------------------------------------------------------
script:
  # Elke minuut: is het tijd voor het wake-up light of voor de wekker?
  - id: controleer_wekker
    then:
      - lambda: |-
          auto nu = id(klok).now();
          if (!nu.is_valid() || !id(wekker_aan).state)
            return;
          const std::string dagen = id(wekdagen).current_option().str();
          const int wek = id(wektijd).hour * 60 + id(wektijd).minute;

          if (nu.hour * 60 + nu.minute == wek && !id(gaat_af) &&
              alarmklok::wekdag_actief(dagen, nu.day_of_week)) {
            id(start_wekker).execute();
          }

          const int vooraf = (int) id(wakeup_minuten).state;
          if (vooraf > 0) {
            auto straks = ESPTime::from_epoch_local(nu.timestamp + vooraf * 60);
            if (straks.hour * 60 + straks.minute == wek &&
                alarmklok::wekdag_actief(dagen, straks.day_of_week)) {
              id(start_wakeup_light).execute(vooraf);
            }
          }

  - id: start_wakeup_light
    parameters:
      minuten: int
    then:
      - logger.log:
          format: "Wake-up light start (%d min)"
          args: [minuten]
      - homeassistant.event:
          event: esphome.alarmklok_wakeup
          data:
            minuten: !lambda return std::to_string(minuten);

  - id: start_wekker
    then:
      - script.stop: snooze_timer
      - lambda: |-
          id(gaat_af) = true;
          id(snoozet) = false;
      - text_sensor.template.publish:
          id: wekker_status
          state: Gaat af
      - lvgl.widget.hide: pagina_indicator
      - lvgl.page.show:
          id: pagina_wekker_gaat_af
          animation: NONE
      - script.execute: helderheid_regelen
      - homeassistant.event:
          event: esphome.alarmklok_wekker
          data:
            status: gaat_af
            geluid: !lambda return id(wekgeluid).current_option().str();
      - script.execute: max_afgaan_timer
      - if:
          condition:
            and:
              - lambda: return id(wekgeluid).current_option() == "Radio";
              - api.connected:
          then:
            - script.execute: radio_terugval
          else:
            - script.execute: speel_wekgeluid

  # Speelt de radio na 20 s nog niet, dan toch het wekgeluid laten klinken
  - id: radio_terugval
    mode: restart
    then:
      - delay: 20s
      - if:
          condition:
            and:
              - lambda: return id(gaat_af);
              - not:
                  media_player.is_playing: speler
          then:
            - script.execute: speel_wekgeluid

  - id: speel_wekgeluid
    mode: single
    then:
      - while:
          condition:
            lambda: return id(gaat_af);
          then:
            - rtttl.play:
                rtttl: !lambda return alarmklok::melodie(id(wekgeluid).current_option().str());
            - wait_until:
                condition:
                  not:
                    rtttl.is_playing:
            - delay: 1s

  - id: geluid_stoppen
    then:
      - script.stop: radio_terugval
      - rtttl.stop:
      - if:
          condition:
            lambda: return id(wekgeluid).current_option() == "Radio";
          then:
            - media_player.stop: speler

  - id: snooze_wekker
    then:
      - if:
          condition:
            lambda: return id(gaat_af);
          then:
            - lambda: |-
                id(gaat_af) = false;
                id(snoozet) = true;
                auto nu = id(klok).now();
                id(snooze_tot) = nu.is_valid()
                    ? nu.timestamp + (time_t) id(snooze_minuten).state * 60 : 0;
            - script.execute: geluid_stoppen
            - script.stop: max_afgaan_timer
            - text_sensor.template.publish:
                id: wekker_status
                state: Snooze
            - homeassistant.event:
                event: esphome.alarmklok_wekker
                data:
                  status: snooze
            - script.execute: naar_klokscherm
            - script.execute: snooze_timer

  - id: snooze_timer
    mode: restart
    then:
      - delay: !lambda return (uint32_t) id(snooze_minuten).state * 60 * 1000;
      - script.execute: start_wekker

  - id: max_afgaan_timer
    mode: restart
    then:
      - delay: ${max_afgaan_minuten}min
      - script.execute: stop_wekker

  - id: stop_wekker
    then:
      - script.stop: snooze_timer
      - script.stop: max_afgaan_timer
      - script.execute: geluid_stoppen
      - if:
          condition:
            lambda: return id(gaat_af) || id(snoozet);
          then:
            - lambda: |-
                id(gaat_af) = false;
                id(snoozet) = false;
            - homeassistant.event:
                event: esphome.alarmklok_wekker
                data:
                  status: gestopt
            - script.execute: naar_klokscherm
      - text_sensor.template.publish:
          id: wekker_status
          state: Wacht

  - id: naar_klokscherm
    then:
      - lvgl.page.show:
          id: pagina_hoofd
          animation: NONE
      - lvgl.tileview.select:
          id: tv_hoofd
          row: 0
          column: 0
          animated: true
      - script.execute: pagina_indicator_bijwerken

  # Aangeroepen bij elke aanraking van het scherm
  - id: aangeraakt
    then:
      - lambda: id(laatste_aanraking_ms) = millis();
      - script.execute: helderheid_regelen

  # ---------------------------------------------------------------------------
  #  Klokontwerpen (swipe omlaag/omhoog op de klok)
  # ---------------------------------------------------------------------------
  - id: toon_klokontwerp
    then:
      - lvgl.widget.hide: [ontwerp_digitaal, ontwerp_analoog, ontwerp_gestapeld, ontwerp_info]
      - if:
          condition:
            lambda: return id(klokontwerp).active_index().value_or(0) == 1;
          then:
            - lvgl.widget.show: ontwerp_analoog
      - if:
          condition:
            lambda: return id(klokontwerp).active_index().value_or(0) == 2;
          then:
            - lvgl.widget.show: ontwerp_gestapeld
      - if:
          condition:
            lambda: return id(klokontwerp).active_index().value_or(0) == 3;
          then:
            - lvgl.widget.show: ontwerp_info
      - if:
          condition:
            lambda: return id(klokontwerp).active_index().value_or(0) == 0;
          then:
            - lvgl.widget.show: ontwerp_digitaal
      - lvgl.label.update:
          id: lbl_ontwerp_stippen
          text: !lambda |-
            return alarmklok::stippen(id(klokontwerp).active_index().value_or(0), 4, "\n");

  # Stippen onderaan: op welke pagina ben je?
  - id: pagina_indicator_bijwerken
    then:
      - lvgl.label.update:
          id: pagina_indicator
          text: !lambda |-
            auto *tile = lv_tileview_get_tile_active(id(tv_hoofd));
            int index = tile == nullptr ? 0 : lv_obj_get_x(tile) / 1024;
            return alarmklok::stippen(index, 6, "");

  # ---------------------------------------------------------------------------
  #  Scherm
  # ---------------------------------------------------------------------------
  - id: scherm_bijwerken
    then:
      - lambda: |-
          auto nu = id(klok).now();
          std::string tijd = nu.is_valid() ? nu.strftime("%H:%M") : std::string("--:--");
          std::string datum = nu.is_valid()
              ? alarmklok::datum_tekst(nu.day_of_week, nu.day_of_month, nu.month)
              : std::string("Tijd ophalen...");

          char temp[16] = "";
          if (!std::isnan(id(buitentemperatuur).state))
            snprintf(temp, sizeof(temp), "%.1f°", id(buitentemperatuur).state);

          char wekker[64];
          if (id(snoozet) && id(snooze_tot) > 0) {
            auto t = ESPTime::from_epoch_local(id(snooze_tot));
            snprintf(wekker, sizeof(wekker), "Snooze tot %02d:%02d", t.hour, t.minute);
          } else if (id(wekker_aan).state) {
            snprintf(wekker, sizeof(wekker), "Wekker %02d:%02d  (%s)", id(wektijd).hour,
                     id(wektijd).minute, id(wekdagen).current_option().c_str());
          } else {
            snprintf(wekker, sizeof(wekker), "Wekker uit");
          }

          // Digitaal
          lv_label_set_text(id(lbl_tijd), tijd.c_str());
          lv_label_set_text(id(lbl_datum), datum.c_str());
          lv_label_set_text(id(lbl_temperatuur), temp);
          lv_label_set_text(id(lbl_wekker_info), wekker);
          lv_label_set_text(id(lbl_verbinding),
              id(api_verbonden).state ? "" : "Geen verbinding met Home Assistant");
          // Analoog (de wijzers worden hieronder gezet)
          lv_label_set_text(id(lbl_a_tijd), tijd.c_str());
          lv_label_set_text(id(lbl_a_datum), datum.c_str());
          lv_label_set_text(id(lbl_a_temp), temp);
          lv_label_set_text(id(lbl_a_wekker), wekker);
          // Gestapeld
          lv_label_set_text(id(lbl_s_uur), tijd.substr(0, 2).c_str());
          lv_label_set_text(id(lbl_s_min), tijd.substr(3, 2).c_str());
          lv_label_set_text(id(lbl_s_datum), datum.c_str());
          lv_label_set_text(id(lbl_s_wekker), wekker);
          // Info
          lv_label_set_text(id(lbl_i_tijd), tijd.c_str());
          lv_label_set_text(id(lbl_i_datum), datum.c_str());
          lv_label_set_text(id(lbl_i_temp), temp[0] ? temp : "--");
          lv_label_set_text(id(lbl_i_wekker), wekker);
          char wakeup[32];
          if (id(wakeup_minuten).state > 0)
            snprintf(wakeup, sizeof(wakeup), "%.0f min vooraf", id(wakeup_minuten).state);
          else
            snprintf(wakeup, sizeof(wakeup), "Uit");
          lv_label_set_text(id(lbl_i_wakeup), wakeup);
          // Wekker gaat af
          lv_label_set_text(id(lbl_tijd_alarm), tijd.c_str());
      - if:
          condition:
            lambda: return id(klok).now().is_valid();
          then:
            - lvgl.indicator.update:
                id: wijzer_uur
                value: !lambda |-
                  auto nu = id(klok).now();
                  return (nu.hour % 12) * 60 + nu.minute;
            - lvgl.indicator.update:
                id: wijzer_minuut
                value: !lambda return id(klok).now().minute;
            - lvgl.indicator.update:
                id: wijzer_seconde
                value: !lambda return id(klok).now().second;

  # Alle widgets gelijkzetten met de huidige instellingen
  - id: ui_synchroniseren
    mode: queued
    max_runs: 3
    then:
      - lvgl.roller.update:
          id: rl_uur
          selected_index: !lambda return id(wektijd).hour;
      - lvgl.roller.update:
          id: rl_minuut
          selected_index: !lambda return id(wektijd).minute / 5;
      - lvgl.widget.update:
          id: sw_wekker
          state:
            checked: !lambda return id(wekker_aan).state;
      - lvgl.dropdown.update:
          id: dd_wekdagen
          selected_index: !lambda return id(wekdagen).active_index().value_or(0);
      - lvgl.dropdown.update:
          id: dd_wekgeluid
          selected_index: !lambda return id(wekgeluid).active_index().value_or(0);
      - lvgl.slider.update:
          id: sl_volume
          value: !lambda return id(volume).state;
      - lvgl.label.update:
          id: lbl_volume
          text:
            format: "Wekvolume: %.0f%%"
            args: [id(volume).state]
      - lvgl.slider.update:
          id: sl_wakeup
          value: !lambda return id(wakeup_minuten).state;
      - lvgl.label.update:
          id: lbl_wakeup
          text:
            format: "Wake-up light: %.0f min vooraf"
            args: [id(wakeup_minuten).state]
      - script.execute: toon_klokontwerp
      - script.execute: scherm_bijwerken

  # Helderheid: overdag/'s nachts, en na aanraken even fel.
  # In de nachtstand vangt een onzichtbare laag de eerste tik op, zodat je in
  # het donker niet per ongeluk een lamp aanzet als je het scherm wekt.
  - id: helderheid_regelen
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          auto nu = id(klok).now();
          bool nacht = false;
          if (nu.is_valid()) {
            nacht = alarmklok::in_venster(nu.hour * 60 + nu.minute,
                id(nacht_vanaf).hour * 60 + id(nacht_vanaf).minute,
                id(nacht_tot).hour * 60 + id(nacht_tot).minute);
          }
          id(nachtstand) = nacht;
      - if:
          condition:
            lambda: |-
              bool actief = id(gaat_af) || millis() - id(laatste_aanraking_ms) < 20000;
              return id(nachtstand) && !actief;
          then:
            - if:
                condition:
                  lambda: return !id(overlay_zichtbaar);
                then:
                  - lambda: id(overlay_zichtbaar) = true;
                  - script.execute: naar_klokscherm
                  - lvgl.widget.hide: [pagina_indicator, lbl_ontwerp_stippen]
                  - lvgl.widget.show: wek_laag
                  - lvgl.style.update:
                      id: klok_tekst
                      text_color: 0x9A2A1A
                  - lvgl.style.update:
                      id: klok_sub
                      text_color: 0x5A1A10
                  - lvgl.style.update:
                      id: klok_accent
                      text_color: 0x5A1A10
          else:
            - if:
                condition:
                  lambda: return id(overlay_zichtbaar);
                then:
                  - lambda: id(overlay_zichtbaar) = false;
                  - lvgl.widget.hide: wek_laag
                  - lvgl.widget.show: lbl_ontwerp_stippen
                  - lvgl.style.update:
                      id: klok_tekst
                      text_color: 0xFFFFFF
                  - lvgl.style.update:
                      id: klok_sub
                      text_color: 0xB0B6C0
                  - lvgl.style.update:
                      id: klok_accent
                      text_color: 0xF5A623
                  - if:
                      condition:
                        lambda: return !id(gaat_af);
                      then:
                        - lvgl.widget.show: pagina_indicator
      - lambda: |-
          float doel;
          if (id(gaat_af))
            doel = 1.0f;
          else if (id(overlay_zichtbaar))
            doel = id(helderheid_nacht).state / 100.0f;
          else
            doel = id(helderheid_dag).state / 100.0f;
          if (std::fabs(doel - id(huidige_helderheid)) > 0.005f) {
            id(huidige_helderheid) = doel;
            auto call = id(backlight).turn_on();
            call.set_brightness(doel);
            call.perform();
          }
