# =============================================================================
#  Alarmklok + domotica-controller voor Home Assistant (ESPHome)
#  7"-versie
#
#  Hardware: Waveshare ESP32-P4-WIFI6-Touch-LCD-7B (7" touch, 1024x600, liggend)
#  Zie README.md voor installatie.
#
#  De wekkers draaien volledig op de klok zelf (tijd via NTP), dus ze gaan ook
#  af als Home Assistant even plat ligt.
#
#  Bestanden:
#    alarmklok.yaml                   <- dit bestand: de 7"-klok
#    alarmklok-4inch.yaml             <- de 4"-klok (Bosun-bord, zoemer)
#    alarmklok-4b.yaml                <- de 4"-klok met speaker en microfoons (4B)
#    instellingen.yaml                <- tegels, pagina's enz.: hier pas je dingen aan
#    onderdelen/kern.yaml             <- wekkers, instellingen en logica (gedeeld)
#    onderdelen/waveshare-p4-7b.yaml  <- hardware 7" (scherm, touch, wifi)
#    onderdelen/waveshare-p4-4b.yaml  <- hardware 4B (scherm, touch, wifi, relais)
#    onderdelen/audio-p4.yaml         <- speaker en microfoons van 7" en 4B
#    onderdelen/spraak.yaml           <- spraakassistent (7" en 4B)
#    onderdelen/waveshare-s3-4.yaml   <- hardware 4" (scherm, touch, zoemer, RTC)
#    onderdelen/scherm.yaml           <- de touch-interface voor 1024x600
#    onderdelen/scherm-vierkant.yaml  <- de touch-interface voor vierkante schermen
#    onderdelen/ha-bediening.yaml     <- statussen uit HA voor de bedieningspagina's
#    onderdelen/wekker.yaml           <- één wekker (tijd, aan/uit, dagen)
#    onderdelen/tegel.yaml            <- één bedieningstegel op het scherm
#    onderdelen/tegel-instellingen.yaml <- naam, entiteit en icoon van een tegel
# =============================================================================

substitutions:
  name: alarmklok
  friendly_name: Alarmklok

packages:
  instellingen: !include instellingen.yaml
  kern: !include onderdelen/kern.yaml
  hardware: !include onderdelen/waveshare-p4-7b.yaml
  audio: !include onderdelen/audio-p4.yaml
  audio_transport: !include onderdelen/audio-p4-i2s.yaml
  c6_update: !include onderdelen/c6-update.yaml
  spraak: !include onderdelen/spraak.yaml
  scherm: !include onderdelen/scherm.yaml
