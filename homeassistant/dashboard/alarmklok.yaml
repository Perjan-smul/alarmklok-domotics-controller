# Dashboard voor de instellingen van 'Alarmklok' (gemaakt met tools/dashboard.py)
title: Alarmklok
views:
  - title: Klok
    path: klok
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: entities
            title: Wekkers
            entities:
              - entity: switch.alarmklok_wekker_1_aan
                name: Wekker 1
              - entity: time.alarmklok_wekker_1_tijd
                name: Tijd
              - entity: select.alarmklok_wekker_1_dagen
                name: Dagen
              - entity: switch.alarmklok_wekker_2_aan
                name: Wekker 2
              - entity: time.alarmklok_wekker_2_tijd
                name: Tijd
              - entity: select.alarmklok_wekker_2_dagen
                name: Dagen
              - entity: switch.alarmklok_wekker_3_aan
                name: Wekker 3
              - entity: time.alarmklok_wekker_3_tijd
                name: Tijd
              - entity: select.alarmklok_wekker_3_dagen
                name: Dagen
      - type: grid
        cards:
          - type: entities
            title: Wekker-opties
            entities:
              - entity: switch.alarmklok_volgende_wekker_overslaan
              - entity: switch.alarmklok_niet_op_feestdagen
              - entity: number.alarmklok_snooze_duur
              - entity: number.alarmklok_wake_up_light_vooraf
              - entity: select.alarmklok_wekgeluid
              - entity: number.alarmklok_wekvolume
              - entity: number.alarmklok_wekgeluid_oplopen
              - entity: button.alarmklok_wekker_testen
              - entity: sensor.alarmklok_volgende_wekker
          - type: entities
            title: Nachtstand
            entities:
              - entity: switch.alarmklok_nachtstand_vanaf_zonsondergang
              - entity: time.alarmklok_nachtstand_vanaf
              - entity: time.alarmklok_nachtstand_tot
              - entity: switch.alarmklok_nachtstand_bij_weinig_licht
              - entity: number.alarmklok_nachtstand_onder
              - entity: text.alarmklok_lichtsensor
              - entity: number.alarmklok_helderheid_overdag
              - entity: number.alarmklok_helderheid_s_nachts
              - entity: light.alarmklok_schermhelderheid
      - type: grid
        cards:
          - type: entities
            title: Pagina's (swipen links/rechts)
            entities:
              - entity: select.alarmklok_pagina_1
              - entity: select.alarmklok_pagina_2
              - entity: select.alarmklok_pagina_3
              - entity: select.alarmklok_pagina_4
              - entity: select.alarmklok_pagina_5
              - entity: select.alarmklok_pagina_6
              - entity: switch.alarmklok_swipe_animatie
              - entity: select.alarmklok_indeling_verlichting
              - entity: select.alarmklok_indeling_scenes
                name: Indeling scènes
          - type: entities
            title: Uiterlijk
            entities:
              - entity: select.alarmklok_kleurthema
              - entity: select.alarmklok_accentkleur
              - entity: select.alarmklok_klokontwerp
              - entity: select.alarmklok_klokkleur
              - entity: select.alarmklok_wijzerplaat
              - entity: select.alarmklok_nachtklok
              - entity: select.alarmklok_secondewijzer
          - type: entities
            title: Klokontwerpen bij omhoog/omlaag swipen
            entities:
              - entity: switch.alarmklok_klokontwerp_digitaal
                name: Digitaal
              - entity: switch.alarmklok_klokontwerp_analoog
                name: Analoog
              - entity: switch.alarmklok_klokontwerp_gestapeld
                name: Gestapeld
              - entity: switch.alarmklok_klokontwerp_info
                name: Info
              - entity: switch.alarmklok_klokontwerp_zon
                name: Zon
              - entity: switch.alarmklok_klokontwerp_zwevend
                name: Zwevend
              - entity: switch.alarmklok_klokontwerp_maan
                name: Maan
              - entity: switch.alarmklok_klokontwerp_vierkant
                name: Vierkant
      - type: grid
        cards:
          - type: entities
            title: Bediening (Klimaat, Muziek, dimmer, camera)
            entities:
              - entity: text.alarmklok_thermostaat
              - entity: text.alarmklok_rolluik
              - entity: text.alarmklok_rolluik_batterij
              - entity: text.alarmklok_mediaspeler
              - entity: text.alarmklok_dimlamp
              - entity: text.alarmklok_dimlamp_naam
              - entity: text.alarmklok_camera
              - entity: text.alarmklok_deurbel
              - entity: number.alarmklok_camera_verversen
