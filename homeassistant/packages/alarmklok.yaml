# =============================================================================
#  Home Assistant-pakket voor de Alarmklok
#
#  Installatie: zie README.md. Kort:
#    1. Zet in configuration.yaml:
#         homeassistant:
#           packages: !include_dir_named packages
#    2. Kopieer dit bestand naar /config/packages/alarmklok.yaml
#    3. Pas de entiteiten in de "variables"-blokken hieronder aan.
#       (De scripts "Alarmklok: tegel instellen" en "Alarmklok: entiteit
#       kiezen" werken zonder aanpassing, voor elke klok.)
#    4. Herstart Home Assistant.
#
#  Zet bij de ESPHome-integratie van de klok de optie "Sta het apparaat toe
#  Home Assistant-acties uit te voeren" aan. Anders werken de tegels en de
#  events van de wekker niet.
# =============================================================================

script:
  # ---------------------------------------------------------------------------
  #  Instellingen van de klok met de entiteitkiezer van Home Assistant.
  #  Een tekstveld van ESPHome heeft geen kiezer; deze scripts wel. Op het
  #  instellingendashboard (homeassistant/dashboard/) opent de knop "Tegel
  #  instellen…" of "Entiteit kiezen…" het formulier (HA 2024.3 of nieuwer).
  #  Het script zoekt bij de gekozen klok zelf de juiste instelling op, dus het
  #  werkt voor elke klok. Een andere entiteit laat de klok even herstarten.
  # ---------------------------------------------------------------------------
  alarmklok_tegel_instellen:
    alias: "Alarmklok: tegel instellen"
    description: Kies voor een tegel op de klok een entiteit, naam, icoon en soort.
    icon: mdi:gesture-tap-button
    mode: queued
    fields:
      klok:
        name: Klok
        required: true
        selector:
          device:
            filter:
              integration: esphome
      pagina:
        name: Pagina
        required: true
        default: Verlichting
        selector:
          select:
            options: [Verlichting, Scènes]
      tegel:
        name: Tegel
        description: >-
          Nummer van de tegel. Verlichting met "Rijen + knoppen": 1-4 zijn de
          rijen, 5-8 de knoppen (knop 1 = tegel 5).
        required: true
        default: 1
        selector:
          number:
            min: 1
            max: 9
            mode: box
      entiteit:
        name: Entiteit
        description: Leeg laten = niet wijzigen.
        selector:
          entity:
      naam:
        name: Naam
        description: Leeg = de naam van de gekozen entiteit.
        selector:
          text:
      icoon:
        name: Icoon
        description: Leeg = niet wijzigen.
        selector:
          select:
            options:
              - lightbulb
              - lightbulb-on
              - lightbulb-group
              - ceiling-light
              - floor-lamp
              - desk-lamp
              - lamp
              - blinds
              - window-shutter
              - roller-shade
              - curtains
              - music
              - radio
              - radio-tower
              - speaker
              - television
              - movie-open
              - fan
              - radiator
              - thermostat
              - power-sleep
              - weather-night
              - weather-sunset-up
              - home
              - sofa
              - bed
              - silverware-fork-knife
              - lightning-bolt
      soort:
        name: Soort
        description: >-
          Automatisch: scènes, scripts en knoppen alleen aanzetten, de rest
          aan/uit. Leeg = niet wijzigen.
        selector:
          select:
            options: [Automatisch, Aan/uit, Scène/script]
      verbergen:
        name: Tegel verbergen
        description: Maakt de entiteit leeg; de tegel verdwijnt van de klok.
        default: false
        selector:
          boolean:
    sequence:
      - variables:
          basis: >-
            tegel_{{ 'verlichting' if pagina == 'Verlichting' else 'scene' }}_{{ tegel | int }}
          lijst: "{{ device_entities(klok) }}"
          e_entiteit: >-
            {{ lijst | select('search', '^text[.].*_' ~ basis ~ '_entiteit$') | first | default('') }}
          e_naam: >-
            {{ lijst | select('search', '^text[.].*_' ~ basis ~ '_naam$') | first | default('') }}
          e_icoon: >-
            {{ lijst | select('search', '^select[.].*_' ~ basis ~ '_icoon$') | first | default('') }}
          e_soort: >-
            {{ lijst | select('search', '^select[.].*_' ~ basis ~ '_soort$') | first | default('') }}
          nieuw: "{{ entiteit | default('', true) }}"
          nieuwe_naam: >-
            {{ (naam | default('', true)) or (state_attr(nieuw, 'friendly_name') if nieuw else '') or '' }}
      - if: "{{ not e_entiteit }}"
        then:
          - stop: Deze tegel bestaat niet op deze klok (kies een ESPHome-alarmklok en tegel 1-9)
            error: true
      - if: "{{ verbergen | default(false) }}"
        then:
          - action: text.set_value
            target:
              entity_id: "{{ e_entiteit }}"
            data:
              value: ""
          - stop: Tegel verborgen
      - if: "{{ nieuwe_naam != '' and e_naam != '' }}"
        then:
          - action: text.set_value
            target:
              entity_id: "{{ e_naam }}"
            data:
              value: "{{ nieuwe_naam[:24] }}"
      - if: "{{ (icoon | default('', true)) != '' and e_icoon != '' }}"
        then:
          - action: select.select_option
            target:
              entity_id: "{{ e_icoon }}"
            data:
              option: "{{ icoon }}"
      - if: "{{ (soort | default('', true)) != '' and e_soort != '' }}"
        then:
          - action: select.select_option
            target:
              entity_id: "{{ e_soort }}"
            data:
              option: "{{ soort }}"
      # De entiteit als laatste: daarna herstart de klok even
      - if: "{{ nieuw != '' }}"
        then:
          - action: text.set_value
            target:
              entity_id: "{{ e_entiteit }}"
            data:
              value: "{{ nieuw }}"

  alarmklok_entiteit_kiezen:
    alias: "Alarmklok: entiteit kiezen"
    description: >-
      Kies de thermostaat, het rolluik, de mediaspeler, de dimlamp, de
      lichtsensor of (7" en 4B) de camera van de klok.
    icon: mdi:form-select
    mode: queued
    fields:
      klok:
        name: Klok
        required: true
        selector:
          device:
            filter:
              integration: esphome
      instelling:
        name: Instelling
        required: true
        default: Thermostaat
        selector:
          select:
            options:
              - Thermostaat
              - Rolluik
              - Rolluik batterij
              - Mediaspeler
              - Dimlamp
              - Lichtsensor
              - Camera
              - Deurbel
      entiteit:
        name: Entiteit
        selector:
          entity:
      leegmaken:
        name: Leegmaken
        description: Niets gebruiken (bijvoorbeeld geen dimmerkaart).
        default: false
        selector:
          boolean:
    sequence:
      - variables:
          naam_id: "{{ instelling | lower | replace(' ', '_') }}"
          lijst: "{{ device_entities(klok) }}"
          doel: >-
            {{ lijst | select('search', '^text[.].*_' ~ naam_id ~ '$') | first | default('') }}
          waarde: >-
            {{ '' if leegmaken | default(false) else (entiteit | default('', true)) }}
      - if: "{{ not doel }}"
        then:
          - stop: Deze instelling bestaat niet op deze klok
            error: true
      - if: "{{ waarde == '' and not (leegmaken | default(false)) }}"
        then:
          - stop: Kies een entiteit of zet Leegmaken aan
            error: true
      # Bij de dimlamp ook de naam op de dimmerkaart
      - if: "{{ instelling == 'Dimlamp' and waarde != '' }}"
        then:
          - action: text.set_value
            target:
              entity_id: >-
                {{ lijst | select('search', '^text[.].*_dimlamp_naam$') | first | default('') }}
            data:
              value: "{{ (state_attr(waarde, 'friendly_name') or waarde)[:24] }}"
            continue_on_error: true
      - action: text.set_value
        target:
          entity_id: "{{ doel }}"
        data:
          value: "{{ waarde }}"

  # Voorbeeld voor scèneknop 1 ("Welterusten"). Pas aan naar wens.
  welterusten:
    alias: Welterusten
    icon: mdi:power-sleep
    mode: single
    sequence:
      - action: light.turn_off
        target:
          area_id: woonkamer
        continue_on_error: true
      - action: light.turn_on
        target:
          entity_id: light.slaapkamer
        data:
          brightness_pct: 5
          color_temp_kelvin: 2200
        continue_on_error: true
      - delay: "00:05:00"
      - action: light.turn_off
        target:
          entity_id: light.slaapkamer
        continue_on_error: true

  # Voorbeeld voor scèneknop 6 ("Alles uit").
  alles_uit:
    alias: Alles uit
    icon: mdi:lightning-bolt
    mode: single
    sequence:
      - action: light.turn_off
        target:
          entity_id: all
      - action: media_player.media_stop
        target:
          entity_id: all
        continue_on_error: true

automation:
  # ---------------------------------------------------------------------------
  #  Wake-up light: de klok stuurt dit event "Wake-up light vooraf" minuten
  #  voor de wektijd (van welke wekker dan ook). In trigger.event.data.klok
  #  staat welke klok het is, als je per klok een andere lamp wilt. De lamp loopt dan langzaam op als een zonsopgang.
  # ---------------------------------------------------------------------------
  - id: alarmklok_wakeup_light
    alias: "Alarmklok: wake-up light"
    mode: restart
    variables:
      bedlamp: light.slaapkamer
    triggers:
      - trigger: event
        event_type: esphome.alarmklok_wakeup
    actions:
      - action: light.turn_on
        target:
          entity_id: "{{ bedlamp }}"
        data:
          brightness_pct: 1
          color_temp_kelvin: 2200
      - delay: 2
      - action: light.turn_on
        target:
          entity_id: "{{ bedlamp }}"
        data:
          brightness_pct: 100
          color_temp_kelvin: 4000
          transition: "{{ (trigger.event.data.minuten | int(20)) * 60 }}"

  # ---------------------------------------------------------------------------
  #  Wekken met de radio (als "Wekgeluid" op "Radio" staat).
  #  Elke klok heeft zijn eigen speaker in "speakers" hieronder: de 7" en de
  #  4B spelen de radio zelf, de 4" (Bosun-bord) heeft geen speaker en
  #  gebruikt er een uit Home Assistant.
  #  - 7" en 4B: het volume regelt de klok zelf ("Wekvolume", "Wekgeluid
  #    oplopen"). Speelt er na 20 s niets, dan klinkt het eigen wekgeluid.
  #  - 4": de klok piept na 60 s toch, als vangnet.
  # ---------------------------------------------------------------------------
  - id: alarmklok_radio
    alias: "Alarmklok: wekken met radio"
    mode: single
    variables:
      # Klok (de "name" uit de ESPHome-configuratie) -> speaker
      speakers:
        alarmklok: media_player.alarmklok_speaker
        alarmklok-4inch: media_player.slaapkamer
        alarmklok-4b: media_player.alarmklok_4b_speaker
      speaker: "{{ speakers.get(trigger.event.data.klok, 'media_player.alarmklok_speaker') }}"
      # NPO Radio 2 (MP3-stream); vervang door je eigen favoriet
      stream: https://icecast.omroep.nl/radio2-bb-mp3
    triggers:
      - trigger: event
        event_type: esphome.alarmklok_wekker
        event_data:
          status: gaat_af
          geluid: Radio
    actions:
      - action: media_player.play_media
        target:
          entity_id: "{{ speaker }}"
        data:
          media_content_id: "{{ stream }}"
          media_content_type: music

  # Snooze of stop: de radio weer uit. De 7"-klok doet dat zelf al; voor een
  # klok zonder speaker moet Home Assistant het doen.
  - id: alarmklok_radio_stoppen
    alias: "Alarmklok: radio uit bij snooze of stop"
    mode: single
    variables:
      speakers:
        alarmklok-4inch: media_player.slaapkamer
      speaker: "{{ speakers.get(trigger.event.data.klok, '') }}"
    triggers:
      - trigger: event
        event_type: esphome.alarmklok_wekker
        event_data:
          status: snooze
      - trigger: event
        event_type: esphome.alarmklok_wekker
        event_data:
          status: gestopt
    conditions:
      - condition: template
        value_template: "{{ speaker != '' and states(speaker) == 'playing' }}"
    actions:
      - action: media_player.media_stop
        target:
          entity_id: "{{ speaker }}"

  # ---------------------------------------------------------------------------
  #  Goedemorgen: na het uitzetten van de wekker het rolluik open.
  #  Event: esphome.alarmklok_wekker  data: status = gaat_af | snooze | gestopt,
  #  klok = alarmklok | alarmklok-4inch
  # ---------------------------------------------------------------------------
  - id: alarmklok_goedemorgen
    alias: "Alarmklok: goedemorgen na uitzetten wekker"
    mode: single
    variables:
      rolluik: cover.slaapkamer
    triggers:
      - trigger: event
        event_type: esphome.alarmklok_wekker
        event_data:
          status: gestopt
    actions:
      - action: cover.open_cover
        target:
          entity_id: "{{ rolluik }}"
        continue_on_error: true

  # ---------------------------------------------------------------------------
  #  Batterij bijna leeg: melding op de klok zodra een batterij (bv. van de
  #  SwitchBot Curtain 3) onder de grens komt, en daarna elke ochtend opnieuw
  #  tot hij weer geladen is. Zet je eigen batterijsensoren in "batterijen"
  #  (twee keer: bij de trigger en bij de variabelen). 's Nachts wacht de
  #  melding tot je het scherm aanraakt. Voor de 4"-klok:
  #  esphome.alarmklok_4inch_melding.
  # ---------------------------------------------------------------------------
  - id: alarmklok_batterij_bijna_leeg
    alias: "Alarmklok: batterij bijna leeg"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id:
          - sensor.slaapkamer_gordijn_battery
        below: 20
      - trigger: time
        at: "08:00:00"
    variables:
      grens: 20
      batterijen:
        - sensor.slaapkamer_gordijn_battery
      # "Gordijn slaapkamer: 15%" voor elke batterij onder de grens
      leeg: >-
        {%- set ns = namespace(lijst=[]) -%}
        {%- for e in batterijen if has_value(e) and states(e) | float(100) < grens -%}
        {%- set ns.lijst = ns.lijst + [state_attr(e, 'friendly_name') ~ ': ' ~ (states(e) | float) | round(0) | int ~ '%'] -%}
        {%- endfor -%}
        {{- ns.lijst -}}
    conditions:
      - condition: template
        value_template: "{{ leeg | count > 0 }}"
    actions:
      - action: esphome.alarmklok_melding
        data:
          titel: Batterij bijna leeg
          tekst: "{{ leeg | join('\n') }}"
          icoon: battery-alert

  # ---------------------------------------------------------------------------
  #  Voorbeeld: melding op de klok als de wasmachine klaar is. Haal de #'s weg
  #  en vul je eigen sensor in. Overdag verschijnt de melding meteen, 's nachts
  #  pas als je het scherm aanraakt. Voor de 4"-klok: esphome.alarmklok_4inch_melding.
  # ---------------------------------------------------------------------------
