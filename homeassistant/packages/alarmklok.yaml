# =============================================================================
#  Home Assistant-pakket voor de Alarmklok
#
#  Installatie: zie README.md. Kort:
#    1. Zet in configuration.yaml:
#         homeassistant:
#           packages: !include_dir_named packages
#    2. Kopieer dit bestand naar /config/packages/alarmklok.yaml
#    3. Pas de entiteiten in de "variables"-blokken hieronder aan.
#    4. Herstart Home Assistant.
#
#  Zet bij de ESPHome-integratie van de klok de optie "Sta het apparaat toe
#  Home Assistant-acties uit te voeren" aan. Anders werken de tegels en de
#  events van de wekker niet.
# =============================================================================

script:
  # Voorbeeld voor scèneknop 1 ("Welterusten"). Pas aan naar wens.
  welterusten:
    alias: Welterusten
    icon: mdi:power-sleep
    mode: single
    sequence:
      - action: light.turn_off
        target:
          area_id: woonkamer
        continue_on_error: true
      - action: light.turn_on
        target:
          entity_id: light.slaapkamer
        data:
          brightness_pct: 5
          color_temp_kelvin: 2200
        continue_on_error: true
      - delay: "00:05:00"
      - action: light.turn_off
        target:
          entity_id: light.slaapkamer
        continue_on_error: true

  # Voorbeeld voor scèneknop 6 ("Alles uit").
  alles_uit:
    alias: Alles uit
    icon: mdi:lightning-bolt
    mode: single
    sequence:
      - action: light.turn_off
        target:
          entity_id: all
      - action: media_player.media_stop
        target:
          entity_id: all
        continue_on_error: true

automation:
  # ---------------------------------------------------------------------------
  #  Wake-up light: de klok stuurt dit event "Wake-up light vooraf" minuten
  #  voor de wektijd (van welke wekker dan ook). De lamp loopt dan langzaam op als een zonsopgang.
  # ---------------------------------------------------------------------------
  - id: alarmklok_wakeup_light
    alias: "Alarmklok: wake-up light"
    mode: restart
    variables:
      bedlamp: light.slaapkamer
    triggers:
      - trigger: event
        event_type: esphome.alarmklok_wakeup
    actions:
      - action: light.turn_on
        target:
          entity_id: "{{ bedlamp }}"
        data:
          brightness_pct: 1
          color_temp_kelvin: 2200
      - delay: 2
      - action: light.turn_on
        target:
          entity_id: "{{ bedlamp }}"
        data:
          brightness_pct: 100
          color_temp_kelvin: 4000
          transition: "{{ (trigger.event.data.minuten | int(20)) * 60 }}"

  # ---------------------------------------------------------------------------
  #  Wekken met de radio (als "Wekgeluid" op "Radio" staat).
  #  Speelt er na 20 s niets, dan laat de klok zelf het wekgeluid horen.
  #  Het volume regelt de klok zelf: "Wekvolume", en met "Wekgeluid oplopen"
  #  begint de radio zacht en wordt hij langzaam luider.
  # ---------------------------------------------------------------------------
  - id: alarmklok_radio
    alias: "Alarmklok: wekken met radio"
    mode: single
    variables:
      speaker: media_player.alarmklok_speaker
      # NPO Radio 2 (MP3-stream); vervang door je eigen favoriet
      stream: https://icecast.omroep.nl/radio2-bb-mp3
    triggers:
      - trigger: event
        event_type: esphome.alarmklok_wekker
        event_data:
          status: gaat_af
          geluid: Radio
    actions:
      - action: media_player.play_media
        target:
          entity_id: "{{ speaker }}"
        data:
          media_content_id: "{{ stream }}"
          media_content_type: music

  # ---------------------------------------------------------------------------
  #  Goedemorgen: na het uitzetten van de wekker het rolluik open.
  #  Event: esphome.alarmklok_wekker  data: status = gaat_af | snooze | gestopt
  # ---------------------------------------------------------------------------
  - id: alarmklok_goedemorgen
    alias: "Alarmklok: goedemorgen na uitzetten wekker"
    mode: single
    variables:
      rolluik: cover.slaapkamer
    triggers:
      - trigger: event
        event_type: esphome.alarmklok_wekker
        event_data:
          status: gestopt
    actions:
      - action: cover.open_cover
        target:
          entity_id: "{{ rolluik }}"
        continue_on_error: true
