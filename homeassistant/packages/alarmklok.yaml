  #   alias: "Alarmklok: melding wasmachine klaar"
  #   triggers:
  #     - trigger: state
  #       entity_id: sensor.wasmachine_status
  #       to: klaar
  #   actions:
  #     - action: esphome.alarmklok_melding
  #       data:
  #         titel: Wasmachine klaar
  #         tekst: De was kan eruit.
  #         icoon: washing-machine
